<body>
<div class="wrap">
  <section class="hero">
    <span class="tag">CEFR B1 · Multiple Choice</span>
    <h1>B1 词汇水平测试</h1>
    <p class="sub">每题显示一个英文单词和四个中文意思，只有一个正确答案。学生作答后自动跳到下一题，全程计时，完成后可下载错词 TXT。</p>
    <div class="meta"><div><b>词库</b>803 words</div><div><b>题型</b>四选一</div><div><b>反馈</b>答后跳题</div><div><b>结果</b>分数 + 用时 + 错词</div></div>
  </section>

  <div class="bar">
    <div class="tools">
      <div class="left">
        <label class="field">姓名 <input id="studentName" placeholder="Student name"></label>
        <span class="pill" id="progress">0 / 100</span>
        <span class="pill" id="timer">00:00</span>
        <span class="pill" id="status">未开始</span>
      </div>
      <div class="right">
        <button class="ghost" onclick="speakWord()">朗读</button>
        <button onclick="prevCard()">上一题</button>
        <button onclick="nextCard()">下一题</button>
        <button class="primary" onclick="finishQuiz()">交卷</button>
        <button class="danger" onclick="resetQuiz()">重来</button>
      </div>
    </div>
    <div class="track"><div class="fill" id="fill"></div></div>
  </div>

  <section class="panel">
    <h2>测试设置</h2>
    <p>课堂快测建议 100 题；摸底或分层可以选择全部 803 题。错词汇总区域点击即可下载 TXT。</p>
    <div class="settings">
      <label class="setting"><span>题量</span><select id="quizSize"><option value="100">100 题</option><option value="50">50 题</option><option value="200">200 题</option><option value="all">全部 803 题</option></select></label>
      <label class="setting"><span>顺序</span><select id="quizOrder"><option value="random">随机抽题</option><option value="original">按词表顺序</option></select></label>
      <label class="setting"><span>跳题速度</span><select id="jumpDelay"><option value="360">快速</option><option value="700">看清反馈</option><option value="0">手动下一题</option></select></label>
    </div>
    <p style="margin-top:12px"><button class="primary" onclick="startQuiz()">开始 / 重新抽题</button></p>
  </section>

  <main class="layout">
    <section class="quiz">
      <div class="quiz-head">
        <div class="counter" id="counter">点击“开始 / 重新抽题”</div>
        <button class="ghost" onclick="toggleFlag()" id="flagBtn">标记复习</button>
      </div>
      <div class="word" id="word">ready</div>
      <div class="hint" id="hint">选择题量后开始测试</div>
      <div class="choices" id="choices"></div>
      <div class="nav">
        <button onclick="prevCard()">上一题</button>
        <button class="primary" onclick="nextCard()">下一题</button>
      </div>
    </section>

    <aside class="side">
      <section class="panel">
        <h2>进度</h2>
        <div class="stats">
          <div class="stat"><span>正确</span><b id="correctCount">0</b></div>
          <div class="stat"><span>错误</span><b id="wrongCount">0</b></div>
          <div class="stat"><span>未答</span><b id="unansweredCount">0</b></div>
        </div>
      </section>
      <section class="panel">
        <h2>题目地图</h2>
        <div class="map" id="map"></div>
      </section>
    </aside>
  </main>

  <section class="result" id="result">
    <h2>测试结果</h2>
    <div class="score" id="score">0%</div>
    <div class="badge" id="badge">Ready</div>
    <p id="summary"></p>
    <div class="review" id="review" onclick="downloadWrongTxt()"></div>
    <textarea class="code" id="code" readonly></textarea>
    <p><button onclick="downloadWrongTxt()">下载错词 TXT</button> <button onclick="copyCode()">复制结果代码</button></p>
  </section>
</div>
<div class="toast" id="toast">Saved</div>

<script>
const DATA=document.getElementById("data").value.trim().split(/\n/).map(line=>{const [word,...rest]=line.split("|");return{word:word.trim(),meaning:rest.join("|").trim()}});
const LETTERS=["A","B","C","D"];
const $=id=>document.getElementById(id);
let questions=[],records=[],current=0,startedAt=0,finishedAt=0,timerId=0,submitted=false,toastTimer;
function shuffle(list){const arr=[...list];for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function formatTime(ms){const total=Math.max(0,Math.floor(ms/1000)),m=String(Math.floor(total/60)).padStart(2,"0"),s=String(total%60).padStart(2,"0");return `${m}:${s}`}
function tick(){if(startedAt&&!finishedAt)$("timer").textContent=formatTime(Date.now()-startedAt)}
function makeOptions(item){const seen=new Set([item.meaning]);const distractors=[];for(const entry of shuffle(DATA)){if(entry.word===item.word||seen.has(entry.meaning))continue;seen.add(entry.meaning);distractors.push(entry.meaning);if(distractors.length===3)break}const pos=Math.floor(Math.random()*4);const options=[...distractors];options.splice(pos,0,item.meaning);return{options,answer:LETTERS[pos]}}
function pickQuestions(){const size=$("quizSize").value;let list=$("quizOrder").value==="random"?shuffle(DATA):[...DATA];if(size!=="all")list=list.slice(0,Number(size));return list.map(item=>({...item,...makeOptions(item)}))}
function startQuiz(){questions=pickQuestions();records=questions.map(q=>({word:q.word,meaning:q.meaning,selected:"",selectedMeaning:"",correct:false,flag:false}));current=0;submitted=false;finishedAt=0;startedAt=Date.now();clearInterval(timerId);timerId=setInterval(tick,250);$("result").classList.remove("show");renderMap();renderCard();updateStats();tick();pop("已开始，共 "+questions.length+" 题")}
function renderCard(){if(!questions.length){$("counter").textContent="点击“开始 / 重新抽题”";$("word").textContent="ready";$("hint").textContent="选择题量后开始测试";$("choices").innerHTML="";return}const q=questions[current],r=records[current];$("counter").textContent=`第 ${current+1} / ${questions.length} 题`;$("word").textContent=q.word;$("hint").textContent=r.selected?(r.correct?`正确：${q.meaning}`:`错误，正确答案：${q.meaning}`):"请选择正确的中文意思";$("flagBtn").textContent=r.flag?"取消标记":"标记复习";$("choices").innerHTML=q.options.map((opt,i)=>choiceButton(q,r,opt,LETTERS[i])).join("");updateProgress()}
function choiceButton(q,r,opt,letter){let cls="option";if(r.selected){if(letter===q.answer)cls+=" correct";else if(letter===r.selected)cls+=" wrong"}return`<button class="${cls}" onclick="choose('${letter}')"><span>${letter}</span><b>${opt}</b></button>`}
function choose(letter){if(!questions.length)startQuiz();const q=questions[current],r=records[current],idx=LETTERS.indexOf(letter);r.selected=letter;r.selectedMeaning=q.options[idx];r.correct=letter===q.answer;updateStats();renderMap();renderCard();pop(r.correct?"回答正确":"回答错误");const delay=Number($("jumpDelay").value);if(delay&&current<questions.length-1)setTimeout(nextCard,delay);else if(delay&&current===questions.length-1)setTimeout(finishQuiz,delay)}
function nextCard(){if(!questions.length)return;if(current<questions.length-1){current++;renderCard()}else finishQuiz()}
function prevCard(){if(!questions.length)return;if(current>0){current--;renderCard()}else pop("已经是第一题")}
function toggleFlag(){if(!questions.length)return;records[current].flag=!records[current].flag;renderMap();renderCard();pop(records[current].flag?"已标记复习":"已取消标记")}
function jump(i){current=i;renderCard();document.querySelector(".quiz").scrollIntoView({behavior:"smooth",block:"start"})}
function renderMap(){let html="";records.forEach((r,i)=>{const cls=r.selected?(r.correct?"correct":"wrong"):"";const flag=r.flag?" ★":"";html+=`<button class="dot ${cls}" title="${i+1}. ${r.word}${flag}" onclick="jump(${i})"></button>`});$("map").innerHTML=html}
function counts(){return records.reduce((a,r)=>{if(!r.selected)a.unanswered++;else if(r.correct)a.correct++;else a.wrong++;if(r.flag)a.flag++;return a},{correct:0,wrong:0,unanswered:0,flag:0})}
function updateStats(){const c=counts();$("correctCount").textContent=c.correct;$("wrongCount").textContent=c.wrong;$("unansweredCount").textContent=c.unanswered;updateProgress()}
function updateProgress(){const answered=records.filter(r=>r.selected).length,total=questions.length||Number($("quizSize").value)||100,pct=total?Math.round(answered/total*100):0;$("progress").textContent=`${answered} / ${total}`;$("fill").style.width=pct+"%";$("status").textContent=questions.length?`正确 ${counts().correct}`:"未开始"}
function label(pct){if(pct>=90)return"B1 词汇很稳";if(pct>=75)return"B1 基础扎实";if(pct>=60)return"接近 B1，需复习错词";return"建议先补核心词义"}
function finishQuiz(){if(!questions.length)startQuiz();submitted=true;if(!finishedAt){finishedAt=Date.now();clearInterval(timerId);$("timer").textContent=formatTime(finishedAt-startedAt)}renderCard();renderMap();const c=counts(),pct=Math.round(c.correct/questions.length*100),wrong=wrongItems();$("result").classList.add("show");$("score").textContent=pct+"%";$("badge").textContent=label(pct);$("summary").textContent=`正确 ${c.correct} 题，错误 ${c.wrong} 题，未答 ${c.unanswered} 题，用时 ${formatTime(finishedAt-startedAt)}。点击下方错词区可下载 TXT。`;$("review").innerHTML=wrong.length?wrong.slice(0,140).map(r=>`<span class="chip">${r.word} = ${r.meaning}</span>`).join("")+(wrong.length>140?`<span class="pill">+ ${wrong.length-140} more</span>`:""):'<span class="pill">全部正确，没有错词</span>';$("code").value=resultCode(pct,c,wrong);$("result").scrollIntoView({behavior:"smooth",block:"start"});pop("结果已生成")}
function wrongItems(){return records.filter(r=>!r.correct||r.flag)}
function resultCode(pct,c,wrong){const name=$("studentName").value.trim()||"No name";return[`B1-VOCAB-MCQ-TIMER`,`Name: ${name}`,`Score: ${c.correct}/${questions.length} (${pct}%)`,`Time: ${formatTime((finishedAt||Date.now())-startedAt)}`,`Wrong: ${c.wrong}`,`Unanswered: ${c.unanswered}`,`Review: ${wrong.map(r=>`${r.word}=${r.meaning}`).join(", ")}`,`Finished: ${new Date().toLocaleString()}`].join("\n")}
function wrongTxt(){const name=$("studentName").value.trim()||"No name",wrong=wrongItems(),time=formatTime((finishedAt||Date.now())-startedAt);const lines=[`B1 Vocabulary Wrong Words`,`Name: ${name}`,`Time: ${time}`,`Total questions: ${questions.length}`,`Wrong / review words: ${wrong.length}`,``];wrong.forEach((r,i)=>lines.push(`${i+1}. ${r.word}\t正确：${r.meaning}\t你的选择：${r.selectedMeaning||"未作答"}`));return lines.join("\n")}
function downloadWrongTxt(){if(!questions.length)return pop("还没有开始测试");if(!submitted)finishQuiz();const blob=new Blob([wrongTxt()],{type:"text/plain;charset=utf-8"}),a=document.createElement("a"),name=($("studentName").value.trim()||"student").replace(/[^\w\u4e00-\u9fa5-]+/g,"_");a.href=URL.createObjectURL(blob);a.download=`${name}_B1_wrong_words.txt`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href);pop("错词 TXT 已下载")}
async function copyCode(){const c=$("code");c.select();try{await navigator.clipboard.writeText(c.value);pop("结果代码已复制")}catch(e){document.execCommand("copy");pop("已选中结果代码")}}
function speakWord(){if(!questions.length)return;const u=new SpeechSynthesisUtterance(records[current].word);u.lang="en-US";u.rate=.82;speechSynthesis.cancel();speechSynthesis.speak(u)}
function resetQuiz(){questions=[];records=[];current=0;startedAt=0;finishedAt=0;submitted=false;clearInterval(timerId);$("timer").textContent="00:00";$("map").innerHTML="";$("correctCount").textContent=0;$("wrongCount").textContent=0;$("unansweredCount").textContent=0;$("result").classList.remove("show");$("status").textContent="未开始";$("fill").style.width="0";$("progress").textContent="0 / 100";renderCard();scrollTo({top:0,behavior:"smooth"})}
function pop(text){const el=$("toast");el.textContent=text;el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),1300)}
updateProgress();
</script>
