<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>B2-5000 词汇语境选择测试｜Alex Han Studio</title>
  <style>
    body{margin:0;font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;background:#f6f7fb;color:#172033;display:grid;min-height:100vh;place-items:center;}
    .box{max-width:560px;margin:24px;padding:28px;border:1px solid #e4e7ec;border-radius:18px;background:#fff;box-shadow:0 16px 40px rgba(16,24,40,.08);}
    .mark{display:flex;align-items:center;gap:14px;margin-bottom:12px;}
    .a{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#1f4e79,#c26d49);display:grid;place-items:center;color:#fff;font-weight:800;font-size:23px;}
    h1{font-size:22px;margin:0 0 8px;}
    p{margin:0;color:#667085;line-height:1.7}
    .err{color:#b42318;margin-top:12px;white-space:pre-wrap;}
  </style>
</head>
<body>
  <main class="box">
    <div class="mark"><span class="a">A</span><div><strong>Alex Han Studio</strong><h1>B2-5000 词汇语境选择测试加载中</h1></div></div>
    <p>正在打开完整测试页面，请稍等。如果长时间停留在这里，请刷新一次。</p>
    <p id="err" class="err"></p>
  </main>
  <script>
  (async function(){
    const files = ["b2-5000-context-cloze-700.data.1.txt","b2-5000-context-cloze-700.data.2.txt","b2-5000-context-cloze-700.data.3.txt","b2-5000-context-cloze-700.data.4.txt","b2-5000-context-cloze-700.data.4tail.txt","b2-5000-context-cloze-700.data.5.txt","b2-5000-context-cloze-700.data.6.txt","b2-5000-context-cloze-700.data.7.txt"];
    const parts = await Promise.all(files.map(async file => {
      const res = await fetch(file + '?v=20260522-b25000context2', { cache:'no-store' });
      if (!res.ok) throw new Error(file + ' 加载失败：' + res.status);
      return res.text();
    }));
    const bin = atob(parts.join(''));
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    if (!('DecompressionStream' in window)) {
      throw new Error('当前浏览器版本过旧，无法解压测试页面。请使用最新版 Chrome、Edge 或 Safari 打开。');
    }
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const text = await new Response(stream).text();
    document.open();
    document.write(text);
    document.close();
  })().catch(err => {
    document.getElementById('err').textContent = err.message || String(err);
  });
  </script>
</body>
</html>
