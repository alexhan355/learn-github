<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>B2 词汇语境选择测试｜Alex Han Studio</title>
  <style>
    body{margin:0;font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;background:#f6f7fb;color:#172033;display:grid;min-height:100vh;place-items:center;}
    .box{max-width:560px;margin:24px;padding:28px;border:1px solid #e4e7ec;border-radius:18px;background:#fff;box-shadow:0 16px 40px rgba(16,24,40,.08);}
    .mark{display:flex;align-items:center;gap:14px;margin-bottom:12px;}.a{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#1f4e79,#c26d49);display:grid;place-items:center;color:#fff;font-weight:800;font-size:23px;}h1{font-size:22px;margin:0 0 8px;}p{margin:0;color:#667085;line-height:1.7}.err{color:#b42318;margin-top:12px;white-space:pre-wrap;}
  </style>
</head>
<body>
  <main class="box">
    <div class="mark"><span class="a">A</span><div><strong>Alex Han Studio</strong><h1>B2 词汇语境选择测试加载中</h1></div></div>
    <p>正在打开完整测试页面，请稍等。如果长时间停留在这里，请刷新一次。</p>
    <p id="err" class="err"></p>
  </main>
  <script>
  (async function(){
    const files = ["b2-context-cloze-719.data.1.txt","b2-context-cloze-719.data.2.txt","b2-context-cloze-719.data.3.txt","b2-context-cloze-719.data.4.txt","b2-context-cloze-719.data.5.txt","b2-context-cloze-719.data.6.txt","b2-context-cloze-719.data.7.txt"];
    const parts = await Promise.all(files.map(async file => {
      const res = await fetch(file + '?v=20260521-b2context', { cache:'force-cache' });
      if (!res.ok) throw new Error(file + ' 加载失败：' + res.status);
      return res.text();
    }));
    const bin = atob(parts.join(''));
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    if (!('DecompressionStream' in window)) {
      throw new Error('当前浏览器版本过旧，无法解压测试页面。请使用最新版 Chrome、Edge 或 Safari 打开。');
    }
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    let text = await new Response(stream).text();
    text = text
      .replace('<option value="1-100">', '<option value="1-100" selected>')
      .replace('</head>', '<style>@media (max-width:900px){.controls{position:static}}</style></head>')
      .replace('He caught his foot on the step and nearly began to ____.', 'Be careful not to ____ on the uneven step.');
    text = text
      .replace("function render() { const data = filtered(); const answered = Object.keys(state.selected).length; const unanswered = QUESTIONS.length - answered; let correct = 0; for (const pair of Object.entries(state.selected)) {", "function render() { const data = filtered(); const scope = QUESTION_ORDER.filter(function(item){ return inRange(displayNumber(item)); }); const scopeIds = new Set(scope.map(function(item){ return String(item.n); })); const entries = Object.entries(state.selected).filter(function(pair){ return scopeIds.has(String(pair[0])); }); const answered = entries.length; const unanswered = scope.length - answered; let correct = 0; for (const pair of entries) {")
      .replace("function wrongItems() { return QUESTION_ORDER.filter(function(item){ const chosen = state.selected[item.n];", "function wrongItems() { return QUESTION_ORDER.filter(function(item){ if (!inRange(displayNumber(item))) return false; const chosen = state.selected[item.n];")
      .replace("function submitQuiz() { const unanswered = QUESTIONS.length - Object.keys(state.selected).length;", "function submitQuiz() { const scope = QUESTION_ORDER.filter(function(item){ return inRange(displayNumber(item)); }); const answered = scope.filter(function(item){ return state.selected[item.n] !== undefined; }).length; const unanswered = scope.length - answered;")
      .replace("submitQuizBtn.textContent = '已提交'; render();", "submitQuizBtn.textContent = '已提交'; submitQuizBtn.disabled = true; range.disabled = true; search.value = ''; search.disabled = true; render();")
      .replace("submitQuizBtn.textContent = '提交并生成错词'; render();", "submitQuizBtn.textContent = '提交并生成错词'; submitQuizBtn.disabled = false; range.disabled = false; search.disabled = false; render();");
    document.open();
    document.write(text);
    document.close();
  })().catch(err => {
    document.getElementById('err').textContent = err.message || String(err);
  });
  </script>
</body>
</html>
