<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>5岁5个月数学趣味小测</title>
<style>
:root{--ink:#292536;--muted:#656777;--line:#2d2a30;--paper:#fffdf7;--sky:#dff6ff;--mint:#ddf7df;--lemon:#fff1a8;--rose:#ffe3e0;--blue:#2184c6;--green:#2f9d68;--yellow:#f3bb2b;--coral:#f36b5f;--plum:#745bc2;--ok:#167a4e;--bad:#b63f4b}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:linear-gradient(90deg,rgba(33,132,198,.1) 1px,transparent 1px),linear-gradient(180deg,rgba(243,187,43,.16) 1px,transparent 1px),linear-gradient(180deg,#f2fbff,#fff8ec 48%,#f1fbf2);background-size:38px 38px,38px 38px,auto;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}button{font:inherit}.app{width:min(1120px,calc(100% - 28px));margin:auto;padding:18px 0 36px}.top{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;margin-bottom:14px}.brand{display:flex;gap:12px;align-items:center}.mark{width:58px;height:58px;display:grid;grid-template-columns:repeat(2,1fr);gap:5px;padding:6px;border:2px solid var(--line);border-radius:8px;background:#fff;box-shadow:4px 4px 0 var(--line)}.mark span{display:grid;place-items:center;border-radius:7px;color:#fff;font-weight:900}.mark span:nth-child(1){background:var(--coral)}.mark span:nth-child(2){background:var(--blue)}.mark span:nth-child(3){background:var(--green)}.mark span:nth-child(4){background:var(--plum)}h1{margin:0;font-size:30px;line-height:1.15;letter-spacing:0}.sub{margin:5px 0 0;color:var(--muted);font-size:15px;line-height:1.5}.topBtns,.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.btn,.choice,.group,.tile,.star{border:2px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-weight:900;cursor:pointer;box-shadow:3px 3px 0 var(--line);touch-action:manipulation}.btn{min-height:44px;padding:0 14px}.btn.primary{background:var(--line);color:#fff}.btn.good{background:var(--green);color:#fff}.btn:hover,.choice:hover,.group:hover,.tile:hover,.star:hover{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--line)}button:disabled{cursor:default;opacity:.9;transform:none}.progress{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-bottom:16px}.track{height:18px;overflow:hidden;border:2px solid var(--line);border-radius:999px;background:#fff}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--coral),var(--yellow),var(--green));transition:width .25s}.score{min-width:132px;border:2px solid var(--line);border-radius:8px;background:#fff;padding:8px 11px;text-align:center;font-weight:900;box-shadow:3px 3px 0 var(--line)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 268px;gap:16px;align-items:start}.panel{border:2px solid var(--line);border-radius:8px;background:var(--paper);box-shadow:6px 6px 0 var(--line)}.question{min-height:650px;padding:18px}.head{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;margin-bottom:14px}.tag{display:inline-flex;align-items:center;width:max-content;min-height:30px;border:2px solid var(--line);border-radius:999px;background:var(--lemon);padding:0 11px;font-size:14px;font-weight:900}h2{margin:9px 0 0;font-size:27px;line-height:1.25;letter-spacing:0}.read{width:48px;min-height:48px;padding:0;font-size:24px}.task{display:grid;gap:15px}.scene{min-height:210px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:12px;padding:18px;border:2px solid var(--line);border-radius:8px;background:var(--bg,var(--sky))}.obj{width:58px;height:58px;display:grid;place-items:center;border:2px solid var(--line);border-radius:8px;background:#fff;font-size:33px;box-shadow:3px 3px 0 rgba(45,42,48,.85);user-select:none}.obj.small{width:48px;height:48px;font-size:26px}.obj.cross{position:relative;opacity:.56}.obj.cross:after{content:"";position:absolute;width:68px;height:4px;border-radius:8px;background:var(--bad);transform:rotate(-32deg)}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.choice{min-height:68px;font-size:24px}.choice.correct,.group.correct{background:var(--mint);color:var(--ok)}.choice.wrong,.group.wrong{background:var(--rose);color:var(--bad)}.feedback{min-height:58px;display:flex;align-items:center;border:2px solid var(--line);border-radius:8px;background:#fff;padding:12px 14px;color:var(--muted);font-size:17px;line-height:1.45;font-weight:750}.feedback strong{color:var(--ink)}.actions{justify-content:space-between}.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.group{min-height:240px;display:grid;align-content:center;justify-items:center;gap:12px;padding:14px}.objects{display:flex;justify-content:center;flex-wrap:wrap;gap:9px}.label{border-radius:999px;background:var(--lemon);padding:6px 12px}.row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px}.num,.pat,.slot{width:66px;height:66px;display:grid;place-items:center;border:2px solid var(--line);border-radius:8px;background:#fff;font-size:29px;font-weight:900;box-shadow:3px 3px 0 var(--line)}.blank{background:var(--line);color:#fff}.pat{font-size:34px}.shapeGrid{display:grid;grid-template-columns:repeat(4,minmax(60px,1fr));gap:12px;width:min(460px,100%)}.shapeBtn{min-height:96px;display:grid;place-items:center}.shape{display:block;width:58px;height:58px;border:3px solid var(--line);background:var(--blue)}.circle{border-radius:50%;background:var(--coral)}.square{border-radius:8px;background:var(--yellow)}.rect{width:78px;border-radius:8px;background:var(--green)}.tri{width:0;height:0;border-left:34px solid transparent;border-right:34px solid transparent;border-bottom:62px solid var(--plum);background:transparent}.stars,.ten{display:grid;grid-template-columns:repeat(5,62px);justify-content:center;gap:10px}.star{width:62px;height:62px;font-size:31px}.star.on{background:var(--lemon);transform:translateY(-3px)}.note{text-align:center;color:var(--muted);font-weight:850}.tile{width:66px;height:66px;font-size:28px}.tile.used{background:#ececf2;color:#8b8c96}.slot{border-style:dashed;color:var(--muted)}.tenCell{width:62px;height:62px;display:grid;place-items:center;border:2px solid var(--line);border-radius:8px;background:#fff;font-size:28px;box-shadow:2px 2px 0 var(--line)}.tenCell.fill{background:var(--lemon)}.map{position:sticky;top:14px;padding:14px}.map h2{margin:0 0 10px;font-size:19px}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.dot{min-height:40px;display:grid;place-items:center;border:2px solid var(--line);border-radius:8px;background:#fff;color:var(--muted);font-weight:900}.dot.current{background:var(--lemon);color:var(--ink)}.dot.done{background:var(--mint);color:var(--ok)}.dot.miss{background:var(--rose);color:var(--bad)}.parent{margin:13px 0 0;color:var(--muted);font-size:14px;line-height:1.65}.big{display:grid;place-items:center;min-height:160px;border:2px solid var(--line);border-radius:8px;background:var(--lemon);text-align:center}.big strong{font-size:56px}.result{display:grid;gap:14px}.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}.list li{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;border:2px solid var(--line);border-radius:8px;background:#fff;padding:10px;font-weight:800}.list small{color:var(--muted);font-weight:700}.confetti{pointer-events:none;position:fixed;inset:0;overflow:hidden;z-index:20}.confetti span{position:absolute;top:-30px;width:14px;height:22px;border:2px solid var(--line);border-radius:5px;animation:fall .9s ease-in forwards}@keyframes fall{to{transform:translateY(105vh) rotate(280deg);opacity:.2}}@media(max-width:900px){.layout{grid-template-columns:1fr}.map{position:static}.question{min-height:auto}}@media(max-width:680px){.app{width:min(100% - 20px,1120px);padding-top:12px}.top,.head,.progress{grid-template-columns:1fr}.topBtns,.actions{justify-content:stretch}.btn{flex:1 1 auto}h1{font-size:24px}h2{font-size:23px}.choices,.compare{grid-template-columns:1fr}.scene{min-height:180px;padding:14px}.obj{width:50px;height:50px;font-size:28px}.stars,.ten{grid-template-columns:repeat(5,52px);gap:8px}.star,.tenCell{width:52px;height:52px}.num,.pat,.tile,.slot{width:56px;height:56px;font-size:25px}.shapeGrid{grid-template-columns:repeat(2,minmax(92px,1fr))}.list li{grid-template-columns:30px 1fr}.answer{grid-column:2}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="brand"><div class="mark" aria-hidden="true"><span>1</span><span>2</span><span>3</span><span>+</span></div><div><h1>数字乐园数学小测</h1><p class="sub">适合 5 岁 5 个月：看图数数、10 以内加减、比较、规律和图形。</p></div></div><div class="topBtns"><button class="btn" id="readAll">读题</button><button class="btn" id="reset">重新开始</button></div></header>
<section class="progress"><div class="track"><div class="fill" id="fill"></div></div><div class="score" id="score">0 / 12 颗星</div></section>
<div class="layout"><section class="panel question" id="panel"></section><aside class="panel map"><h2>闯关地图</h2><div class="steps" id="steps"></div><p class="parent">建议家长只读题，不提示答案。孩子如果答错，可以先进入下一题，最后按结果再练同类题。</p></aside></div>
</main><div class="confetti" id="confetti"></div>
<script>
const qs=[
{t:'count',s:'看图数数',q:'数一数，有几颗苹果？',item:'🍎',n:5,cs:[4,5,6],a:5,tip:'逐个点着数，最后一个数就是总数。'},
{t:'tap',s:'按数取物',q:'请点亮 6 颗星星。',total:10,a:6,tip:'可以一边点一边从 1 数到 6。'},
{t:'compare',s:'多少比较',q:'哪一边的彩球更多？',item:'🟡',l:4,r:7,a:'right',tip:'可以把两边一个对一个比。'},
{t:'add',s:'10以内加法',q:'3 块积木加 2 块积木，一共有几块？',item:'🧱',l:3,r:2,cs:[4,5,6],a:5,tip:'先数左边，再接着数右边。'},
{t:'sub',s:'10以内减法',q:'有 8 颗草莓，吃掉 3 颗，还剩几颗？',item:'🍓',total:8,gone:3,cs:[4,5,6],a:5,tip:'被划掉的不算，数剩下的。'},
{t:'seq',s:'数的顺序',q:'数字小火车缺了哪一节？',seq:[2,3,null,5,6],cs:[1,4,7],a:4,tip:'按顺序慢慢读：2、3、4、5、6。'},
{t:'pattern',s:'找规律',q:'后面应该接哪一个图案？',seq:['🔴','🔵','🔴','🔵',null],cs:['🔴','🔵','🟢'],a:'🔴',tip:'红、蓝、红、蓝，下一格回到红。'},
{t:'shape',s:'认识图形',q:'请找出三角形。',shapes:['circle','tri','square','rect'],cs:['tri'],a:'tri',tip:'三角形有 3 条边和 3 个角。'},
{t:'order',s:'数的排序',q:'把数字从小到大排好。',nums:[5,2,4,1,3],a:[1,2,3,4,5],tip:'从最小的 1 开始找。'},
{t:'ten',s:'凑十感知',q:'已经有 7 颗糖，还差几颗到 10 颗？',n:7,cs:[2,3,4],a:3,tip:'空格有几个，就还差几个。'},
{t:'mixed',s:'分类计数',q:'这里有几个圆形？',shapes:['circle','square','circle','tri','circle','rect','circle'],cs:[3,4,5],a:4,tip:'只数圆圆的图形，其他图形先跳过。'},
{t:'seq',s:'相邻数字',q:'7 前面的数字是几？',seq:[null,7,8],cs:[5,6,9],a:6,tip:'从 5 开始数：5、6、7，7 前面是 6。'}];
let i=0,locked=false,answers=[],pickedStars=new Set(),order=[];const panel=document.getElementById('panel'),steps=document.getElementById('steps'),score=document.getElementById('score'),fill=document.getElementById('fill'),confetti=document.getElementById('confetti');
const obj=(it,n,c='')=>Array.from({length:n},(_,k)=>`<span class="obj ${c}" aria-label="${it} ${k+1}">${it}</span>`).join('');
const shape=n=>`<span class="shape ${n}" aria-hidden="true"></span>`;
const val=v=>Number.isNaN(Number(v))?v:Number(v);
function top(){score.textContent=`${answers.filter(x=>x&&x.ok).length} / ${qs.length} 颗星`;fill.style.width=`${answers.filter(Boolean).length/qs.length*100}%`;steps.innerHTML=qs.map((_,k)=>{let a=answers[k],c=k===i?'current':a?(a.ok?'done':'miss'):'';return `<span class="dot ${c}">${a?(a.ok?'✓':'·'):k+1}</span>`}).join('')}
function render(){locked=false;pickedStars=new Set();order=[];let q=qs[i];top();panel.innerHTML=`<div class="head"><div><span class="tag">第 ${i+1} 关 · ${q.s}</span><h2>${q.q}</h2></div><button class="btn read" id="read">▶</button></div><div class="task" id="task"></div><div class="feedback" id="fb">准备好了吗？慢慢看，想好了再点。</div><div class="actions"><button class="btn" id="prev">上一题</button><button class="btn primary" id="next" disabled>下一题</button></div>`;document.getElementById('read').onclick=()=>speak(q.q);document.getElementById('prev').onclick=()=>{if(i>0){i--;render()}};document.getElementById('next').onclick=()=>i===qs.length-1?result():(i++,render());draw(q)}
function choices(cs){return `<div class="choices">${cs.map(c=>`<button class="choice" data-v="${c}">${c}</button>`).join('')}</div>`}
function bind(q){document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>finish(q,val(b.dataset.v)===q.a,val(b.dataset.v),q.a))}
function draw(q){let t=document.getElementById('task');if(q.t==='count'){t.innerHTML=`<div class="scene">${obj(q.item,q.n)}</div>${choices(q.cs)}`;bind(q)}if(q.t==='tap'){t.innerHTML=`<div class="scene" style="--bg:var(--mint)"><div class="stars">${Array.from({length:q.total},(_,k)=>`<button class="star" data-star="${k}">☆</button>`).join('')}</div></div><p class="note" id="note">已经点亮 0 颗</p><button class="btn good" id="check">完成</button>`;document.querySelectorAll('.star').forEach(b=>b.onclick=()=>{let k=+b.dataset.star;if(pickedStars.has(k)){pickedStars.delete(k);b.classList.remove('on');b.textContent='☆'}else{pickedStars.add(k);b.classList.add('on');b.textContent='★'}document.getElementById('note').textContent=`已经点亮 ${pickedStars.size} 颗`});document.getElementById('check').onclick=()=>finish(q,pickedStars.size===q.a,`${pickedStars.size} 颗`,`${q.a} 颗`)}if(q.t==='compare'){t.innerHTML=`<div class="compare"><button class="group" data-side="left"><span class="label">左边</span><span class="objects">${obj(q.item,q.l,'small')}</span></button><button class="group" data-side="right"><span class="label">右边</span><span class="objects">${obj(q.item,q.r,'small')}</span></button></div>`;document.querySelectorAll('.group').forEach(b=>b.onclick=()=>finish(q,b.dataset.side===q.a,b.dataset.side==='left'?'左边':'右边',q.a==='left'?'左边':'右边'))}if(q.t==='add'){t.innerHTML=`<div class="scene" style="--bg:var(--lemon)"><div class="row">${obj(q.item,q.l)}<span class="num">+</span>${obj(q.item,q.r)}</div></div>${choices(q.cs)}`;bind(q)}if(q.t==='sub'){t.innerHTML=`<div class="scene" style="--bg:var(--rose)">${obj(q.item,q.total-q.gone)}${obj(q.item,q.gone,'cross')}</div>${choices(q.cs)}`;bind(q)}if(q.t==='seq'){t.innerHTML=`<div class="scene"><div class="row">${q.seq.map(n=>n===null?'<span class="num blank">?</span>':`<span class="num">${n}</span>`).join('')}</div></div>${choices(q.cs)}`;bind(q)}if(q.t==='pattern'){t.innerHTML=`<div class="scene" style="--bg:var(--mint)"><div class="row">${q.seq.map(x=>x===null?'<span class="pat blank">?</span>':`<span class="pat">${x}</span>`).join('')}</div></div>${choices(q.cs)}`;bind(q)}if(q.t==='shape'){t.innerHTML=`<div class="scene" style="--bg:var(--lemon)"><div class="shapeGrid">${q.shapes.map(s=>`<button class="choice shapeBtn" data-v="${s}" aria-label="${s}">${shape(s)}</button>`).join('')}</div></div>`;bind(q)}if(q.t==='order'){t.innerHTML=`<div class="scene"><div class="task"><div class="row" id="src">${q.nums.map(n=>`<button class="tile" data-n="${n}">${n}</button>`).join('')}</div><div class="row" id="target">${q.nums.map(()=>'<span class="slot">?</span>').join('')}</div></div></div><div class="actions"><button class="btn" id="undo">退一格</button><button class="btn good" id="ok">完成</button></div>`;let update=()=>document.querySelectorAll('.slot').forEach((s,k)=>s.textContent=order[k]??'?');document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{if(locked||b.classList.contains('used'))return;order.push(+b.dataset.n);b.classList.add('used');b.disabled=true;update()});document.getElementById('undo').onclick=()=>{if(order.length&&!locked){let last=order.pop(),b=document.querySelector(`[data-n="${last}"]`);b.classList.remove('used');b.disabled=false;update()}};document.getElementById('ok').onclick=()=>finish(q,order.join(',')===q.a.join(','),order.join('、')||'还没排',q.a.join('、'))}if(q.t==='ten'){t.innerHTML=`<div class="scene" style="--bg:var(--mint)"><div class="ten">${Array.from({length:10},(_,k)=>`<span class="tenCell ${k<q.n?'fill':''}">${k<q.n?'🍬':''}</span>`).join('')}</div></div>${choices(q.cs)}`;bind(q)}if(q.t==='mixed'){t.innerHTML=`<div class="scene" style="--bg:var(--lemon)"><div class="shapeGrid">${q.shapes.map(s=>`<span class="num">${shape(s)}</span>`).join('')}</div></div>${choices(q.cs)}`;bind(q)}}
function finish(q,ok,pick,ans){if(locked)return;locked=true;answers[i]={ok,skill:q.s,title:q.q,pick,ans,tip:q.tip};top();document.querySelectorAll('button').forEach(b=>{if(!['next','prev','reset','readAll','read'].includes(b.id))b.disabled=true});document.querySelectorAll('.choice,.group').forEach(b=>{let v=val(b.dataset.v||b.dataset.side);if(v===q.a)b.classList.add('correct');if(v===pick&&v!==q.a)b.classList.add('wrong')});document.getElementById('fb').innerHTML=ok?'<strong>答对啦！</strong> 得到一颗星。':`<strong>这题先记下来。</strong> 正确答案是 ${ans}。${q.tip}`;if(ok)party(14);let n=document.getElementById('next');n.disabled=false;n.textContent=i===qs.length-1?'看结果':'下一题'}
function result(){top();let good=answers.filter(x=>x&&x.ok).length,msg=good>=10?'基础很稳，观察和数感都不错。':good>=7?'大部分能掌握，可以重点练错题类型。':'先从看图数数和 10 以内实物加减慢慢练。';panel.innerHTML=`<div class="result"><div><span class="tag">完成啦</span><h2>数学小测结果</h2></div><div class="big"><div><strong>${good}/${qs.length}</strong><p class="sub">${msg}</p></div></div><ul class="list">${qs.map((q,k)=>{let a=answers[k],ok=a&&a.ok;return `<li><span>${ok?'✓':'·'}</span><span>${q.s}<br><small>${q.q}</small></span><span class="answer">${ok?'已掌握':'再练：'+q.tip}</span></li>`}).join('')}</ul><div class="actions"><button class="btn primary" onclick="restart()">再测一次</button><button class="btn" onclick="print()">打印结果</button></div></div>`;party(28)}
function restart(){i=0;answers=[];render()}function speak(text){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=.85;u.pitch=1.15;speechSynthesis.speak(u)}function party(n){confetti.innerHTML='';let cs=['#f36b5f','#f3bb2b','#2f9d68','#2184c6','#745bc2'];for(let k=0;k<n;k++){let p=document.createElement('span');p.style.left=Math.random()*100+'%';p.style.background=cs[k%cs.length];p.style.animationDelay=Math.random()*220+'ms';confetti.appendChild(p)}setTimeout(()=>confetti.innerHTML='',1300)}
document.getElementById('readAll').onclick=()=>speak(answers.length===qs.length?'数学小测结果':qs[i].q);document.getElementById('reset').onclick=restart;render();
</script>
</body>
</html>
