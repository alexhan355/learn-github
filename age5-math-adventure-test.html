<!doctype html>
<html lang='zh-CN'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>5岁5个月数学趣味小测</title>
<style>
:root{--ink:#292536;--muted:#666978;--line:#2d2a30;--paper:#fffdf7;--sky:#dff6ff;--mint:#ddf7df;--lemon:#fff1a8;--rose:#ffe3e0;--blue:#2184c6;--green:#2f9d68;--yellow:#f3bb2b;--coral:#f36b5f;--plum:#745bc2;--ok:#167a4e;--bad:#b63f4b}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:linear-gradient(90deg,rgba(33,132,198,.1) 1px,transparent 1px),linear-gradient(180deg,rgba(243,187,43,.16) 1px,transparent 1px),linear-gradient(180deg,#f2fbff,#fff8ec 48%,#f1fbf2);background-size:38px 38px,38px 38px,auto;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif}button{font:inherit}.app{width:min(1120px,calc(100% - 28px));margin:auto;padding:18px 0 36px}.topbar{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;margin-bottom:14px}.brand{display:flex;gap:12px;align-items:center}.mark{width:58px;height:58px;display:grid;grid-template-columns:repeat(2,1fr);gap:5px;padding:6px;border:2px solid var(--line);border-radius:8px;background:#fff;box-shadow:4px 4px 0 var(--line)}.mark span{display:grid;place-items:center;border-radius:7px;color:#fff;font-weight:900}.mark span:nth-child(1){background:var(--coral)}.mark span:nth-child(2){background:var(--blue)}.mark span:nth-child(3){background:var(--green)}.mark span:nth-child(4){background:var(--plum)}h1{margin:0;font-size:30px;line-height:1.15;letter-spacing:0}.sub{margin:5px 0 0;color:var(--muted);font-size:15px;line-height:1.5}.top-actions,.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.btn,.choice,.group,.tile,.star{border:2px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-weight:900;cursor:pointer;box-shadow:3px 3px 0 var(--line);touch-action:manipulation}.btn{min-height:44px;padding:0 14px}.btn.primary{background:var(--line);color:#fff}.btn.good{background:var(--green);color:#fff}.btn:hover,.choice:hover,.group:hover,.tile:hover,.star:hover{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--line)}button:disabled{cursor:default;opacity:.9;transform:none}.progress{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-bottom:16px}.track{height:18px;overflow:hidden;border:2px solid var(--line);border-radius:999px;background:#fff}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--coral),var(--yellow),var(--green));transition:width .25s}.score{min-width:132px;border:2px solid var(--line);border-radius:8px;background:#fff;padding:8px 11px;text-align:center;font-weight:900;box-shadow:3px 3px 0 var(--line)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 268px;gap:16px;align-items:start}.panel{border:2px solid var(--line);border-radius:8px;background:var(--paper);box-shadow:6px 6px 0 var(--line)}.question{min-height:650px;padding:18px}.head{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;margin-bottom:14px}.tag{display:inline-flex;align-items:center;width:max-content;min-height:30px;border:2px solid var(--line);border-radius:999px;background:var(--lemon);padding:0 11px;font-size:14px;font-weight:900}h2{margin:9px 0 0;font-size:27px;line-height:1.25;letter-spacing:0}.read{width:48px;min-height:48px;padding:0;font-size:24px}.task{display:grid;gap:15px}.scene{min-height:210px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:12px;padding:18px;border:2px solid var(--line);border-radius:8px;background:var(--bg,var(--sky))}.obj{width:58px;height:58px;display:grid;place-items:center;border:2px solid var(--line);border-radius:8px;background:#fff;font-size:33px;box-shadow:3px 3px 0 rgba(45,42,48,.85);user-select:none}.obj.small{width:48px;height:48px;font-size:26px}.obj.cross{position:relative;opacity:.56}.obj.cross:after{content:'';position:absolute;width:68px;height:4px;border-radius:8px;background:var(--bad);transform:rotate(-32deg)}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.choice{min-height:68px;font-size:24px}.choice.correct,.group.correct{background:var(--mint);color:var(--ok)}.choice.wrong,.group.wrong{background:var(--rose);color:var(--bad)}.feedback{min-height:58px;display:flex;align-items:center;border:2px solid var(--line);border-radius:8px;background:#fff;padding:12px 14px;color:var(--muted);font-size:17px;line-height:1.45;font-weight:750}.feedback strong{color:var(--ink)}.actions{justify-content:space-between}.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.group{min-height:240px;display:grid;align-content:center;justify-items:center;gap:12px;padding:14px}.objects{display:flex;justify-content:center;flex-wrap:wrap;gap:9px}.label{border-radius:999px;background:var(--lemon);padding:6px 12px}.row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px}.num,.pat,.slot{width:66px;height:66px;display:grid;place-items:center;border:2px solid var(--line);border-radius:8px;background:#fff;font-size:29px;font-weight:900;box-shadow:3px 3px 0 var(--line)}.blank{background:var(--line);color:#fff}.pat{font-size:34px}.shape-grid{display:grid;grid-template-columns:repeat(4,minmax(60px,1fr));gap:12px;width:min(460px,100%)}.shape-btn{min-height:96px;display:grid;place-items:center}.shape{display:block;width:58px;height:58px;border:3px solid var(--line);background:var(--blue)}.circle{border-radius:50%;background:var(--coral)}.square{border-radius:8px;background:var(--yellow)}.rect{width:78px;border-radius:8px;background:var(--green)}.tri{width:0;height:0;border-left:34px solid transparent;border-right:34px solid transparent;border-bottom:62px solid var(--plum);background:transparent}.stars,.ten{display:grid;grid-template-columns:repeat(5,62px);justify-content:center;gap:10px}.star{width:62px;height:62px;font-size:31px}.star.on{background:var(--lemon);transform:translateY(-3px)}.note{text-align:center;color:var(--muted);font-weight:850}.tile{width:66px;height:66px;font-size:28px}.tile.used{background:#ececf2;color:#8b8c96}.slot{border-style:dashed;color:var(--muted)}.ten-cell{width:62px;height:62px;display:grid;place-items:center;border:2px solid var(--line);border-radius:8px;background:#fff;font-size:28px;box-shadow:2px 2px 0 var(--line)}.ten-cell.fill{background:var(--lemon)}.map{position:sticky;top:14px;padding:14px}.map h2{margin:0 0 10px;font-size:19px}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.dot{min-height:40px;display:grid;place-items:center;border:2px solid var(--line);border-radius:8px;background:#fff;color:var(--muted);font-weight:900}.dot.current{background:var(--lemon);color:var(--ink)}.dot.done{background:var(--mint);color:var(--ok)}.dot.miss{background:var(--rose);color:var(--bad)}.parent-note{margin:13px 0 0;color:var(--muted);font-size:14px;line-height:1.65}.big{display:grid;place-items:center;min-height:160px;border:2px solid var(--line);border-radius:8px;background:var(--lemon);text-align:center}.big strong{font-size:56px}.result{display:grid;gap:14px}.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}.list li{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;border:2px solid var(--line);border-radius:8px;background:#fff;padding:10px;font-weight:800}.list small{color:var(--muted);font-weight:700}.confetti{pointer-events:none;position:fixed;inset:0;overflow:hidden;z-index:20}.confetti span{position:absolute;top:-30px;width:14px;height:22px;border:2px solid var(--line);border-radius:5px;animation:fall .9s ease-in forwards}@keyframes fall{to{transform:translateY(105vh) rotate(280deg);opacity:.2}}@media(max-width:900px){.layout{grid-template-columns:1fr}.map{position:static}.question{min-height:auto}}@media(max-width:680px){.app{width:min(100% - 20px,1120px);padding-top:12px}.topbar,.head,.progress{grid-template-columns:1fr}.top-actions,.actions{justify-content:stretch}.btn{flex:1 1 auto}h1{font-size:24px}h2{font-size:23px}.choices,.compare{grid-template-columns:1fr}.scene{min-height:180px;padding:14px}.obj{width:50px;height:50px;font-size:28px}.stars,.ten{grid-template-columns:repeat(5,52px);gap:8px}.star,.ten-cell{width:52px;height:52px}.num,.pat,.tile,.slot{width:56px;height:56px;font-size:25px}.shape-grid{grid-template-columns:repeat(2,minmax(92px,1fr))}.list li{grid-template-columns:30px 1fr}.answer{grid-column:2}}
</style>
</head>
<body>
<main class='app'>
<header class='topbar'><div class='brand'><div class='mark' aria-hidden='true'><span>1</span><span>2</span><span>3</span><span>+</span></div><div><h1>数字乐园数学小测</h1><p class='sub'>适合 5 岁 5 个月：看图数数、10 以内加减、比较、规律和图形。</p></div></div><div class='top-actions'><button class='btn' id='readAll'>读题</button><button class='btn' id='restartTop'>重新开始</button></div></header>
<section class='progress'><div class='track'><div class='fill' id='progressFill'></div></div><div class='score' id='scoreBox'>0 / 12 颗星</div></section>
<div class='layout'><section class='panel question' id='card'></section><aside class='panel map'><h2>闯关地图</h2><div class='steps' id='steps'></div><p class='parent-note'>建议家长只读题，不提示答案。孩子如果答错，可以先进入下一题，最后按结果再练同类题。</p></aside></div>
</main><div class='confetti' id='confetti'></div>
<script>
const tasks=[
{kind:'count',skill:'看图数数',title:'数一数，有几颗苹果？',item:'🍎',count:5,choices:[4,5,6],answer:5,tip:'逐个点着数，最后一个数就是总数。'},
{kind:'tap',skill:'按数取物',title:'请点亮 6 颗星星。',total:10,answer:6,tip:'可以一边点一边从 1 数到 6。'},
{kind:'compare',skill:'多少比较',title:'哪一边的彩球更多？',item:'🟡',left:4,right:7,answer:'right',tip:'可以把两边一个对一个比。'},
{kind:'add',skill:'10以内加法',title:'3 块积木加 2 块积木，一共有几块？',item:'🧱',left:3,right:2,choices:[4,5,6],answer:5,tip:'先数左边，再接着数右边。'},
{kind:'sub',skill:'10以内减法',title:'有 8 颗草莓，吃掉 3 颗，还剩几颗？',item:'🍓',total:8,gone:3,choices:[4,5,6],answer:5,tip:'被划掉的不算，数剩下的。'},
{kind:'seq',skill:'数的顺序',title:'数字小火车缺了哪一节？',seq:[2,3,null,5,6],choices:[1,4,7],answer:4,tip:'按顺序慢慢读：2、3、4、5、6。'},
{kind:'pattern',skill:'找规律',title:'后面应该接哪一个图案？',seq:['🔴','🔵','🔴','🔵',null],choices:['🔴','🔵','🟢'],answer:'🔴',tip:'红、蓝、红、蓝，下一格回到红。'},
{kind:'shape',skill:'认识图形',title:'请找出三角形。',shapes:['circle','tri','square','rect'],answer:'tri',tip:'三角形有 3 条边和 3 个角。'},
{kind:'order',skill:'数的排序',title:'把数字从小到大排好。',nums:[5,2,4,1,3],answer:[1,2,3,4,5],tip:'从最小的 1 开始找。'},
{kind:'ten',skill:'凑十感知',title:'已经有 7 颗糖，还差几颗到 10 颗？',count:7,choices:[2,3,4],answer:3,tip:'空格有几个，就还差几个。'},
{kind:'mixed',skill:'分类计数',title:'这里有几个圆形？',shapes:['circle','square','circle','tri','circle','rect','circle'],choices:[3,4,5],answer:4,tip:'只数圆圆的图形，其他图形先跳过。'},
{kind:'seq',skill:'相邻数字',title:'7 前面的数字是几？',seq:[null,7,8],choices:[5,6,9],answer:6,tip:'从 5 开始数：5、6、7，7 前面是 6。'}];
let current=0,locked=false,answers=[],selectedStars=new Set(),orderPick=[];
const pick=s=>document.querySelector(s);
function objects(item,count,cls=''){return Array.from({length:count},(_,i)=>`<span class='obj ${cls}' aria-label='${item} ${i+1}'>${item}</span>`).join('')}
function shapeHtml(name){return `<span class='shape ${name}' aria-hidden='true'></span>`}
function parseValue(value){const number=Number(value);return Number.isNaN(number)?value:number}
function sameValue(a,b){return Array.isArray(a)&&Array.isArray(b)?a.join(',')===b.join(','):a===b}
function updateHud(){const done=answers.filter(Boolean).length;const good=answers.filter(a=>a&&a.correct).length;pick('#scoreBox').textContent=`${good} / ${tasks.length} 颗星`;pick('#progressFill').style.width=`${done/tasks.length*100}%`;pick('#steps').innerHTML=tasks.map((_,i)=>{const a=answers[i];const cls=i===current?'current':a?(a.correct?'done':'miss'):'';return `<span class='dot ${cls}'>${a?(a.correct?'✓':'·'):i+1}</span>`}).join('')}
function render(){locked=false;selectedStars=new Set();orderPick=[];const q=tasks[current];updateHud();pick('#card').innerHTML=`<div class='head'><div><span class='tag'>第 ${current+1} 关 · ${q.skill}</span><h2>${q.title}</h2></div><button class='btn read' id='readOne'>▶</button></div><div class='task' id='task'></div><div class='feedback' id='feedback'>准备好了吗？慢慢看，想好了再点。</div><div class='actions'><button class='btn' id='prevBtn'>上一题</button><button class='btn primary' id='nextBtn' disabled>下一题</button></div>`;pick('#readOne').onclick=()=>speak(q.title);pick('#prevBtn').onclick=()=>{if(current>0){current-=1;render()}};pick('#nextBtn').onclick=()=>current===tasks.length-1?showResult():(current+=1,render());drawTask(q)}
function choiceGrid(list){return `<div class='choices'>${list.map(item=>`<button class='choice' data-value='${item}'>${item}</button>`).join('')}</div>`}
function bindChoices(q){document.querySelectorAll('.choice').forEach(button=>button.onclick=()=>{const chosen=parseValue(button.dataset.value);finish(q,sameValue(chosen,q.answer),chosen,q.answer);markChoices(q.answer,chosen)})}
function drawTask(q){const area=pick('#task');if(q.kind==='count'){area.innerHTML=`<div class='scene'>${objects(q.item,q.count)}</div>${choiceGrid(q.choices)}`;bindChoices(q)}if(q.kind==='tap'){area.innerHTML=`<div class='scene' style='--bg:var(--mint)'><div class='stars'>${Array.from({length:q.total},(_,i)=>`<button class='star' data-star='${i}'>☆</button>`).join('')}</div></div><p class='note' id='starNote'>已经点亮 0 颗</p><button class='btn good' id='checkStars'>完成</button>`;document.querySelectorAll('.star').forEach(button=>button.onclick=()=>{const index=Number(button.dataset.star);if(selectedStars.has(index)){selectedStars.delete(index);button.classList.remove('on');button.textContent='☆'}else{selectedStars.add(index);button.classList.add('on');button.textContent='★'}pick('#starNote').textContent=`已经点亮 ${selectedStars.size} 颗`});pick('#checkStars').onclick=()=>finish(q,selectedStars.size===q.answer,`${selectedStars.size} 颗`,`${q.answer} 颗`)}if(q.kind==='compare'){area.innerHTML=`<div class='compare'><button class='group' data-side='left'><span class='label'>左边</span><span class='objects'>${objects(q.item,q.left,'small')}</span></button><button class='group' data-side='right'><span class='label'>右边</span><span class='objects'>${objects(q.item,q.right,'small')}</span></button></div>`;document.querySelectorAll('.group').forEach(button=>button.onclick=()=>{const chosen=button.dataset.side;finish(q,chosen===q.answer,chosen==='left'?'左边':'右边',q.answer==='left'?'左边':'右边');markGroups(q.answer,chosen)})}if(q.kind==='add'){area.innerHTML=`<div class='scene' style='--bg:var(--lemon)'><div class='row'>${objects(q.item,q.left)}<span class='num'>+</span>${objects(q.item,q.right)}</div></div>${choiceGrid(q.choices)}`;bindChoices(q)}if(q.kind==='sub'){area.innerHTML=`<div class='scene' style='--bg:var(--rose)'>${objects(q.item,q.total-q.gone)}${objects(q.item,q.gone,'cross')}</div>${choiceGrid(q.choices)}`;bindChoices(q)}if(q.kind==='seq'){area.innerHTML=`<div class='scene'><div class='row'>${q.seq.map(number=>number===null?`<span class='num blank'>?</span>`:`<span class='num'>${number}</span>`).join('')}</div></div>${choiceGrid(q.choices)}`;bindChoices(q)}if(q.kind==='pattern'){area.innerHTML=`<div class='scene' style='--bg:var(--mint)'><div class='row'>${q.seq.map(item=>item===null?`<span class='pat blank'>?</span>`:`<span class='pat'>${item}</span>`).join('')}</div></div>${choiceGrid(q.choices)}`;bindChoices(q)}if(q.kind==='shape'){area.innerHTML=`<div class='scene' style='--bg:var(--lemon)'><div class='shape-grid'>${q.shapes.map(shape=>`<button class='choice shape-btn' data-value='${shape}'>${shapeHtml(shape)}</button>`).join('')}</div></div>`;bindChoices(q)}if(q.kind==='order'){area.innerHTML=`<div class='scene'><div class='task'><div class='row' id='sourceNums'>${q.nums.map(n=>`<button class='tile' data-num='${n}'>${n}</button>`).join('')}</div><div class='row' id='targetNums'>${q.nums.map(()=>`<span class='slot'>?</span>`).join('')}</div></div></div><div class='actions'><button class='btn' id='undoOrder'>退一格</button><button class='btn good' id='checkOrder'>完成</button></div>`;const updateSlots=()=>document.querySelectorAll('.slot').forEach((slot,i)=>slot.textContent=orderPick[i]??'?');document.querySelectorAll('.tile').forEach(button=>button.onclick=()=>{if(locked||button.classList.contains('used'))return;orderPick.push(Number(button.dataset.num));button.classList.add('used');button.disabled=true;updateSlots()});pick('#undoOrder').onclick=()=>{if(orderPick.length&&!locked){const last=orderPick.pop();const button=document.querySelector(`[data-num='${last}']`);button.classList.remove('used');button.disabled=false;updateSlots()}};pick('#checkOrder').onclick=()=>finish(q,sameValue(orderPick,q.answer),orderPick.join('、')||'还没排',q.answer.join('、'))}if(q.kind==='ten'){area.innerHTML=`<div class='scene' style='--bg:var(--mint)'><div class='ten'>${Array.from({length:10},(_,i)=>`<span class='ten-cell ${i<q.count?'fill':''}'>${i<q.count?'🍬':''}</span>`).join('')}</div></div>${choiceGrid(q.choices)}`;bindChoices(q)}if(q.kind==='mixed'){area.innerHTML=`<div class='scene' style='--bg:var(--lemon)'><div class='shape-grid'>${q.shapes.map(shape=>`<span class='num'>${shapeHtml(shape)}</span>`).join('')}</div></div>${choiceGrid(q.choices)}`;bindChoices(q)}}
function finish(q,isCorrect,picked,answer){if(locked)return;locked=true;answers[current]={correct:isCorrect,skill:q.skill,title:q.title,picked,answer,tip:q.tip};updateHud();document.querySelectorAll('button').forEach(button=>{if(!['nextBtn','prevBtn','readOne','readAll','restartTop'].includes(button.id))button.disabled=true});pick('#feedback').innerHTML=isCorrect?`<strong>答对啦！</strong> 得到一颗星。`:`<strong>这题先记下来。</strong> 正确答案是 ${answer}。${q.tip}`;if(isCorrect)celebrate(14);const next=pick('#nextBtn');next.disabled=false;next.textContent=current===tasks.length-1?'看结果':'下一题'}
function markChoices(answer,picked){document.querySelectorAll('.choice').forEach(button=>{const value=parseValue(button.dataset.value);if(sameValue(value,answer))button.classList.add('correct');if(sameValue(value,picked)&&!sameValue(value,answer))button.classList.add('wrong')})}
function markGroups(answer,picked){document.querySelectorAll('.group').forEach(button=>{if(button.dataset.side===answer)button.classList.add('correct');if(button.dataset.side===picked&&picked!==answer)button.classList.add('wrong')})}
function showResult(){updateHud();const good=answers.filter(a=>a&&a.correct).length;const msg=good>=10?'基础很稳，观察和数感都不错。':good>=7?'大部分能掌握，可以重点练错题类型。':'先从看图数数和 10 以内实物加减慢慢练。';pick('#card').innerHTML=`<div class='result'><div><span class='tag'>完成啦</span><h2>数学小测结果</h2></div><div class='big'><div><strong>${good}/${tasks.length}</strong><p class='sub'>${msg}</p></div></div><ul class='list'>${tasks.map((q,i)=>{const a=answers[i];const ok=a&&a.correct;return `<li><span>${ok?'✓':'·'}</span><span>${q.skill}<br><small>${q.title}</small></span><span class='answer'>${ok?'已掌握':'再练：'+q.tip}</span></li>`}).join('')}</ul><div class='actions'><button class='btn primary' id='again'>再测一次</button><button class='btn' id='printResult'>打印结果</button></div></div>`;pick('#again').onclick=restart;pick('#printResult').onclick=()=>window.print();celebrate(28)}
function restart(){current=0;locked=false;answers=[];render()}
function speak(text){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=.85;u.pitch=1.15;speechSynthesis.speak(u)}
function celebrate(count){const box=pick('#confetti');box.innerHTML='';const colors=['#f36b5f','#f3bb2b','#2f9d68','#2184c6','#745bc2'];for(let i=0;i<count;i+=1){const piece=document.createElement('span');piece.style.left=Math.random()*100+'%';piece.style.background=colors[i%colors.length];piece.style.animationDelay=Math.random()*220+'ms';box.appendChild(piece)}setTimeout(()=>box.innerHTML='',1300)}
pick('#readAll').onclick=()=>speak(answers.length===tasks.length?'数学小测结果':tasks[current].title);pick('#restartTop').onclick=restart;render();
</script>
</body>
</html>
