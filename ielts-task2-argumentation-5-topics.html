async function openPage(){
  try{
    if (!("DecompressionStream" in window)) throw new Error("当前浏览器不支持自动解压，请换用最新版 Chrome、Edge 或 Safari。")
    const compressed = chunks.join("");
    const bytes=Uint8Array.from(atob(compressed),c=>c.charCodeAt(0));
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    const html=await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.body.innerHTML='<div class="box"><div class="title">页面打开失败</div><div class="muted">'+err.message+'</div></div>';
  }
}
