<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>B1 词汇语境填空测试｜Alex Han Studio</title>
  <style>
    body{margin:0;font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;background:#f6f7fb;color:#172033;display:grid;min-height:100vh;place-items:center;}
    .box{max-width:560px;margin:24px;padding:28px;border:1px solid #e4e7ec;border-radius:18px;background:#fff;box-shadow:0 16px 40px rgba(16,24,40,.08);}
    .mark{display:flex;align-items:center;gap:14px;margin-bottom:12px;}.a{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#1f4e79,#c26d49);display:grid;place-items:center;color:#fff;font-weight:800;font-size:23px;}h1{font-size:22px;margin:0 0 8px;}p{margin:0;color:#667085;line-height:1.7}.err{color:#b42318;margin-top:12px;white-space:pre-wrap;}
  </style>
</head>
<body>
  <main class="box">
    <div class="mark"><span class="a">A</span><div><strong>Alex Han Studio</strong><h1>B1 词汇语境填空测试加载中</h1></div></div>
    <p>正在打开完整测试页面，请稍等。如果长时间停留在这里，请刷新一次。</p>
    <p id="err" class="err"></p>
  </main>
  <script>
  (async function(){
    const files = ["b1-context-cloze-803.data.1.txt","b1-context-cloze-803.data.2.txt","b1-context-cloze-803.data.3.txt","b1-context-cloze-803.data.4a.txt","b1-context-cloze-803.data.4b.txt","b1-context-cloze-803.data.5.txt","b1-context-cloze-803.data.6.txt","b1-context-cloze-803.data.7.txt"];
    const parts = await Promise.all(files.map(async file => {
      const res = await fetch(file + '?v=20260521-seq-check', { cache:'no-store' });
      if (!res.ok) throw new Error(file + ' 加载失败：' + res.status);
      return res.text();
    }));
    const bin = atob(parts.join(''));
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    let text;
    if ('DecompressionStream' in window) {
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      text = await new Response(stream).text();
    } else {
      throw new Error('当前浏览器版本过旧，无法解压测试页面。请使用最新版 Chrome、Edge 或 Safari 打开。');
    }
    if (!text.includes('const DISPLAY_NUMBER_BY_ID')) {
      text = text
        .replace('const QUESTION_ORDER = shuffleQuestions(QUESTIONS);', 'const QUESTION_ORDER = shuffleQuestions(QUESTIONS);\nconst DISPLAY_NUMBER_BY_ID = new Map(QUESTION_ORDER.map((item, index) => [item.n, index + 1]));')
        .replace('function inRange(n) {', 'function displayNumber(item) {\n  return DISPLAY_NUMBER_BY_ID.get(item.n) || item.n;\n}\n\nfunction inRange(n) {')
        .replace('if (!inRange(item.n)) return false;', 'if (!inRange(displayNumber(item))) return false;')
        .replace('return String(item.n).includes(q) || item.target.toLowerCase().includes(q) || item.context.toLowerCase().includes(q);', 'return String(displayNumber(item)).includes(q) || item.target.toLowerCase().includes(q) || item.context.toLowerCase().includes(q);')
        .replace('return QUESTIONS.filter(item => {', 'return QUESTION_ORDER.filter(item => {')
        .replace('Q${item.n}. ${escapeHtml(item.target)}', 'Q${displayNumber(item)}. ${escapeHtml(item.target)}')
        .replace("lines.push('Q' + item.n + '  错词：' + item.target);", "lines.push('Q' + displayNumber(item) + '  错词：' + item.target);");
    }
    text = text
      .replace('<div class="qtop"><div class="qnum">Question ${item.n}</div><div class="targettag">target: ${escapeHtml(item.target)}</div></div>', '<div class="qtop"><div class="qnum">Question ${displayNumber(item)}</div></div>')
      .replace('<div class="qtop"><div class="qnum">Question ${item.n}</div></div>', '<div class="qtop"><div class="qnum">Question ${displayNumber(item)}</div></div>')
      .replace('["truth", "educated", "lie", "bother"]', '["truth", "educated", "layer", "bother"]')
      .replace('["commercial", "nor", "worry", "fear"]', '["commercial", "nor", "worry", "feature"]');
    document.open();
    document.write(text);
    document.close();
  })().catch(err => {
    document.getElementById('err').textContent = err.message || String(err);
  });
  </script>
</body>
</html>
