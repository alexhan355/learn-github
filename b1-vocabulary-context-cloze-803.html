<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>B1 词汇语境填空测试｜Alex Han Studio</title>
  <style>
    body{margin:0;font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;background:#f6f7fb;color:#172033;display:grid;min-height:100vh;place-items:center;}
    .box{max-width:560px;margin:24px;padding:28px;border:1px solid #e4e7ec;border-radius:18px;background:#fff;box-shadow:0 16px 40px rgba(16,24,40,.08);}
    .mark{display:flex;align-items:center;gap:14px;margin-bottom:12px;}.a{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#1f4e79,#c26d49);display:grid;place-items:center;color:#fff;font-weight:800;font-size:23px;}h1{font-size:22px;margin:0 0 8px;}p{margin:0;color:#667085;line-height:1.7}.err{color:#b42318;margin-top:12px;white-space:pre-wrap;}
  </style>
</head>
<body>
  <main class="box">
    <div class="mark"><span class="a">A</span><div><strong>Alex Han Studio</strong><h1>B1 词汇语境填空测试加载中</h1></div></div>
    <p>正在打开完整测试页面，请稍等。如果长时间停留在这里，请刷新一次。</p>
    <p id="err" class="err"></p>
  </main>
  <script>
  (async function(){
    const files = ["b1-context-cloze-803.data.1.txt","b1-context-cloze-803.data.2.txt","b1-context-cloze-803.data.3.txt","b1-context-cloze-803.data.4a.txt","b1-context-cloze-803.data.4b.txt","b1-context-cloze-803.data.5.txt","b1-context-cloze-803.data.6.txt","b1-context-cloze-803.data.7.txt"];
    const parts = await Promise.all(files.map(async file => {
      const res = await fetch(file + '?v=20260521-submit', { cache:'force-cache' });
      if (!res.ok) throw new Error(file + ' 加载失败：' + res.status);
      return res.text();
    }));
    const bin = atob(parts.join(''));
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    let text;
    if ('DecompressionStream' in window) {
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      text = await new Response(stream).text();
    } else {
      throw new Error('当前浏览器版本过旧，无法解压测试页面。请使用最新版 Chrome、Edge 或 Safari 打开。');
    }
    if (!text.includes('const DISPLAY_NUMBER_BY_ID')) {
      text = text
        .replace('const QUESTION_ORDER = shuffleQuestions(QUESTIONS);', 'const QUESTION_ORDER = shuffleQuestions(QUESTIONS);\nconst DISPLAY_NUMBER_BY_ID = new Map(QUESTION_ORDER.map((item, index) => [item.n, index + 1]));')
        .replace('function inRange(n) {', 'function displayNumber(item) {\n  return DISPLAY_NUMBER_BY_ID.get(item.n) || item.n;\n}\n\nfunction inRange(n) {')
        .replace('if (!inRange(item.n)) return false;', 'if (!inRange(displayNumber(item))) return false;')
        .replace('return String(item.n).includes(q) || item.target.toLowerCase().includes(q) || item.context.toLowerCase().includes(q);', 'return String(displayNumber(item)).includes(q) || item.target.toLowerCase().includes(q) || item.context.toLowerCase().includes(q);')
        .replace('return QUESTIONS.filter(item => {', 'return QUESTION_ORDER.filter(item => {')
        .replace('Q${item.n}. ${escapeHtml(item.target)}', 'Q${displayNumber(item)}. ${escapeHtml(item.target)}')
        .replace("lines.push('Q' + item.n + '  错词：' + item.target);", "lines.push('Q' + displayNumber(item) + '  错词：' + item.target);");
    }
    text = text
      .replace('<option value="1-100">', '<option value="1-100" selected>')
      .replace('</head>', '<style>@media (max-width:900px){.controls{position:static}}</style></head>')
      .replace('<div class="qtop"><div class="qnum">Question ${item.n}</div><div class="targettag">target: ${escapeHtml(item.target)}</div></div>', '<div class="qtop"><div class="qnum">Question ${displayNumber(item)}</div></div>')
      .replace('<div class="qtop"><div class="qnum">Question ${item.n}</div></div>', '<div class="qtop"><div class="qnum">Question ${displayNumber(item)}</div></div>')
      .replace('说明：题目每次打开都会自动打乱顺序；错题汇总只统计已经作答且选错的题目。', '说明：题目每次打开都会自动打乱顺序；提交后，错题汇总会统计选错和未作答的题目。')
      .replace('The ____ of the mountain lake made everyone stop taking photographs.', 'The ____ of the mountain lake made everyone stop and take photographs.')
      .replace('["truth", "educated", "lie", "bother"]', '["truth", "educated", "layer", "bother"]')
      .replace('["commercial", "nor", "worry", "fear"]', '["commercial", "nor", "worry", "feature"]');
    if (!text.includes('id="submitQuiz"')) {
      text = text
        .replace('    .controls .wrap { padding-top:14px; padding-bottom:14px; display:grid; grid-template-columns:minmax(220px,1fr) repeat(6, auto); gap:10px; align-items:center; }', '    .controls .wrap { padding-top:14px; padding-bottom:14px; display:grid; grid-template-columns:minmax(220px,1fr) repeat(7, auto); gap:10px; align-items:center; }')
        .replace('    <button id="downloadWrong" class="success">下载错题TXT</button>\n    <button id="reset">重置作答</button>\n    <button class="primary" onclick="window.print()">打印</button>', '    <button id="downloadWrong" class="success">下载错题TXT</button>\n    <button id="submitQuiz" class="primary">提交并生成错词</button>\n    <button id="reset">重置作答</button>\n    <button onclick="window.print()">打印</button>')
        .replace('const state = { showAnswers:false, showWrong:false, selected:{} };', 'const state = { showAnswers:false, showWrong:false, submitted:false, selected:{} };')
        .replace("const downloadWrongBtn = document.getElementById('downloadWrong');\nconst wrongPanel = document.getElementById('wrongPanel');", "const downloadWrongBtn = document.getElementById('downloadWrong');\nconst submitQuizBtn = document.getElementById('submitQuiz');\nconst wrongPanel = document.getElementById('wrongPanel');")
        .replace("  const data = filtered();\n  const answered = Object.keys(state.selected).length;\n  let correct = 0;", "  const data = filtered();\n  const answered = Object.keys(state.selected).length;\n  const unanswered = QUESTIONS.length - answered;\n  let correct = 0;")
        .replace("  const wrong = wrongItems().length;\n  stats.innerHTML = `<span>当前显示：<b>${data.length}</b> / ${QUESTIONS.length} 题</span><span>已作答：<b>${answered}</b></span><span>正确：<b>${correct}</b></span><span>错误：<b>${wrong}</b></span>`;", "  const wrong = wrongItems().length;\n  const status = state.submitted ? '已提交' : '未提交';\n  const resultStats = state.submitted\n    ? `<span>正确：<b>${correct}</b></span><span>错误/未答：<b>${wrong}</b></span>`\n    : '<span>提交后显示结果</span>';\n  stats.innerHTML = `<span>当前显示：<b>${data.length}</b> / ${QUESTIONS.length} 题</span><span>已作答：<b>${answered}</b></span><span>未作答：<b>${unanswered}</b></span>${resultStats}<span>状态：<b>${status}</b></span>`;")
        .replace("function wrongItems() {\n  return QUESTION_ORDER.filter(item => {\n    const chosen = state.selected[item.n];\n    return chosen !== undefined && chosen !== item.answerIndex;\n  });\n}\nfunction renderWrongPanel() {", "function wrongItems() {\n  return QUESTION_ORDER.filter(item => {\n    const chosen = state.selected[item.n];\n    if (chosen === undefined) return state.submitted;\n    return chosen !== item.answerIndex;\n  });\n}\nfunction renderWrongPanel() {\n  if (!state.submitted) {\n    wrongSummary.innerHTML = '<p class=\"wrong-meta\">请先点击“提交并生成错词”，系统会自动生成错误词汇列表。</p>';\n    return;\n  }")
        .replace("wrongSummary.innerHTML = '<p class=\"wrong-meta\">目前没有错题。只有学生选错之后，这里才会出现汇总。</p>';", "wrongSummary.innerHTML = '<p class=\"wrong-meta\">本次没有错误词汇，全部题目回答正确。</p>';")
        .replace("    const chosenText = item.options[chosen] || '未选择';\n    const correctText = item.options[item.answerIndex];\n    const context = escapeHtml(item.context).replace('____', '<span class=\"blank\">____</span>');\n    return `<div class=\"wrong-item\">\n      <div><b>Q${displayNumber(item)}. ${escapeHtml(item.target)}</b></div>\n      <div class=\"wrong-context\">${context}</div>\n      <div class=\"wrong-detail\">学生选择：${'ABCD'[chosen] || '-'} . ${escapeHtml(chosenText)} ｜ 正确答案：${item.answerLetter}. ${escapeHtml(correctText)}</div>\n    </div>`;", "    const chosenText = chosen === undefined ? '未作答' : (item.options[chosen] || '未选择');\n    const correctText = item.options[item.answerIndex];\n    const context = escapeHtml(item.context).replace('____', '<span class=\"blank\">____</span>');\n    const choiceLabel = chosen === undefined ? '未作答' : `${'ABCD'[chosen] || '-'} . ${escapeHtml(chosenText)}`;\n    return `<div class=\"wrong-item\">\n      <div><b>Q${displayNumber(item)}. ${escapeHtml(item.target)}</b></div>\n      <div class=\"wrong-context\">${context}</div>\n      <div class=\"wrong-detail\">学生选择：${choiceLabel} ｜ 正确答案：${item.answerLetter}. ${escapeHtml(correctText)}</div>\n    </div>`;")
        .replace("wrongSummary.innerHTML = `<p class=\"wrong-meta\">共 ${items.length} 道错题</p><div class=\"wrong-words\">错词：${words}</div><div class=\"wrong-list\">${cards}</div>`;", "wrongSummary.innerHTML = `<p class=\"wrong-meta\">共 ${items.length} 个错误/未答词汇</p><div class=\"wrong-words\">错误词汇列表：${words}</div><div class=\"wrong-list\">${cards}</div>`;")
        .replace("function buildWrongText() {\n  const items = wrongItems();\n  if (!items.length) return '目前没有错题。';", "function buildWrongText() {\n  if (!state.submitted) return '请先提交测试，再生成错误词汇列表。';\n  const items = wrongItems();\n  if (!items.length) return '本次没有错误词汇。';")
        .replace("lines.push('学生选择：' + (chosen !== undefined ? 'ABCD'[chosen] + '. ' + item.options[chosen] : '未选择'));", "lines.push('学生选择：' + (chosen !== undefined ? 'ABCD'[chosen] + '. ' + item.options[chosen] : '未作答'));")
        .replace("function downloadWrongTxt() {\n  const text = buildWrongText();\n  if (text === '目前没有错题。') {\n    alert('目前没有错题。');", "function downloadWrongTxt() {\n  if (!state.submitted) {\n    alert('请先点击“提交并生成错词”。');\n    return;\n  }\n  const text = buildWrongText();\n  if (text === '本次没有错误词汇。') {\n    alert('本次没有错误词汇。');")
        .replace("toggleWrongBtn.addEventListener('click', () => {\n  state.showWrong = !state.showWrong;", "toggleWrongBtn.addEventListener('click', () => {\n  if (!state.submitted) {\n    alert('请先点击“提交并生成错词”。');\n    return;\n  }\n  state.showWrong = !state.showWrong;")
        .replace("downloadWrongBtn.addEventListener('click', downloadWrongTxt);", "submitQuizBtn.addEventListener('click', () => {\n  if (state.submitted) return;\n  const unanswered = QUESTIONS.length - Object.keys(state.selected).length;\n  if (unanswered > 0 && !confirm(`还有 ${unanswered} 道题未作答。未作答题目会计入错误词汇列表，确定提交吗？`)) return;\n  state.submitted = true;\n  state.showAnswers = false;\n  state.showWrong = true;\n  wrongPanel.classList.remove('hidden');\n  toggleAnswers.textContent = '查看答案';\n  toggleWrongBtn.textContent = '隐藏错题汇总';\n  submitQuizBtn.textContent = '已提交';\n  submitQuizBtn.disabled = true;\n  render();\n  renderWrongPanel();\n  wrongPanel.scrollIntoView({ behavior:'smooth', block:'start' });\n});\ndownloadWrongBtn.addEventListener('click', downloadWrongTxt);")
        .replace("  state.showWrong = false;\n  wrongPanel.classList.add('hidden');\n  toggleAnswers.textContent = '显示答案';\n  toggleWrongBtn.textContent = '错题汇总';", "  state.showWrong = false;\n  state.submitted = false;\n  wrongPanel.classList.add('hidden');\n  toggleAnswers.textContent = '显示答案';\n  toggleWrongBtn.textContent = '错题汇总';\n  submitQuizBtn.textContent = '提交并生成错词';");
    }
    text = text
      .replace("  const data = filtered();\n  const answered = Object.keys(state.selected).length;\n  const unanswered = QUESTIONS.length - answered;\n  let correct = 0;\n  for (const [n, idx] of Object.entries(state.selected)) {\n    const item = QUESTIONS.find(x => x.n == n);\n    if (item && item.answerIndex === idx) correct++;\n  }", "  const data = filtered();\n  const scope = QUESTION_ORDER.filter(item => inRange(displayNumber(item)));\n  const scopeIds = new Set(scope.map(item => String(item.n)));\n  const entries = Object.entries(state.selected).filter(([n]) => scopeIds.has(String(n)));\n  const answered = entries.length;\n  const unanswered = scope.length - answered;\n  let correct = 0;\n  for (const [n, idx] of entries) {\n    const item = QUESTIONS.find(x => x.n == n);\n    if (item && item.answerIndex === idx) correct++;\n  }")
      .replace('<span>未作答：<b>${unanswered}</b></span>', '<span>当前范围未答：<b>${unanswered}</b></span>')
      .replace("  return QUESTION_ORDER.filter(item => {\n    const chosen = state.selected[item.n];", "  return QUESTION_ORDER.filter(item => {\n    if (!inRange(displayNumber(item))) return false;\n    const chosen = state.selected[item.n];")
      .replace("  const unanswered = QUESTIONS.length - Object.keys(state.selected).length;", "  const scope = QUESTION_ORDER.filter(item => inRange(displayNumber(item)));\n  const answered = scope.filter(item => state.selected[item.n] !== undefined).length;\n  const unanswered = scope.length - answered;")
      .replace("  submitQuizBtn.disabled = true;\n  render();", "  submitQuizBtn.disabled = true;\n  range.disabled = true;\n  search.value = '';\n  search.disabled = true;\n  render();")
      .replace("  submitQuizBtn.disabled = false;\n  render();", "  submitQuizBtn.disabled = false;\n  range.disabled = false;\n  search.disabled = false;\n  render();");
    text = text
      .replace("      return `<button class=\"${cls}\" data-n=\"${item.n}\" data-idx=\"${idx}\"><span class=\"letter\">${'ABCD'[idx]}.</span>${escapeHtml(opt)}</button>`;", "      const disabled = state.submitted ? ' disabled' : '';\n      return `<button class=\"${cls}\" data-n=\"${item.n}\" data-idx=\"${idx}\"${disabled}><span class=\"letter\">${'ABCD'[idx]}.</span>${escapeHtml(opt)}</button>`;")
      .replace("list.addEventListener('click', e => {\n  const btn", "list.addEventListener('click', e => {\n  if (state.submitted) return;\n  const btn")
      .replace("toggleAnswers.addEventListener('click', () => {\n  state.showAnswers = !state.showAnswers;", "toggleAnswers.addEventListener('click', () => {\n  if (!state.submitted) {\n    alert('请先提交测试，再查看答案。');\n    return;\n  }\n  state.showAnswers = !state.showAnswers;")
      .replace("  submitQuizBtn.textContent = '提交并生成错词';\n  render();", "  submitQuizBtn.textContent = '提交并生成错词';\n  submitQuizBtn.disabled = false;\n  render();")
      .split('显示答案').join('查看答案');
    text = text.replace("  submitQuizBtn.disabled = false;\n  render();", "  submitQuizBtn.disabled = false;\n  range.disabled = false;\n  search.disabled = false;\n  render();");
    document.open();
    document.write(text);
    document.close();
  })().catch(err => {
    document.getElementById('err').textContent = err.message || String(err);
  });
  </script>
</body>
</html>
