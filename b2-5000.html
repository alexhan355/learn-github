<script>window.DICTATION_CONFIG={"level":"B2-5000","series":"5000系列 B2","dataUrls":["b2-5000-1.txt","b2-5000-2.txt","b2-5000-3.txt","b2-5000-4.txt"],"accent":"#be123c"};</script>
<script>(function(){var posByMeaning=Object.create(null),labels={noun:"名词",verb:"动词",adj:"形容词",adv:"副词",prep:"介词",conj:"连词",det:"限定词/冠词",pron:"代词",number:"数词",exclamation:"感叹词"},dataRe=/b2-5000-[1-4]\.txt(?:\?|$)/;function labelPos(pos){return String(pos||"").split(/[+\/,]/).map(function(p){return p.trim()}).filter(Boolean).map(function(p){return labels[p]||p}).join(" / ")||"词汇"}if(window.fetch){var realFetch=window.fetch.bind(window);window.fetch=function(input,init){var url=typeof input==="string"?input:(input&&input.url)||"";return realFetch(input,init).then(function(res){if(!dataRe.test(url))return res;return res.text().then(function(text){var clean=text.split(/\n/).map(function(row){row=row.replace(/\r/g,"").trim();if(!row)return row;var parts=row.split("|");if(parts.length>=3){posByMeaning[parts[1]]=parts.slice(2).join("|");return parts[0]+"|"+parts[1]}return row}).join("\n");return new Response(clean,{status:res.status,statusText:res.statusText,headers:res.headers})})})}}function applyPos(){var prompt=document.getElementById("prompt"),hint=document.getElementById("hint");if(!prompt||!hint)return;var pos=posByMeaning[prompt.textContent.trim()];if(pos&&/^首字母：/.test(hint.textContent)){var first=hint.textContent.split("｜")[0].trim();hint.textContent=first+" ｜ 词性："+labelPos(pos)}}function boot(){var root=document.getElementById("dictation-root")||document.body;if(!root)return;new MutationObserver(applyPos).observe(root,{subtree:true,childList:true,characterData:true});setInterval(applyPos,500)}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot()})();</script>
<script>(function(){var q=location.search.toLowerCase(),context=q.indexOf("context")>-1||q.indexOf("cloze")>-1,app=document.createElement("script");app.defer=true;app.src=context?"./context-cloze-app.js?v=20260520-contextlogic":"./dictation-app.js?v=20260527-poshint";app.onload=function(){var p=document.createElement("script");p.defer=true;p.src="./vocab-ui-polish.js?v=20260520-contextlogic";document.head.appendChild(p)};document.head.appendChild(app);})();</script>
</head>
