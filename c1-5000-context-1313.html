<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C1-5000 词汇语境选择测试｜Alex Han Studio</title><style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#e4e7ec;--brand:#1f4e79;--gold:#c26d49;--ok:#0f7b55;--bad:#b42318;--soft:#eef4ff;--warn:#fff8eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6}header{background:linear-gradient(135deg,#fff 0%,#eef4ff 58%,#fff6ed 100%);border-bottom:1px solid var(--line)}.wrap{max-width:1180px;margin:0 auto;padding:24px}.brand{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.logo{display:flex;align-items:center;gap:13px;background:#fff;border:1px solid rgba(31,78,121,.16);border-radius:18px;padding:12px 16px;box-shadow:0 10px 24px rgba(16,24,40,.07)}.mark{width:48px;height:48px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--gold));color:#fff;font-size:24px;font-weight:900}.logo b{display:block;font-size:18px}.logo small{color:var(--muted)}h1{margin:0 0 6px;font-size:28px}.sub{margin:0;color:var(--muted)}.pills{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.pill,.stats span,.meta{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 11px;color:#344054}.controls{position:sticky;top:0;z-index:5;background:rgba(246,247,251,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}.controls .wrap{display:grid;grid-template-columns:minmax(220px,1fr) repeat(7,auto);gap:10px;padding-top:14px;padding-bottom:14px}input,select,button{font:inherit}input,select{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}button{border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);padding:10px 13px;cursor:pointer}.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.success{background:var(--ok);color:#fff;border-color:var(--ok)}main.wrap{padding-top:20px}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;color:var(--muted);font-size:14px}.panel,.q{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 8px rgba(16,24,40,.04)}.panel{padding:18px;margin-bottom:18px}.panel h2{margin:0 0 12px;font-size:19px}.words{margin:10px 0 14px;padding:12px;border-radius:12px;background:var(--warn);border:1px solid #fedf89;color:#7a4b00}.wrongItem{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;background:#fcfcfd}.wrongItem b{color:var(--bad)}.q{padding:18px;margin:14px 0}.qnum{color:var(--brand);font-weight:800}.sentence{font-size:18px;margin:10px 0 14px}.blank{font-weight:800;color:#7a4cc2;letter-spacing:1px}.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.opt{text-align:left;min-height:46px}.opt span{font-weight:800;color:var(--brand);margin-right:8px}.opt.sel{outline:2px solid #7a4cc2;border-color:#7a4cc2}.opt.good{background:#ecfdf3;border-color:#75c6a4}.opt.bad{background:#fff1f0;border-color:#f2a5a0}.ans{display:none;margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--soft)}.ans.show{display:block}.ans b{color:var(--ok)}.hidden{display:none!important}.foot{color:var(--muted);font-size:13px;margin:24px 0 40px}@media(max-width:900px){.controls .wrap{grid-template-columns:1fr 1fr}.controls input{grid-column:1/-1}.opts{grid-template-columns:1fr}button{min-width:0}}@media print{.controls,.panel{display:none!important}body{background:#fff}.q{break-inside:avoid;box-shadow:none}}
</style></head><body><header><div class="wrap"><div class="brand"><div class="logo"><span class="mark">A</span><span><b>Alex Han Studio</b><small>C1-5000 Context Cloze</small></span></div><div><h1>C1-5000 词汇语境选择测试</h1><p class="sub">1313 道四选一语境题｜提交后自动生成错误词汇列表</p></div></div><div class="pills"><span class="pill">C1-5000</span><span class="pill">Context Cloze</span><span class="pill">A-D 四选一</span><span class="pill">Alex Han Studio</span></div></div></header><section class="controls"><div class="wrap"><input id="search" placeholder="搜索题号、题干或选项"><select id="range"><option value="all">全部题目</option></select><button id="submit" class="primary">提交并生成错词</button><button id="answers">查看答案</button><button id="wrongBtn">错题汇总</button><button id="download" class="success">下载错词TXT</button><button id="reset">重置作答</button><button onclick="window.print()">打印</button></div></section><main class="wrap"><div id="loading" class="panel">正在加载题库，请稍等。</div><div id="stats" class="stats"></div><section id="wrongPanel" class="panel hidden"><h2>错题与错词汇总</h2><button id="download2" class="success">下载 TXT</button><div id="wrongSummary"></div></section><div id="list"></div><p class="foot">页面由 Alex Han Studio 制作。C1-5000 系列。</p></main><script>
const DATA_FILES=["c1-5000-context-lite-1313.data.1a.txt","c1-5000-context-lite-1313.data.1b.txt","c1-5000-context-lite-1313.data.2a.txt","c1-5000-context-lite-1313.data.2b.txt","c1-5000-context-lite-1313.data.3.txt","c1-5000-context-lite-1313.data.4.txt"],SERIES="C1-5000";let QUESTIONS=[],ORDER=[],DISPLAY=new Map();const state={submitted:false,showAnswers:false,showWrong:false,selected:{}};const $=id=>document.getElementById(id),abc="ABCD";
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}function shuffle(a){const x=a.slice();for(let i=x.length-1;i>0;i--){const j=hash(x[i].target+String(i))%(i+1);[x[i],x[j]]=[x[j],x[i]]}return x}function display(q){return DISPLAY.get(q.id)||q.id+1}
function makeOptions(q){const t=q.target.toLowerCase(),pool=QUESTIONS.filter(x=>x.target.toLowerCase()!==t).map(x=>x.target);const ranked=pool.map(w=>({w,score:Math.abs(w.length-q.target.length)+(w[0].toLowerCase()===q.target[0].toLowerCase()?-3:0)+(w.includes('-')===q.target.includes('-')?-1:0)+(hash(w+q.target)%100)/1000})).sort((a,b)=>a.score-b.score).slice(0,3).map(x=>x.w);let opts=ranked.slice(0,3);const pos=hash(q.target)%4;opts.splice(pos,0,q.target);q.options=opts;q.answerIndex=pos;q.answerLetter=abc[pos]}
async function load(){const parts=await Promise.all(DATA_FILES.map(async f=>{const r=await fetch(f+'?v=20260522-c15000context2',{cache:'no-store'});if(!r.ok)throw Error(f+' 加载失败：'+r.status);return r.text()}));const bin=atob(parts.join('')),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);if(!('DecompressionStream'in window))throw Error('当前浏览器版本过旧，请使用最新版 Chrome、Edge 或 Safari 打开。');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const rows=JSON.parse(await new Response(stream).text()),fix={"The brochure began to ____ about the hotel's private beach.":"The brochure seemed to ____ about the hotel's private beach.","The mayor decided to ____ that the bridge would be rebuilt.":"The mayor made a public ____ that the bridge would be rebuilt."};QUESTIONS=rows.map((r,i)=>({id:i,target:r[0],context:fix[r[1]]||r[1]}));QUESTIONS.forEach(makeOptions);ORDER=shuffle(QUESTIONS);DISPLAY=new Map(ORDER.map((q,i)=>[q.id,i+1]));for(let s=1;s<=QUESTIONS.length;s+=100){let e=Math.min(s+99,QUESTIONS.length),o=document.createElement('option');o.value=s+'-'+e;o.textContent=s+'-'+e;range.appendChild(o)}}
function inRange(n){if(range.value==='all')return true;const [s,e]=range.value.split('-').map(Number);return n>=s&&n<=e}function filtered(){const q=search.value.trim().toLowerCase();return ORDER.filter(x=>{const n=display(x);if(!inRange(n))return false;if(!q)return true;return String(n).includes(q)||x.context.toLowerCase().includes(q)||x.options.some(o=>o.toLowerCase().includes(q))})}
function wrongItems(){return ORDER.filter(q=>state.selected[q.id]===undefined?state.submitted:state.selected[q.id]!==q.answerIndex)}function render(){const data=filtered(),answered=Object.keys(state.selected).length,unanswered=QUESTIONS.length-answered;let correct=0;for(const [id,idx]of Object.entries(state.selected)){const q=QUESTIONS[id];if(q&&q.answerIndex===idx)correct++}const wrong=wrongItems().length;stats.innerHTML='<span>当前显示：<b>'+data.length+'</b> / '+QUESTIONS.length+' 题</span><span>已作答：<b>'+answered+'</b></span><span>未作答：<b>'+unanswered+'</b></span>'+(state.submitted?'<span>正确：<b>'+correct+'</b></span><span>错误/未答：<b>'+wrong+'</b></span>':'<span>提交后显示结果</span>')+'<span>状态：<b>'+(state.submitted?'已提交':'未提交')+'</b></span>';list.innerHTML=data.map(q=>{const chosen=state.selected[q.id],opts=q.options.map((op,i)=>{let cls='opt';if(chosen===i)cls+=' sel';if(state.showAnswers&&i===q.answerIndex)cls+=' good';if(state.showAnswers&&chosen===i&&i!==q.answerIndex)cls+=' bad';return '<button class="'+cls+'" data-id="'+q.id+'" data-idx="'+i+'"'+(state.submitted?' disabled':'')+'><span>'+abc[i]+'.</span>'+esc(op)+'</button>'}).join(''),ctx=esc(q.context).replace('____','<span class="blank">____</span>');return '<article class="q"><div class="qnum">Question '+display(q)+'</div><div class="sentence">'+ctx+'</div><div class="opts">'+opts+'</div><div class="ans '+(state.showAnswers?'show':'')+'">答案：<b>'+q.answerLetter+'. '+esc(q.target)+'</b></div></article>'}).join('');if(state.showWrong)renderWrong()}
function renderWrong(){if(!state.submitted){wrongSummary.innerHTML='<p class="meta">请先点击“提交并生成错词”。</p>';return}const items=wrongItems();if(!items.length){wrongSummary.innerHTML='<p class="meta">本次没有错误词汇。</p>';return}wrongSummary.innerHTML='<p class="meta">共 '+items.length+' 个错误/未答词汇</p><div class="words">错误词汇列表：'+items.map(x=>esc(x.target)).join(' / ')+'</div>'+items.map(q=>{const c=state.selected[q.id],choice=c===undefined?'未作答':abc[c]+'. '+esc(q.options[c]);return '<div class="wrongItem"><b>Q'+display(q)+'. '+esc(q.target)+'</b><div>'+esc(q.context).replace('____','<span class="blank">____</span>')+'</div><small>学生选择：'+choice+' ｜ 正确答案：'+q.answerLetter+'. '+esc(q.target)+'</small></div>'}).join('')}
function textWrong(){const items=wrongItems();if(!state.submitted)return'请先提交测试。';if(!items.length)return'本次没有错误词汇。';const lines=[SERIES+' 语境选择错题与错词汇总','Alex Han Studio','错题/未答数量：'+items.length,'','错误词汇：'+items.map(x=>x.target).join(', '),''];items.forEach(q=>{const c=state.selected[q.id];lines.push('Q'+display(q)+'  错词：'+q.target);lines.push('题干：'+q.context);lines.push('学生选择：'+(c===undefined?'未作答':abc[c]+'. '+q.options[c]));lines.push('正确答案：'+q.answerLetter+'. '+q.target);lines.push('')});return lines.join('\n')}function downloadTxt(){if(!state.submitted){alert('请先点击“提交并生成错词”。');return}const txt=textWrong();if(txt==='本次没有错误词汇。'){alert(txt);return}const a=document.createElement('a'),url=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'}));a.href=url;a.download='C1-5000_context_cloze_wrong_words_Alex_Han_Studio.txt';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}
list.onclick=e=>{if(state.submitted)return;const b=e.target.closest('button.opt');if(!b)return;state.selected[Number(b.dataset.id)]=Number(b.dataset.idx);render()};search.oninput=render;range.onchange=render;submit.onclick=()=>{const left=QUESTIONS.length-Object.keys(state.selected).length;if(left>0&&!confirm('还有 '+left+' 道题未作答。未作答题目会计入错误词汇列表，确定提交吗？'))return;state.submitted=true;state.showWrong=true;state.showAnswers=false;wrongPanel.classList.remove('hidden');submit.textContent='已提交';answers.textContent='查看答案';render();renderWrong();wrongPanel.scrollIntoView({behavior:'smooth',block:'start'})};answers.onclick=()=>{if(!state.submitted){alert('请先提交测试，再查看答案。');return}state.showAnswers=!state.showAnswers;answers.textContent=state.showAnswers?'隐藏答案':'查看答案';render()};wrongBtn.onclick=()=>{if(!state.submitted){alert('请先提交测试。');return}state.showWrong=!state.showWrong;wrongPanel.classList.toggle('hidden',!state.showWrong);renderWrong()};download.onclick=downloadTxt;download2.onclick=downloadTxt;reset.onclick=()=>{state.submitted=false;state.showAnswers=false;state.showWrong=false;state.selected={};wrongPanel.classList.add('hidden');submit.textContent='提交并生成错词';render()};load().then(()=>{loading.classList.add('hidden');render()}).catch(e=>{loading.textContent=e.message||String(e);loading.style.color='#b42318'});
</script></body></html>
