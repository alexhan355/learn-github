<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人教版高中英语词汇英译汉选择题</title>
<style>
:root {
  --ink:#17202f; --muted:#667085; --line:#d7dde8; --paper:#ffffff; --wash:#f6f8fb;
  --orange:#ed6f21; --teal:#0f8b8d; --navy:#243b6b; --green:#23805a; --red:#b9384b;
  --gold:#e5a72f; --shadow:0 18px 48px rgba(19,30,48,.12);
}
* { box-sizing:border-box; }
html { min-height:100%; }
body {
  margin:0; min-height:100vh; color:var(--ink);
  background:
    linear-gradient(90deg, rgba(15,139,141,.08) 1px, transparent 1px),
    linear-gradient(180deg, rgba(237,111,33,.07) 1px, transparent 1px),
    linear-gradient(145deg, #f8fbfd 0%, #fff 48%, #f5faf9 100%);
  background-size:38px 38px, 38px 38px, auto;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
button,input,select,textarea { font:inherit; }
button { cursor:pointer; touch-action:manipulation; }
.app { width:min(1240px, calc(100% - 28px)); margin:0 auto; padding:18px 0 40px; }
.top {
  display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:16px;
  padding:14px 0 18px;
}
.brand { display:flex; gap:16px; align-items:center; min-width:0; }
.logoMark {
  width:104px; min-height:76px; border-radius:8px; flex:0 0 auto;
  display:grid; place-items:center; align-content:center; gap:2px;
  color:#fff; background:linear-gradient(145deg,var(--orange),#f09a2e 58%,var(--teal));
  box-shadow:0 10px 28px rgba(237,111,33,.22);
}
.logoMark span { font-size:32px; line-height:1; font-weight:950; }
.logoMark small { font-size:11px; font-weight:900; letter-spacing:.08em; }
h1 { margin:0; font-size:30px; line-height:1.15; letter-spacing:0; }
.sub { margin:7px 0 0; color:var(--muted); line-height:1.55; font-size:14px; }
.topActions,.controlLine,.bookTabs,.unitTabs,.rowActions,.resultActions { display:flex; gap:9px; flex-wrap:wrap; align-items:center; }
.topActions { justify-content:flex-end; }
.btn,.tab,.chip,.unknownBtn,.choiceBtn {
  min-height:40px; border:1px solid var(--line); border-radius:8px; background:var(--paper); color:var(--ink);
  padding:0 13px; font-weight:800; box-shadow:0 2px 0 rgba(23,32,47,.08);
}
.btn:hover,.tab:hover,.chip:hover,.unknownBtn:hover,.choiceBtn:hover { transform:translateY(-1px); box-shadow:0 8px 18px rgba(19,30,48,.12); }
.btn.primary { background:var(--navy); color:#fff; border-color:var(--navy); }
.btn.good { background:var(--green); color:#fff; border-color:var(--green); }
.btn.warn { background:#fff4df; color:#61400d; border-color:#f0cf88; }
.btn.ghost { background:transparent; }
.tab.active,.chip.active { background:#e7f5f5; border-color:#86cbcd; color:#075b5d; }
.unknownBtn.active { background:#fff1db; border-color:#f0b869; color:#8a4d00; }
.controls {
  background:rgba(255,255,255,.92); border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow);
  padding:14px; display:grid; gap:12px; margin-bottom:16px;
}
.controlLine { justify-content:space-between; align-items:center; }
.selectBox { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.selectBox label { font-weight:900; color:#334155; }
.selectBox select {
  min-height:40px; border:1px solid var(--line); border-radius:8px; background:#fff; padding:0 11px; font-weight:800;
}
.summaryGrid {
  display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-bottom:16px;
}
.stat {
  min-height:78px; border:1px solid var(--line); border-radius:8px; background:#fff; padding:12px;
}
.stat small { display:block; color:var(--muted); font-weight:800; }
.stat strong { display:block; margin-top:4px; font-size:26px; line-height:1; }
.board {
  background:rgba(255,255,255,.95); border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow);
  overflow:hidden;
}
.boardHead {
  display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:center;
  padding:16px; border-bottom:1px solid var(--line); background:#fbfcfe;
}
.boardHead h2 { margin:0; font-size:22px; letter-spacing:0; }
.countPill {
  min-height:32px; display:inline-flex; align-items:center; border-radius:999px; padding:0 11px;
  background:#eef6ff; color:#244b7b; font-weight:900; border:1px solid #cfe0f4;
}
.rows { display:grid; }
.wordRow {
  display:grid; grid-template-columns:52px minmax(190px,.8fr) minmax(320px,1.8fr) 104px;
  gap:12px; align-items:start; padding:13px 16px; border-bottom:1px solid #e7ebf1;
}
.wordRow:last-child { border-bottom:0; }
.wordRow.correct { background:#f0fbf5; }
.wordRow.wrong { background:#fff5f5; }
.num { color:var(--muted); font-weight:900; }
.wordMain { min-width:0; }
.word {
  display:block; font-size:22px; line-height:1.18; font-weight:950; overflow-wrap:anywhere;
}
.phonetic { display:block; margin-top:4px; color:#64748b; font-size:13px; line-height:1.35; overflow-wrap:anywhere; }
.choiceGroup {
  display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px;
}
.choiceBtn {
  width:100%; min-height:48px; text-align:left; line-height:1.45; padding:9px 11px; font-weight:800;
  border-color:#cfd8e6; box-shadow:none; overflow-wrap:anywhere;
}
.choiceBtn.active { background:#e7f5f5; border-color:#69bdc0; color:#075b5d; box-shadow:0 0 0 3px rgba(15,139,141,.12); }
.choiceBtn.correctChoice { background:#e9f8ef; border-color:#8bd0a8; color:#0f5138; }
.choiceBtn.wrongChoice { background:#fff0f1; border-color:#ec9aa6; color:#9f2638; }
.choiceBtn[disabled] { cursor:default; transform:none; box-shadow:none; }
.rowResult { display:none; grid-column:2 / -1; color:#334155; line-height:1.55; font-size:14px; padding:0 0 3px; }
.submitted .rowResult { display:block; }
.standard { font-weight:800; color:#0f5138; }
.badText { color:var(--red); font-weight:800; }
.resultBox {
  display:none; margin:16px 0; background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow); overflow:hidden;
}
.resultBox.open { display:block; }
.resultTop {
  display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:center; padding:16px; border-bottom:1px solid var(--line);
  background:linear-gradient(90deg,#fff8ed,#eefafa);
}
.resultTop h2 { margin:0; font-size:22px; }
.wrongList { display:grid; gap:0; max-height:520px; overflow:auto; }
.wrongItem {
  display:grid; grid-template-columns:minmax(160px,.7fr) minmax(180px,1fr) minmax(180px,1fr);
  gap:12px; padding:12px 16px; border-bottom:1px solid #e7ebf1; align-items:start;
}
.wrongItem:last-child { border-bottom:0; }
.wrongItem strong { display:block; font-size:18px; overflow-wrap:anywhere; }
.wrongItem span,.wrongItem small { line-height:1.5; color:#475569; overflow-wrap:anywhere; }
.empty { padding:26px 16px; color:var(--muted); font-weight:800; }
.hidden { display:none !important; }
@media(max-width:880px) {
  .app { width:min(100% - 18px, 1240px); }
  .top,.controlLine,.boardHead,.resultTop { grid-template-columns:1fr; }
  .topActions,.resultActions { justify-content:stretch; }
  .btn { flex:1 1 auto; }
  .summaryGrid { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .wordRow { grid-template-columns:38px minmax(0,1fr); gap:8px; }
  .choiceGroup,.rowActions { grid-column:2; }
  .rowActions { justify-content:flex-start; }
  .wrongItem { grid-template-columns:1fr; }
}
@media(max-width:560px) {
  h1 { font-size:23px; }
  .brand { align-items:flex-start; }
  .logoMark { width:82px; min-height:68px; }
  .summaryGrid { grid-template-columns:1fr; }
  .word { font-size:20px; }
  .choiceGroup { grid-template-columns:1fr; }
  .controls,.board,.resultBox { border-radius:8px; }
}
</style>
</head>

function escapeHtml(value) {

}

function shuffle(items) {
  const arr = [...items];
  for (let i = arr.length - 1; i > 0; i -= 1) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function hashText(value) {
  let hash = 2166136261;
  for (const ch of String(value)) {
    hash ^= ch.charCodeAt(0);
    hash = Math.imul(hash, 16777619);
  }
  return hash >>> 0;
}

function cleanForDisplay(answer) {
  return String(answer || '')
    .replace(/(^|[；;，,、\s(（])(?:(?:modal\s+v|vi|vt|adj|adv|ad|prep|pron|conj|num|art|abbr|n|v|a)\b\.?\s*(?:&\s*)?)+/gi, '$1')
    .replace(/\s+/g, ' ')
    .trim();
}

function choiceKey(answer) {
  return cleanForDisplay(answer).replace(/[\s;；,，、]+/g, '');
}

function wordCore(word) {
  return String(word || '')
    .toLowerCase()
    .replace(/\([^)]*\)/g, '')
    .replace(/[^a-z]/g, '');
}

function roughStem(word) {
  let core = wordCore(word);
  const suffixes = ['ization', 'isation', 'ational', 'fulness', 'iveness', 'ically', 'ation', 'ition', 'sion', 'tion', 'ment', 'ness', 'less', 'able', 'ible', 'ally', 'ical', 'ious', 'ous', 'ive', 'ful', 'ing', 'ed', 'ly', 'al', 'er', 'or', 'ist', 'ism', 'ity', 'ic', 'es', 's'];
  for (const suffix of suffixes) {
    if (core.length - suffix.length >= 5 && core.endsWith(suffix)) {
      core = core.slice(0, -suffix.length);
      break;
    }
  }
  return core;
}

function commonPrefixRatio(a, b) {
  const left = wordCore(a);
  const right = wordCore(b);
  const min = Math.min(left.length, right.length);
  if (min < 5) return 0;
  let i = 0;
  while (i < min && left[i] === right[i]) i += 1;
  return i / min;
}

function chineseBigrams(text) {
  const chars = choiceKey(text).replace(/[a-zA-Z0-9]/g, '').split('').filter(Boolean);
  const grams = new Set();
  for (let i = 0; i < chars.length - 1; i += 1) grams.add(chars[i] + chars[i + 1]);
  return grams;
}

function overlapRatio(left, right) {
  const a = chineseBigrams(left);
  const b = chineseBigrams(right);
  if (!a.size || !b.size) return 0;
  let hit = 0;
  for (const gram of a) if (b.has(gram)) hit += 1;
  return hit / Math.min(a.size, b.size);
}

function tooSimilar(item, candidate) {
  if (Math.abs(Number(item.id) - Number(candidate.id)) <= 3) return true;
  const left = wordCore(item.word);
  const right = wordCore(candidate.word);
  if (left.length >= 5 && right.length >= 5) {
    const leftStem = roughStem(left);
    const rightStem = roughStem(right);
    if (leftStem.length >= 5 && rightStem.length >= 5 && (leftStem === rightStem || leftStem.startsWith(rightStem) || rightStem.startsWith(leftStem))) return true;
    if (commonPrefixRatio(left, right) >= 0.72) return true;
  }
  if (overlapRatio(item.answer, candidate.answer) >= 0.56) return true;
  return false;
}

function posSignature(item) {
  if (item.posSignature) return item.posSignature;
  const tags = new Set();
  const answer = String(item.answer || '').toLowerCase();
  const re = /(^|[^a-z])(?:vi|vt|adj|adv|ad|prep|pron|conj|num|art|abbr|n|v|a)\s*[\.,]/g;
  let match;
  while ((match = re.exec(answer))) {
    const raw = match[0].replace(/^[^a-z]*/, '').replace(/[\s\.,]/g, '');
    if (raw === 'vt' || raw === 'vi') tags.add('v');
    else if (raw === 'ad') tags.add('adv');
    else if (raw === 'a') tags.add('adj');
    else tags.add(raw);
  }
  if (tags.has('abbr') && tags.size > 1) tags.delete('abbr');
  const order = ['abbr', 'n', 'v', 'adj', 'adv', 'prep', 'pron', 'conj', 'num', 'art'];
  const sorted = order.filter(tag => tags.has(tag));
  if (sorted.length) {
    item.posSignature = sorted.join('+');
    return item.posSignature;
  }
  item.posSignature = /\s/.test(item.word) ? 'phrase' : 'other';
  return item.posSignature;
}

function broadPos(signature) {
  if (signature === 'phrase' || signature === 'other' || signature === 'abbr') return signature;
  const parts = signature.split('+');
  if (parts.includes('v')) return 'v';
  if (parts.includes('n')) return 'n';
  if (parts.includes('adj')) return 'adj';
  return parts[0];
}

function optionFamily(item) {
  const signature = posSignature(item);
  const parts = signature.split('+');
  const answer = String(item.answer || '');
  if (signature === 'phrase' || signature === 'other' || signature === 'abbr') return signature;
  if (parts.includes('num') || /百分|一百万|数量|数目|数额|数值|比例|比率|倍数|分数|小数|多数|少数/.test(answer)) return 'quantity';
  if (parts.includes('conj') && parts.includes('n')) return 'n';
  if (parts.includes('adv') && parts.includes('n')) return 'n';
  if (parts.includes('adv') || parts.includes('prep') || parts.includes('conj') || parts.includes('pron') || parts.includes('art')) return 'function';
  return broadPos(signature);
}

function pushBucket(map, key, item) {
  if (!map.has(key)) map.set(key, []);
  map.get(key).push(item);
}

function bucket(map, key) {
  return map.get(key) || [];
}

function prepareChoiceBuckets() {
  if (CHOICE_BUCKETS.ready) return;
  for (const item of VOCAB) {
    const exact = posSignature(item);
    const family = optionFamily(item);
    pushBucket(CHOICE_BUCKETS.exactAll, exact, item);
    pushBucket(CHOICE_BUCKETS.exactBook, `${item.book}|${exact}`, item);
    pushBucket(CHOICE_BUCKETS.exactUnit, `${item.book}|${item.unit}|${exact}`, item);
    pushBucket(CHOICE_BUCKETS.familyAll, family, item);
    pushBucket(CHOICE_BUCKETS.familyBook, `${item.book}|${family}`, item);
    pushBucket(CHOICE_BUCKETS.familyUnit, `${item.book}|${item.unit}|${family}`, item);
  }
  CHOICE_BUCKETS.ready = true;
}

function addDistractors(out, item, candidates, seen, options = {}) {
  const allowSimilar = !!options.allowSimilar;
  const sorted = [...candidates].sort((a, b) => hashText(`${item.id}:${a.id}`) - hashText(`${item.id}:${b.id}`));
  for (const candidate of sorted) {
    if (out.length >= 3) break;
    if (candidate.id === item.id) continue;
    if (!allowSimilar && tooSimilar(item, candidate)) continue;
    const key = choiceKey(candidate.answer);
    if (!key || seen.has(key)) continue;
    seen.add(key);
    out.push(candidate);
  }
}

function buildChoices(item) {
  prepareChoiceBuckets();
  const distractors = [];
  const seen = new Set([choiceKey(item.answer)]);
  const targetPos = posSignature(item);
  const targetFamily = optionFamily(item);
  addDistractors(distractors, item, bucket(CHOICE_BUCKETS.exactUnit, `${item.book}|${item.unit}|${targetPos}`), seen);
  addDistractors(distractors, item, bucket(CHOICE_BUCKETS.exactBook, `${item.book}|${targetPos}`), seen);
  addDistractors(distractors, item, bucket(CHOICE_BUCKETS.exactAll, targetPos), seen);
  addDistractors(distractors, item, bucket(CHOICE_BUCKETS.familyUnit, `${item.book}|${item.unit}|${targetFamily}`), seen);
  addDistractors(distractors, item, bucket(CHOICE_BUCKETS.familyBook, `${item.book}|${targetFamily}`), seen);
  addDistractors(distractors, item, bucket(CHOICE_BUCKETS.familyAll, targetFamily), seen);
  addDistractors(distractors, item, bucket(CHOICE_BUCKETS.exactAll, targetPos), seen, {allowSimilar: true});
  addDistractors(distractors, item, bucket(CHOICE_BUCKETS.familyAll, targetFamily), seen, {allowSimilar: true});
  addDistractors(distractors, item, VOCAB, seen, {allowSimilar: true});
  return [item, ...distractors.slice(0, 3)]
    .sort((a, b) => hashText(`${item.id}:choice:${a.id}`) - hashText(`${item.id}:choice:${b.id}`));
}

    .replace(/\[[^\]]*[A-Za-z][^\]]*\]/g, '')
    .replace(/[（(][^）)]*[A-Za-z][^）)]*[）)]/g, '')
    .replace(/(?:vi|vt|adj|adv|prep|n|v|abbr)\./gi, '');
  return stripped
    .split(/[;；,，、/]|或|和/)
    .map(normalizeAnswer)
    .filter(x => x.length >= 2);
}

function isCorrect(input, answer) {
  const typed = normalizeAnswer(input);
  if (!typed) return false;
  const target = normalizeAnswer(answer);
  if (!target) return false;
  if (typed === target) return true;
  if (typed.length >= 2 && target.includes(typed)) return true;
  return answerSegments(answer).some(seg => typed.includes(seg) || (typed.length >= 2 && seg.includes(typed)));
}

function unitsForBook(book) {
  return META.unitsByBook[book] || [];
}

function scopeItems() {
  if (state.reviewItems) return state.reviewItems;
  let items = VOCAB.filter(item => item.book === state.book);
  if (state.unit !== 'all') items = items.filter(item => item.unit === Number(state.unit));
  return state.order === 'shuffle' ? shuffle(items) : [...items];
}

function renderTabs() {
  $('#bookTabs').innerHTML = META.bookOrder.map(book => `
    <button class="tab ${book === state.book ? 'active' : ''}" data-book="${escapeHtml(book)}" type="button">${escapeHtml(META.bookLabels[book] || book)}</button>
  `).join('');
  document.querySelectorAll('[data-book]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.book = btn.dataset.book;
      state.unit = unitsForBook(state.book)[0] || 'all';
      state.reviewItems = null;
      state.submitted = false;
      state.lastWrong = [];
      render();
    });
  });

  const units = unitsForBook(state.book);
  $('#unitTabs').innerHTML = [
    `<button class="chip ${state.unit === 'all' ? 'active' : ''}" data-unit="all" type="button">全册</button>`,
    ...units.map(unit => `<button class="chip ${Number(state.unit) === unit ? 'active' : ''}" data-unit="${unit}" type="button">Unit ${unit}</button>`)
  ].join('');
  document.querySelectorAll('[data-unit]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.unit = btn.dataset.unit === 'all' ? 'all' : Number(btn.dataset.unit);
      state.reviewItems = null;
      state.submitted = false;
      state.lastWrong = [];
      render();
    });
  });
}

function currentScopeName() {
  if (state.reviewItems) return '错词重练';
  const label = META.bookLabels[state.book] || state.book;
  return state.unit === 'all' ? `${label} 全册` : `${label} Unit ${state.unit}`;
}

function renderRows(items) {
  $('#rows').innerHTML = items.map((item, index) => `
    <div class="wordRow" data-id="${item.id}">
      <div class="num">${index + 1}</div>
      <div class="wordMain">
        <span class="word">${escapeHtml(item.word)}</span>
        <span class="phonetic">${escapeHtml(item.phonetic || '')}</span>
      </div>
      <div class="choiceGroup" data-choice-group="${item.id}">
        ${buildChoices(item).map(choice => `
          <button class="choiceBtn" data-choice="${item.id}" data-choice-id="${choice.id}" data-answer="${escapeHtml(choice.answer)}" type="button" aria-pressed="false">
            ${escapeHtml(cleanForDisplay(choice.answer))}
          </button>
        `).join('')}
      </div>
      <div class="rowActions">
        <button class="unknownBtn" data-unknown="${item.id}" type="button">不认识</button>
      </div>
      <div class="rowResult" data-result="${item.id}"></div>
    </div>
  `).join('');

  document.querySelectorAll('[data-unknown]').forEach(btn => {
    btn.addEventListener('click', () => {
      btn.classList.toggle('active');
      btn.textContent = btn.classList.contains('active') ? '已标记' : '不认识';
      if (btn.classList.contains('active')) {
        document.querySelectorAll(`[data-choice="${btn.dataset.unknown}"]`).forEach(choice => {
          choice.classList.remove('active');
          choice.setAttribute('aria-pressed', 'false');
        });
      }
      updateStats();
    });
  });

  document.querySelectorAll('[data-choice]').forEach(choice => {
    choice.addEventListener('click', () => {
      const id = choice.dataset.choice;
      document.querySelectorAll(`[data-choice="${id}"]`).forEach(btn => {
        btn.classList.toggle('active', btn === choice);
        btn.setAttribute('aria-pressed', btn === choice ? 'true' : 'false');
      });
      const unknown = document.querySelector(`[data-unknown="${id}"]`);
      unknown.classList.remove('active');
      unknown.textContent = '不认识';
      updateStats();
    });
  });
}

function updateStats() {
  const items = scopeItems();
  const answeredIds = new Set([...document.querySelectorAll('[data-choice].active')].map(btn => btn.dataset.choice));
  const unknown = [...document.querySelectorAll('[data-unknown]')].filter(btn => btn.classList.contains('active')).length;
  $('#scopeStat').textContent = currentScopeName();
  $('#questionStat').textContent = items.length;
  $('#filledStat').textContent = answeredIds.size;
  $('#unknownStat').textContent = unknown;
}

function render() {
  renderTabs();
  const items = scopeItems();
  $('#sourceCount').textContent = META.sourceTotal;
  $('#totalCount').textContent = META.includedTotal;
  $('#excludedCount').textContent = META.excludedTotal;
  $('#boardTitle').textContent = currentScopeName();
  $('#boardMeta').textContent = state.reviewItems ? '来自上一次提交的错误词汇和“不认识”词汇' : `${META.countsByBook[state.book] || 0} 个本册词条`;
  $('#countPill').textContent = `${items.length} 题`;
  $('#resultBox').classList.remove('open');
  $('#board').classList.remove('submitted');
  renderRows(items);
  updateStats();
}

function collectResults() {
  const items = scopeItems();
  let correct = 0;
  const wrong = [];
  items.forEach(item => {
    const row = document.querySelector(`[data-id="${item.id}"]`);
    const selected = row.querySelector('.choiceBtn.active');
    const unknown = document.querySelector(`[data-unknown="${item.id}"]`).classList.contains('active');
    const given = selected ? selected.dataset.answer : '';
    const ok = !unknown && selected && given === item.answer;
    row.classList.toggle('correct', ok);
    row.classList.toggle('wrong', !ok);
    row.querySelectorAll('.choiceBtn').forEach(btn => {
      if (btn.dataset.answer === item.answer) btn.classList.add('correctChoice');
      if (selected && btn === selected && !ok) btn.classList.add('wrongChoice');
      btn.disabled = true;
    });
    document.querySelector(`[data-unknown="${item.id}"]`).disabled = true;
    const result = document.querySelector(`[data-result="${item.id}"]`);
    result.innerHTML = ok
      ? `<span class="standard">标准答案：${escapeHtml(cleanForDisplay(item.answer))}</span>`
      : `<span class="badText">${unknown ? '不认识' : '需订正'}</span> · 你的答案：${escapeHtml(unknown ? '不认识' : (cleanForDisplay(given) || '（未选）'))}<br><span class="standard">标准答案：${escapeHtml(cleanForDisplay(item.answer))}</span>`;
    if (ok) correct += 1;
    else wrong.push({...item, given, unknown});
  });
  state.lastWrong = wrong;
  return {total: items.length, correct, wrong};
}

function submitQuiz() {
  const result = collectResults();
  $('#board').classList.add('submitted');
  $('#resultBox').classList.add('open');
  const unknownCount = result.wrong.filter(item => item.unknown).length;
  $('#resultTitle').textContent = result.wrong.length ? '错误词汇汇总' : '全部正确';
  $('#resultMeta').textContent = `正确 ${result.correct}/${result.total} · 错误 ${result.wrong.length - unknownCount} · 不认识 ${unknownCount}`;
  $('#practiceWrongBtn').disabled = !result.wrong.length;
  $('#copyWrongBtn').disabled = !result.wrong.length;
  $('#downloadWrongBtn').disabled = !result.wrong.length;
  $('#wrongList').innerHTML = result.wrong.length ? result.wrong.map(item => `
    <div class="wrongItem">
      <div><strong>${escapeHtml(item.word)}</strong><small>${escapeHtml(item.phonetic || '')}</small></div>
      <span>你的答案：${escapeHtml(item.unknown ? '不认识' : (cleanForDisplay(item.given) || '（未选）'))}</span>
      <span>标准答案：${escapeHtml(cleanForDisplay(item.answer))}</span>
    </div>
  `).join('') : '<div class="empty">本次没有错词。</div>';
  $('#resultBox').scrollIntoView({behavior:'smooth', block:'start'});
}

function resetCurrent() {
  state.reviewItems = null;
  state.submitted = false;
  state.lastWrong = [];
  render();
}

async function copyWrong() {
  if (!state.lastWrong.length) return;
  const button = $('#copyWrongBtn');
  const text = state.lastWrong.map(item => `${item.word}\t${cleanForDisplay(item.answer)}\t${item.unknown ? '不认识' : cleanForDisplay(item.given) || '未选'}`).join('\n');
  button.disabled = true;
  button.textContent = '复制中…';
  try {
    if (!navigator.clipboard?.writeText) throw new Error('Clipboard API unavailable');
    await navigator.clipboard.writeText(text);
    button.textContent = '已复制';
  } catch (error) {
    console.error('复制错词失败', error);
    button.textContent = '复制失败';
    window.alert('复制失败：当前浏览器不支持剪贴板写入，或未授予权限。请使用“下载错词清单”保存。');
  } finally {
    window.setTimeout(() => {
      button.textContent = '复制错词';
      button.disabled = !state.lastWrong.length;
    }, 1600);
  }
}

function csvCell(value) {
  const text = String(value ?? '').replace(/"/g, '""');
  return `"${text}"`;
}

function downloadWrongList() {
  if (!state.lastWrong.length) return;
  const header = ['书册', '单元', '英文', '音标', '你的答案', '标准答案', '状态'];
  const rows = state.lastWrong.map(item => [
    item.bookLabel || item.book,
    `Unit ${item.unit}`,
    item.word,
    item.phonetic || '',
    item.unknown ? '不认识' : (cleanForDisplay(item.given) || '未选'),
    cleanForDisplay(item.answer),
    item.unknown ? '不认识' : '错选'
  ]);
  const csv = [header, ...rows].map(row => row.map(csvCell).join(',')).join('\n');
  const blob = new Blob(['\ufeff' + csv], {type: 'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement('a');
  const scope = currentScopeName().replace(/[\\/:*?"<>|\s]+/g, '-');
  const date = new Date().toISOString().slice(0, 10);
  anchor.href = url;
  anchor.download = `错词清单-${scope}-${date}.csv`;
  document.body.appendChild(anchor);
  anchor.click();
  anchor.remove();
  URL.revokeObjectURL(url);
}

$('#orderSelect').addEventListener('change', event => {
  state.order = event.target.value;
  state.reviewItems = null;
  state.submitted = false;
  render();
});
$('#submitTopBtn').addEventListener('click', submitQuiz);
$('#resetBtn').addEventListener('click', resetCurrent);
$('#practiceWrongBtn').addEventListener('click', () => {
  if (!state.lastWrong.length) return;
  state.reviewItems = state.lastWrong.map(item => VOCAB.find(row => row.id === item.id)).filter(Boolean);
  state.submitted = false;
  render();
});
$('#copyWrongBtn').addEventListener('click', copyWrong);
$('#downloadWrongBtn').addEventListener('click', downloadWrongList);

render();
</script>
</body>
</html>
