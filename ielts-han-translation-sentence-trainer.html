  <script>
    const V=`analyse|分析;assess|评估;indicate|表明;suggest|表明；暗示;demonstrate|证明；展示;illustrate|阐明；说明;reveal|揭示;examine|审视；研究;evaluate|评价;interpret|解读;compare|比较;contrast|对比;identify|识别;clarify|澄清;emphasise|强调;maintain|维持；主张;establish|建立;implement|实施;facilitate|促进；使便利;promote|促进;enhance|提升;reduce|减少;mitigate|缓解;address|处理；解决;tackle|处理；应对;allocate|分配;regulate|监管;restrict|限制;justify|证明合理;influence|影响;affect|影响;contribute|贡献；导致;determine|决定;generate|产生;require|需要;involve|涉及;depend|依赖;vary|变化;adapt|适应;emerge|出现;expand|扩大;decline|下降;improve|改善;strengthen|加强;weaken|削弱;prevent|防止;protect|保护;preserve|保护；保存;consequence|后果;implication|影响；含义;impact|影响;factor|因素;approach|方法;strategy|策略;policy|政策;measure|措施;evidence|证据;trend|趋势;pattern|模式;phenomenon|现象;issue|问题;challenge|挑战;benefit|好处;drawback|缺点;advantage|优势;disadvantage|劣势;priority|优先事项;responsibility|责任;awareness|意识;access|获取机会;inequality|不平等;opportunity|机会;efficiency|效率;productivity|生产力;innovation|创新;development|发展;sustainability|可持续性;consumption|消费;resource|资源;community|社区;essential|必要的;significant|重要的;considerable|相当大的;substantial|大量的;beneficial|有益的;harmful|有害的;effective|有效的;efficient|高效的;practical|实际的;feasible|可行的;complex|复杂的;controversial|有争议的;inevitable|不可避免的;widespread|广泛的;long-term|长期的;short-term|短期的;economic|经济的;social|社会的;environmental|环境的;technological|技术的`;
    const C=`play a crucial role in|在……中起关键作用;have a significant impact on|对……有重大影响;pose a serious threat to|对……构成严重威胁;address this issue|解决这个问题;tackle the problem of|处理……问题;raise public awareness|提高公众意识;improve living standards|提高生活水平;enhance social stability|增强社会稳定;promote economic growth|促进经济增长;stimulate innovation|激发创新;reduce social inequality|减少社会不平等;widen the gap between A and B|扩大 A 和 B 之间的差距;narrow the wealth gap|缩小贫富差距;provide equal opportunities|提供平等机会;gain access to education|获得教育机会;meet basic needs|满足基本需求;protect the environment|保护环境;preserve natural resources|保护自然资源;reduce carbon emissions|减少碳排放;combat climate change|应对气候变化;adopt sustainable practices|采取可持续做法;depend heavily on|严重依赖;be closely linked to|与……密切相关;be largely responsible for|对……负主要责任;be beneficial to|对……有益;be harmful to|对……有害;be vulnerable to|容易受到……影响;be exposed to|暴露于……;impose restrictions on|对……施加限制;introduce stricter regulations|引入更严格的监管;allocate more funding to|给……分配更多资金;invest heavily in|大量投资于;encourage active participation|鼓励积极参与;develop critical thinking|培养批判性思维;acquire practical skills|获得实用技能;improve job prospects|改善就业前景;achieve work-life balance|实现工作与生活平衡;place pressure on|给……施加压力;ease the burden on|减轻……的负担;cause irreversible damage|造成不可逆的损害;lead to unintended consequences|导致意想不到的后果;bring about positive changes|带来积极变化;have far-reaching consequences|产生深远影响;create a sense of community|创造社区归属感;strengthen family bonds|加强家庭纽带;respect cultural diversity|尊重文化多样性;preserve cultural heritage|保护文化遗产;keep pace with technological change|跟上技术变化;make informed decisions|做出明智决定;strike a balance between A and B|在 A 和 B 之间取得平衡`;
    const A=[...V.split(";").map((x,i)=>{let[a,b]=x.split("|");return{id:"v"+i,type:"vocab",tag:"核心词汇",en:a,zh:b}}),...C.split(";").map((x,i)=>{let[a,b]=x.split("|");return{id:"c"+i,type:"collocation",tag:"写作搭配",en:a,zh:b}})];
    const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
    let filter="all",index=0,records=JSON.parse(localStorage.getItem("ah-sentence-records")||"[]");
    const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    const pool=()=>filter==="all"?A:A.filter(x=>x.type===filter);
    const current=()=>{let p=pool();index=((index%p.length)+p.length)%p.length;return p[index]};
    function hasTarget(item,answer){let text=answer.toLowerCase().replace(/[.,!?;:]/g," ").replace(/\s+/g," ").trim();if(item.type==="collocation")return text.includes(item.en.toLowerCase().replace(/\ba and b\b/g,"").trim());if(item.en.includes("-"))return text.includes(item.en.toLowerCase());return new RegExp("\\b"+item.en+"(s|ed|ing)?\\b","i").test(answer)}
    function sample(item){if(item.type==="collocation")return `Social progress can ${item.en.replace("A and B","economic growth and environmental protection")} when people make careful long-term decisions.`;let n=+item.id.slice(1);if(n>=80)return `This is a ${item.en} issue because it affects many people in the long term.`;if(n>=48)return `This ${item.en} can influence how governments design modern policies.`;return `Governments should ${item.en} this issue carefully before introducing new policies.`}
    function revise(answer,item){let r=answer.trim().replace(/[。]/g,".").replace(/[，]/g,",").replace(/[？]/g,"?").replace(/[！]/g,"!").replace(/\s+/g," ").replace(/\bi\b/g,"I").replace(/\bpeople is\b/gi,"people are").replace(/\bpeople has\b/gi,"people have").replace(/\bcan to\b/gi,"can").replace(/\bmore better\b/gi,"better").replace(/\binformations\b/gi,"information").replace(/\badvices\b/gi,"advice").replace(/\bequipments\b/gi,"equipment").replace(/\bchildrens\b/gi,"children");if(r){r=r[0].toUpperCase()+r.slice(1);if(!/[.!?]$/.test(r))r+="."}return hasTarget(item,r)?r:sample(item)}
    function score(answer,item){let words=answer.match(/[A-Za-z]+(?:[-'][A-Za-z]+)?/g)||[],target=hasTarget(item,answer),cn=/[\u4e00-\u9fff]/.test(answer),up=/^[A-Z]/.test(answer.trim()),pun=/[.!?]$/.test(answer.trim()),sv=/\b(i|we|they|people|students|governments?|society|technology|education|parents|schools)\b/i.test(answer)&&/\b(is|are|can|should|will|has|have|make|makes|reduce|improve|promote|provide|help|lead|affect|influence)\b/i.test(answer),con=/\b(because|although|while|which|that|therefore|however|such as|in order to)\b/i.test(answer),topic=/\b(education|technology|environment|society|government|students|children|policy|people|culture|health|work)\b/i.test(answer);
      let rubric=[["目标表达",target?35:10,35],["句子长度",words.length>=12?20:words.length>=8?16:words.length>=5?9:3,20],["基本语法",sv?15:6,15],["大小写标点",(up?4:0)+(pun?4:0)+(!cn?4:0),12],["雅思句式",(con?10:2)+(topic?8:2),18]],total=Math.min(100,rubric.reduce((s,r)=>s+r[1],0)),tips=[];if(!target)tips.push("需要准确使用目标表达："+item.en);if(words.length<8)tips.push("句子偏短，建议补充原因、结果或具体对象。");if(!sv)tips.push("主语和谓语需要更清楚。");if(!up||!pun)tips.push("注意句首大写和句末标点。");if(cn)tips.push("英文句子里不要保留中文字符。");if(!con)tips.push("可以加入 because / although / which 等连接词。");if(!tips.length)tips.push("表达完整，目标词使用清楚，可以挑战更复杂的句式。");return{total,band:total>=90?"Band 8.5-9":total>=80?"Band 7.5-8":total>=70?"Band 6.5-7":total>=60?"Band 6":"Band 5 左右",rubric,tips,revision:revise(answer,item),sample:sample(item),words:words.length}}
    function render(){let item=current();$("#range").textContent=pool().length;$("#done").textContent=records.length;$("#avg").textContent=records.length?Math.round(records.reduce((s,r)=>s+r.total,0)/records.length):0;$("#task").innerHTML=`<span class="tag">${item.tag}</span><div class="zh">${esc(item.zh)}</div><div class="target">必须使用：${esc(item.en)}</div><textarea id="answer" placeholder="写一个完整英文句子，例如：Governments should ..."></textarea><div class="toolbar"><button class="btn" id="check">提交评分</button><button class="btn ghost" id="example">看示范句</button><button class="btn orange" id="next">下一题</button><button class="btn ghost" id="random">随机题</button></div><p class="muted">建议写 8-18 个英文单词，并加入 because / although / which 等连接词。</p>`;$("#report").innerHTML=`<h2>截图成绩卡</h2><p class="muted">提交后这里会显示分数、修改版本和改进建议。</p><div class="rubric"><div><span>目标表达</span><b>35</b></div><div><span>句子长度</span><b>20</b></div><div><span>基本语法</span><b>15</b></div><div><span>大小写标点</span><b>12</b></div><div><span>雅思句式</span><b>18</b></div></div>`}
    function showReport(answer,item,result){records.push({total:result.total,date:Date.now()});localStorage.setItem("ah-sentence-records",JSON.stringify(records.slice(-80)));$("#done").textContent=records.length;$("#avg").textContent=Math.round(records.reduce((s,r)=>s+r.total,0)/records.length);$("#report").innerHTML=`<span class="tag">AlexHan Studio 造句成绩卡</span><div class="score">${result.total}</div><span class="badge">${result.band}</span><div class="rubric">${result.rubric.map(r=>`<div><span>${r[0]}</span><b>${r[1]} / ${r[2]}</b></div>`).join("")}</div><h3>学生原句</h3><p class="rev">${esc(answer)}</p><h3>参考修改</h3><p class="rev">${esc(result.revision)}</p><h3>高分示范</h3><p class="rev">${esc(result.sample)}</p><h3>改进建议</h3><ul class="tips">${result.tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul><p class="muted">目标表达：${esc(item.en)} · ${new Date().toLocaleString()}</p>`}
    document.onclick=e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.filter){filter=b.dataset.filter;index=0;$$(".tab").forEach(x=>x.classList.toggle("on",x===b));render()}if(b.id==="check"){let item=current(),answer=$("#answer").value;if(!answer.trim()){alert("请先写一个英文句子。");return}showReport(answer.trim(),item,score(answer,item))}if(b.id==="example")$("#answer").value=sample(current());if(b.id==="next"){index++;render()}if(b.id==="random"){index=Math.floor(Math.random()*pool().length);render()}};
    render();
  </script>
