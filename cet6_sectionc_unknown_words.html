<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CET6 Section C 点词生词本</title><meta name="description" content="大学英语六级阅读 Section C 英文句子点词生词本，支持点击记录不认识单词并下载。"><style>
:root{color-scheme:light;--ink:#1d1d1f;--muted:#6e6e73;--soft:#f5f5f7;--paper:#fbfbfd;--white:#fff;--line:rgba(0,0,0,.1);--line2:rgba(0,0,0,.07);--blue:#0071e3;--green:#147a5f;--orange:#f26a21;--red:#c7364f;--nav:58px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;color:var(--ink);background:linear-gradient(180deg,#fbfbfd 0,#f5f5f7 44%,#fff 100%);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;-webkit-font-smoothing:antialiased}button,input,select{font:inherit}button{cursor:pointer}.topbar{position:sticky;top:0;z-index:20;min-height:var(--nav);border-bottom:1px solid var(--line2);background:rgba(251,251,253,.78);backdrop-filter:blur(22px) saturate(180%)}.topbar-inner{width:min(1240px,calc(100% - 32px));min-height:var(--nav);margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{min-width:0}.brand strong{display:block;font-size:15px;line-height:1.2}.brand span{display:block;margin-top:3px;color:var(--muted);font-size:12px}.top-actions{display:flex;align-items:center;gap:10px}.layout{width:min(1240px,calc(100% - 32px));margin:0 auto;padding:30px 0 64px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}.main{min-width:0}.hero{padding:28px;border:1px solid var(--line2);border-radius:8px;background:#fff}h1{margin:0;font-size:42px;line-height:1.08;letter-spacing:0}.subhead{margin:14px 0 0;color:var(--muted);font-size:17px;line-height:1.55}.stats{margin-top:24px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;overflow:hidden;border:1px solid var(--line2);border-radius:8px;background:var(--line2)}.stat{min-height:96px;padding:16px;background:#fbfbfd}.stat strong{display:block;font-size:28px;line-height:1}.stat span{display:block;margin-top:10px;color:var(--muted);font-size:12px;line-height:1.4}.controls{margin-top:18px;padding:16px;border:1px solid var(--line2);border-radius:8px;background:#fff;display:grid;grid-template-columns:minmax(0,1fr) 180px 160px;gap:12px;align-items:center}.input,.select{width:100%;min-height:42px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);outline:0}.input{padding:0 14px}.select{padding:0 12px}.toggle{min-height:42px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-weight:650}.toggle.is-active{border-color:rgba(0,113,227,.35);background:rgba(0,113,227,.08);color:var(--blue)}.sentence-list{margin-top:18px;display:grid;gap:12px}.sentence-card{border:1px solid var(--line2);border-radius:8px;background:#fff;overflow:hidden}.sentence-meta{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line2);color:var(--muted);font-size:12px}.sentence-kind{min-height:24px;padding:3px 8px;border-radius:999px;display:inline-flex;align-items:center;color:#fff;background:var(--blue);font-weight:700;white-space:nowrap}.sentence-kind.answer{background:var(--green)}.question-line{margin:0;padding:12px 16px 0;color:var(--muted);font-size:13px;line-height:1.5}.sentence-text{margin:0;padding:16px;font-family:Georgia,"Times New Roman","Songti SC",serif;font-size:22px;line-height:1.78}.word{display:inline;border:0;border-radius:4px;padding:1px 2px;color:inherit;background:transparent;font-family:inherit;font-size:inherit;line-height:inherit;vertical-align:baseline;transition:background .12s ease,color .12s ease}.word:hover{background:rgba(0,113,227,.1);color:var(--blue)}.word.is-unknown{background:rgba(242,106,33,.16);color:#9b3d0b}.empty{padding:36px;border:1px solid var(--line2);border-radius:8px;background:#fff;color:var(--muted);text-align:center}.side{position:sticky;top:calc(var(--nav) + 18px);display:grid;gap:14px}.panel{border:1px solid var(--line2);border-radius:8px;background:#fff;overflow:hidden}.panel-head{padding:16px;border-bottom:1px solid var(--line2);display:flex;align-items:center;justify-content:space-between;gap:10px}.panel-head h2{margin:0;font-size:18px;line-height:1.2}.count-pill{min-width:34px;height:28px;padding:0 9px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;color:#fff;background:var(--orange);font-size:13px;font-weight:760}.unknown-list{max-height:420px;overflow:auto;padding:10px;display:grid;gap:8px}.unknown-item{min-height:44px;padding:8px 10px;border:1px solid var(--line2);border-radius:8px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fbfbfd}.unknown-word{min-width:0}.unknown-word strong{display:block;font-size:15px;line-height:1.2;word-break:break-word}.unknown-word span{display:block;margin-top:3px;color:var(--muted);font-size:11px}.remove-word{width:28px;height:28px;flex:0 0 auto;border:0;border-radius:50%;color:var(--muted);background:#fff}.remove-word:hover{color:var(--red)}.download-grid{padding:12px;display:grid;gap:10px}.btn{min-height:42px;border:0;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:#fff;background:var(--blue);font-weight:720}.btn.secondary{color:var(--ink);background:var(--soft)}.btn.danger{color:var(--red);background:rgba(199,54,79,.08)}.btn:disabled{opacity:.48;cursor:not-allowed}.source-note{padding:14px 16px;color:var(--muted);font-size:12px;line-height:1.5}@media(max-width:980px){.layout{grid-template-columns:1fr}.side{position:static;grid-template-columns:1fr}}@media(max-width:720px){.topbar-inner{width:min(100% - 24px,1240px)}.top-actions{display:none}.layout{width:min(100% - 24px,1240px);padding-top:18px}h1{font-size:30px}.hero{padding:20px}.stats,.controls{grid-template-columns:1fr}.sentence-text{font-size:20px;line-height:1.72}.sentence-meta{align-items:flex-start;flex-direction:column}}
</style></head><body><header class="topbar"><div class="topbar-inner"><div class="brand"><strong>CET6 Section C 点词生词本</strong><span>2021.6-2025.6 阅读答案句</span></div><div class="top-actions"><button class="btn secondary" type="button" id="scrollWords">生词本</button><button class="btn" type="button" id="downloadTop">下载 TXT</button></div></div></header><div class="layout"><main class="main"><section class="hero" aria-label="文档信息"><h1>每句英文都可以点词记录。</h1><p class="subhead">来源：CET6_2021-2025_阅读SectionC_答案句浏览版.docx。页面数据已内置，记录会保存在当前浏览器。</p><div class="stats" aria-label="统计"><div class="stat"><strong id="paperCount">...</strong><span>套 / 组</span></div><div class="stat"><strong id="questionCount">...</strong><span>题号记录</span></div><div class="stat"><strong id="sentenceCount">...</strong><span>英文句子</span></div><div class="stat"><strong id="visibleCount">...</strong><span>当前显示</span></div></div></section><section class="controls" aria-label="筛选"><input class="input" id="searchInput" type="search" placeholder="搜索年份、题号或句子"><select class="select" id="paperFilter" aria-label="选择套卷"><option value="">全部套卷</option></select><button class="toggle" type="button" id="unknownOnly">含生词句</button></section><section class="sentence-list" id="sentenceList" aria-label="英文句子列表"><div class="empty">正在载入句子...</div></section></main><aside class="side" id="wordPanel"><section class="panel" aria-label="生词本"><div class="panel-head"><h2>生词本</h2><span class="count-pill" id="unknownCount">0</span></div><div class="unknown-list" id="unknownList"></div><div class="download-grid"><button class="btn" type="button" id="downloadTxt">下载 TXT</button><button class="btn secondary" type="button" id="downloadCsv">下载 CSV</button><button class="btn danger" type="button" id="clearWords">清空</button></div></section><section class="panel"><div class="source-note" id="sourceNote">文档：CET6_2021-2025_阅读SectionC_答案句浏览版.docx</div></section></aside></div><script>const DATA_FILES=["cet6_sectionc_unknown_words_data_00.txt", "cet6_sectionc_unknown_words_data_01.txt", "cet6_sectionc_unknown_words_data_02.txt", "cet6_sectionc_unknown_words_data_03.txt", "cet6_sectionc_unknown_words_data_04.txt", "cet6_sectionc_unknown_words_data_05.txt", "cet6_sectionc_unknown_words_data_06.txt", "cet6_sectionc_unknown_words_data_07.txt", "cet6_sectionc_unknown_words_data_08.txt"];
async function loadPayload(){if(!('DecompressionStream'in window))throw new Error('当前浏览器不支持数据解压，请使用新版 Chrome、Edge 或 Safari。');const parts=[];for(const file of DATA_FILES){const res=await fetch(file);if(!res.ok)throw new Error('数据文件载入失败：'+file);parts.push((await res.text()).trim())}const bin=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const stream=new Blob([bin]).stream().pipeThrough(ds);return JSON.parse(await new Response(stream).text())}
let payload,records=[],showUnknownOnly=false,unknowns={};const storageKey='cet6-section-c-unknown-words-v1',wordPattern=/[A-Za-z]+(?:['’-][A-Za-z]+)*/g,byId=id=>document.getElementById(id),sentenceList=byId('sentenceList'),searchInput=byId('searchInput'),paperFilter=byId('paperFilter'),unknownOnly=byId('unknownOnly'),unknownList=byId('unknownList'),unknownCount=byId('unknownCount'),visibleCount=byId('visibleCount'),downloadTop=byId('downloadTop'),downloadTxt=byId('downloadTxt'),downloadCsv=byId('downloadCsv'),clearWords=byId('clearWords');
function loadUnknowns(){try{return JSON.parse(localStorage.getItem(storageKey)||'{}')}catch{return {}}}function saveUnknowns(){localStorage.setItem(storageKey,JSON.stringify(unknowns))}function normalizeWord(w){return w.toLowerCase().replace(/[’‘]/g,"'").replace(/^[^a-z]+|[^a-z]+$/g,'')}function escapeHtml(v){return String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}function escapeAttr(v){return escapeHtml(v).replaceAll('`','&#096;')}function sourceText(r){return[r.paper,r.passage,r.questionNo?`Q${r.questionNo}`:'',r.kind].filter(Boolean).join(' · ')}
function renderSentenceText(text){let out='',last=0;for(const m of text.matchAll(wordPattern)){const word=m[0],i=m.index,norm=normalizeWord(word);out+=escapeHtml(text.slice(last,i));out+=norm?`<button class="word${unknowns[norm]?' is-unknown':''}" type="button" data-norm="${escapeAttr(norm)}" data-word="${escapeAttr(word)}">${escapeHtml(word)}</button>`:escapeHtml(word);last=i+word.length}return out+escapeHtml(text.slice(last))}function recordHasUnknown(r){for(const m of r.text.matchAll(wordPattern))if(unknowns[normalizeWord(m[0])])return true;return false}
function filteredRecords(){const q=searchInput.value.trim().toLowerCase(),paper=paperFilter.value;return records.filter(r=>{if(paper&&r.paper!==paper)return false;if(showUnknownOnly&&!recordHasUnknown(r))return false;if(!q)return true;return`${r.paper} ${r.passage} Q${r.questionNo} ${r.kind} ${r.question} ${r.text}`.toLowerCase().includes(q)})}
function renderSentences(){const list=filteredRecords();visibleCount.textContent=list.length;if(!list.length){sentenceList.innerHTML='<div class="empty">没有匹配的句子。</div>';return}const frag=document.createDocumentFragment();for(const r of list){const card=document.createElement('article');card.className='sentence-card';card.dataset.id=r.id;card.innerHTML=`<div class="sentence-meta"><span>${escapeHtml(sourceText(r))}</span><span class="sentence-kind${r.kind==='答案句'?' answer':''}">${escapeHtml(r.kind)}</span></div>${r.kind==='答案句'&&r.question?`<p class="question-line">题干：${escapeHtml(r.question)}</p>`:''}<p class="sentence-text">${renderSentenceText(r.text)}</p>`;frag.appendChild(card)}sentenceList.replaceChildren(frag)}
function sortedUnknownEntries(){return Object.entries(unknowns).sort((a,b)=>a[0].localeCompare(b[0]))}function renderUnknowns(){const entries=sortedUnknownEntries();unknownCount.textContent=entries.length;downloadTxt.disabled=downloadCsv.disabled=downloadTop.disabled=clearWords.disabled=entries.length===0;if(!entries.length){unknownList.innerHTML='<div class="empty">暂无生词。</div>';return}unknownList.innerHTML=entries.map(([norm,item])=>`<div class="unknown-item"><div class="unknown-word"><strong>${escapeHtml(item.display||norm)}</strong><span>${escapeHtml((item.contexts||[]).length?`${(item.contexts||[]).length} 个记录`:'已记录')}</span></div><button class="remove-word" type="button" data-remove="${escapeAttr(norm)}" aria-label="移除 ${escapeAttr(norm)}">×</button></div>`).join('')}
function addUnknown(norm,display,r){unknowns[norm]=unknowns[norm]||{display,contexts:[]};const c=unknowns[norm].contexts||[];if(!c.some(x=>x.id===r.id))c.push({id:r.id,source:sourceText(r),sentence:r.text});unknowns[norm].contexts=c}function toggleUnknown(norm,display,r){if(unknowns[norm])delete unknowns[norm];else addUnknown(norm,display,r);saveUnknowns();renderUnknowns();renderSentences()}function download(filename,text,type){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}function txtContent(){const words=sortedUnknownEntries().map(([,item])=>item.display);return words.join('\\n')+(words.length?'\\n':'')}function csvEscape(v){const t=String(v??'');return`"${t.replaceAll('"','""')}"`}function csvContent(){const rows=[['word','records','first_source','sample_sentence']];for(const[,item]of sortedUnknownEntries()){const c=item.contexts||[];rows.push([item.display||'',c.length,c[0]?.source||'',c[0]?.sentence||''])}return rows.map(r=>r.map(csvEscape).join(',')).join('\\n')+'\\n'}function setupPaperFilter(){const papers=[...new Set(records.map(r=>r.paper).filter(Boolean))];paperFilter.insertAdjacentHTML('beforeend',papers.map(p=>`<option value="${escapeAttr(p)}">${escapeHtml(p)}</option>`).join(''))}
sentenceList.addEventListener('click',e=>{const w=e.target.closest('.word');if(!w)return;const card=w.closest('.sentence-card'),r=records.find(x=>String(x.id)===card.dataset.id);if(r)toggleUnknown(w.dataset.norm,w.dataset.word,r)});unknownList.addEventListener('click',e=>{const b=e.target.closest('[data-remove]');if(!b)return;delete unknowns[b.dataset.remove];saveUnknowns();renderUnknowns();renderSentences()});searchInput.addEventListener('input',renderSentences);paperFilter.addEventListener('change',renderSentences);unknownOnly.addEventListener('click',()=>{showUnknownOnly=!showUnknownOnly;unknownOnly.classList.toggle('is-active',showUnknownOnly);renderSentences()});downloadTxt.addEventListener('click',()=>download('cet6-section-c-unknown-words.txt',txtContent(),'text/plain;charset=utf-8'));downloadTop.addEventListener('click',()=>download('cet6-section-c-unknown-words.txt',txtContent(),'text/plain;charset=utf-8'));downloadCsv.addEventListener('click',()=>download('cet6-section-c-unknown-words.csv',csvContent(),'text/csv;charset=utf-8'));clearWords.addEventListener('click',()=>{unknowns={};saveUnknowns();renderUnknowns();renderSentences()});byId('scrollWords').addEventListener('click',()=>byId('wordPanel').scrollIntoView({behavior:'smooth',block:'start'}));
loadPayload().then(data=>{payload=data;records=payload.records;unknowns=loadUnknowns();byId('paperCount').textContent=payload.paperCount;byId('questionCount').textContent=payload.questionCount;byId('sentenceCount').textContent=payload.sentenceCount;byId('sourceNote').innerHTML=`文档：${escapeHtml(payload.sourceName)}<br>英文词数去重约 ${payload.uniqueWordCount} 个。`;setupPaperFilter();renderUnknowns();renderSentences()}).catch(err=>{sentenceList.innerHTML=`<div class="empty">载入失败：${escapeHtml(err.message)}</div>`});
</script></body></html>
