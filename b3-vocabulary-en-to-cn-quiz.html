function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}function pool(){return selectedUnit==='all'?TEST_VOCAB:TEST_VOCAB.filter(x=>x.unit===Number(selectedUnit))}function makeQueue(){if(autoNextTimer){clearTimeout(autoNextTimer);autoNextTimer=null}let list=[...pool()];if($('#orderMode').value==='shuffle')shuffle(list);const amount=$('#amountMode').value;if(amount!=='all')list=list.slice(0,Number(amount));queue=list;index=0;score=0;locked=false;mistakes=[];answered=[];renderQuiz();renderSide();renderVocab()}function posKey(item){const rawPos=String(item.pos||''),p=String(rawPos+' '+(item.cn||'')).toLowerCase();if(rawPos.includes('短语'))return 'phrase';const tags=[];if(p.includes('abbr'))tags.push('abbr');if(/adj\./.test(p))tags.push('adj');if(/adv\./.test(p)||/prep\./.test(p))tags.push('function');if(/(?:^|[^a-z])(vi|vt|v)\./.test(p))tags.push('v');if(/(?:^|[^a-z])n\./.test(p))tags.push('n');if(tags.includes('abbr')&&tags.length===1)return 'n';const content=[...new Set(tags.filter(t=>t!=='abbr'))];if(content.length>1)return 'mixed';if(tags.includes('v'))return 'v';if(tags.includes('adj'))return 'adj';if(tags.includes('function'))return 'function';if(tags.includes('n'))return 'n';return p||'other'}function primaryPos(item){return posKey(item)}function cleanCn(s){return String(s).replace(/\[[^\]]*[A-Za-z][^\]]*\]\s*/g,'').replace(/[（(][^）)]*[A-Za-z][^）)]*[）)]/g,'').replace(/(^|[；;，,、\s(（])(?:vi|vt|adj|adv|prep|n|v)\.(?:&(?:vi|vt|adj|adv|prep|n|v)\.)*/gi,'$1').replace(/[A-Za-z]+(?:[A-Za-z0-9 .,&'’\/-]*[A-Za-z0-9])?/g,'').replace(/[（(]\s*[;；,，、\/\-.&]*\s*[）)]/g,'').replace(/\s+/g,'').replace(/[；;，,、\s]+$/g,'').replace(/^[；;，,、\s]+/g,'').replace(/[;；]{2,}/g,'；').replace(/[，,、]{2,}/g,'，')}function addChoicePool(out,used,item,candidates){for(const x of shuffle([...candidates])){if(out.length>=3)break;if(x.term===item.term||used.has(x.cn))continue;used.add(x.cn);out.push(x)}}function buildChoices(item){const key=posKey(item),primary=primaryPos(item),used=new Set([item.cn]),others=[];addChoicePool(others,used,item,TEST_VOCAB.filter(x=>posKey(x)===key));if(others.length<3)addChoicePool(others,used,item,TEST_VOCAB.filter(x=>primaryPos(x)===primary));if(others.length<3)addChoicePool(others,used,item,TEST_VOCAB);return shuffle([{cn:item.cn,key},...others.slice(0,3).map(x=>({cn:x.cn,key:posKey(x)}))])}function renderFilters(){$('#unitFilters').innerHTML=['all',...UNITS].map(u=>`<button class="unit-btn ${String(selectedUnit)===String(u)?'active':''}" data-unit="${u}">${u==='all'?'全册':'Unit '+u}</button>`).join('');document.querySelectorAll('.unit-btn').forEach(b=>b.onclick=()=>{selectedUnit=b.dataset.unit;renderFilters();makeQueue()})}function renderQuiz(){if(autoNextTimer){clearTimeout(autoNextTimer);autoNextTimer=null}if(!queue.length){$('#quizPanel').innerHTML='<div class="feedback"><strong>没有词条。</strong></div>';return}if(index>=queue.length){renderResult();return}locked=false;const item=queue[index],choices=buildChoices(item);$('#quizPanel').innerHTML=`<div class="status"><div class="stat"><small>题号</small><strong>${index+1}/${queue.length}</strong></div><div class="stat"><small>正确</small><strong>${score}</strong></div><div class="stat"><small>错/不认</small><strong>${mistakes.length}</strong></div><div class="stat"><small>范围</small><strong>${selectedUnit==='all'?'全册':'U'+selectedUnit}</strong></div></div><div class="progress"><div class="bar" style="width:${index/queue.length*100}%"></div></div><div class="word-card"><span class="tag">Unit ${item.unit}</span><div class="word">${escapeHtml(item.term)}</div><div class="pos">${escapeHtml(item.pos)}</div></div><div class="choices">${choices.map(c=>`<button class="choice" data-answer="${escapeAttr(c.cn)}" data-pos="${escapeAttr(c.key)}">${escapeHtml(cleanCn(c.cn))}</button>`).join('')}</div><div class="feedback" id="feedback">选择中文释义，或点“不认识”。</div><div class="bottom-actions"><button class="btn warn" id="unknownBtn">不认识</button><button class="btn good" id="submitBtn">提交</button></div>`;document.querySelectorAll('.choice').forEach(btn=>btn.onclick=()=>choose(btn,item));$('#unknownBtn').onclick=()=>choose(null,item,'unknown');$('#submitBtn').onclick=submitQuiz}function choose(btn,item,mode='choice'){if(locked)return;locked=true;const picked=btn?btn.dataset.answer:null,ok=!!btn&&picked===item.cn;if(ok)score+=1;else mistakes.push(item);answered.push({...item,ok});const liveStats=document.querySelectorAll('.status .stat strong');if(liveStats[1])liveStats[1].textContent=score;if(liveStats[2])liveStats[2].textContent=mistakes.length;document.querySelectorAll('.choice').forEach(b=>{if(b.dataset.answer===item.cn)b.classList.add('correct');if(btn&&b===btn&&!ok)b.classList.add('wrong');b.disabled=true});const unknownBtn=$('#unknownBtn');if(unknownBtn)unknownBtn.disabled=true;const submitBtn=$('#submitBtn');if(submitBtn)submitBtn.disabled=true;$('#feedback').innerHTML=ok?`<strong>正确。</strong> ${escapeHtml(item.term)} = ${escapeHtml(cleanCn(item.cn))}`:mode==='unknown'?`<strong>已标记不认识。</strong> ${escapeHtml(item.term)} = ${escapeHtml(cleanCn(item.cn))}`:`<strong>再看一下。</strong> ${escapeHtml(item.term)} = ${escapeHtml(cleanCn(item.cn))}`;renderSide();autoNextTimer=setTimeout(next,900)}function next(){index+=1;renderQuiz();renderSide()}function submitQuiz(){if(autoNextTimer){clearTimeout(autoNextTimer);autoNextTimer=null}index=queue.length;renderResult();renderSide()}function uniqueMistakes(){const seen=new Set();return mistakes.filter(x=>{const k=x.term+'|'+x.cn;if(seen.has(k))return false;seen.add(k);return true})}function downloadMistakes(){const list=uniqueMistakes();if(!list.length)return;const rows=['必修三词汇错题/不认识','导出时间：'+new Date().toLocaleString(),'','序号	单元	英文	中文'];list.forEach((x,i)=>rows.push(`${i+1}	Unit ${x.unit}	${x.term}	${cleanCn(x.cn)}`));const blob=new Blob(['\ufeff'+rows.join('\n')],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='必修三错题词汇.txt';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}function renderResult(){const done=answered.length,pct=done?Math.round(score/done*100):0,miss=uniqueMistakes();$('#quizPanel').innerHTML=`<div class="result"><span class="tag">完成</span><div class="big-score"><div><strong>${score}/${done}</strong><p class="meta">已完成 ${done}/${queue.length} 题 · 正确率 ${pct}%</p></div></div><div class="bottom-actions"><button class="btn primary" id="againBtn">再练一组</button><button class="btn good" id="mistakeBtn" ${mistakes.length?'':'disabled'}>只练错题/不认识</button><button class="btn warn" id="downloadMistakesBtn" ${miss.length?'':'disabled'}>下载错题词汇</button></div></div>`;$('#againBtn').onclick=makeQueue;$('#mistakeBtn').onclick=()=>{queue=[...uniqueMistakes()];index=0;score=0;mistakes=[];answered=[];renderQuiz();renderSide()};$('#downloadMistakesBtn').onclick=downloadMistakes}function renderSide(){const counts=UNITS.map(u=>({u,total:TEST_VOCAB.filter(x=>x.unit===u).length,done:answered.filter(x=>x.unit===u).length}));$('#unitList').innerHTML=counts.map(x=>`<div class="unit-row"><span>Unit ${x.u}</span><span><div class="progress"><div class="bar" style="width:${x.done/Math.max(1,x.total)*100}%"></div></div></span><span>${x.done}/${x.total}</span></div>`).join('');$('#mistakes').innerHTML=mistakes.length?mistakes.slice(-12).reverse().map(x=>`<div class="mistake"><strong>${escapeHtml(x.term)}</strong><small>${escapeHtml(cleanCn(x.cn))}</small></div>`).join(''):'<div class="mistake"><small>暂无错题/不认识</small></div>'}function renderVocab(){const q=$('#searchInput')?$('#searchInput').value.trim().toLowerCase():'';let list=selectedUnit==='all'?VOCAB:VOCAB.filter(x=>x.unit===Number(selectedUnit));if(q)list=list.filter(x=>x.term.toLowerCase().includes(q)||x.cn.includes(q));$('#vocabGrid').innerHTML=list.map(x=>`<div class="vocab-item"><strong>${escapeHtml(x.term)}</strong><small>Unit ${x.unit} · ${escapeHtml(x.pos)}</small><span>${escapeHtml(x.cn)}</span></div>`).join('')}function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function escapeAttr(s){return escapeHtml(s).replace(/`/g,'&#96;')}$('#orderMode').onchange=makeQueue;$('#amountMode').onchange=makeQueue;$('#restartBtn').onclick=makeQueue;$('#reviewToggle').onclick=()=>{$('#reviewPanel').classList.toggle('open');renderVocab()};$('#searchInput').oninput=renderVocab;$('#clearSearch').onclick=()=>{$('#searchInput').value='';renderVocab()};renderFilters();makeQueue();
</script>
