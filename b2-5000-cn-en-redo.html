<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B2-5000 汉译英测试</title>
<style>
:root{--ink:#17202c;--muted:#607086;--line:#d8e1ea;--bg:#f6f8fb;--card:#fff;--accent:#be123c;--good:#0f766e;--bad:#c24135;--warn:#a16207;--soft:#fff1f2}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff1f2 0,#f6f8fb 260px,#f6f8fb 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{border:0;border-radius:8px;background:#edf2f7;color:var(--ink);padding:12px 16px;font-weight:900;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--accent);color:#fff}.ghost{background:#fff;border:1px solid var(--line)}.warn{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa}.wrap{width:min(1120px,calc(100% - 28px));margin:0 auto;padding:26px 0 54px}.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;margin-bottom:16px}.tag{display:inline-flex;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;color:var(--accent);font-weight:950;font-size:13px}h1{margin:13px 0 7px;font-size:clamp(34px,6vw,64px);line-height:1.02;letter-spacing:0}.sub{margin:0;color:var(--muted);font-size:18px}.topStats{display:grid;grid-template-columns:repeat(2,120px);gap:10px}.mini,.panel{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:8px;box-shadow:0 18px 45px rgba(23,32,44,.09)}.mini{padding:14px}.mini b{display:block;font-size:24px}.mini span{color:var(--muted);font-size:13px;font-weight:800}.toolbar{position:sticky;top:0;z-index:5;background:rgba(246,248,251,.94);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:16px}.tools{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}.group{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.field{display:flex;align-items:center;gap:7px;color:var(--muted);font-weight:900}.field input,.field select{border:1px solid var(--line);border-radius:8px;padding:11px 12px;background:#fff;color:var(--ink);min-width:118px}.track{height:9px;background:#e4e9ef;border-radius:999px;overflow:hidden;margin-top:11px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#0f766e);transition:.22s}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px}.panel{padding:18px}.startBox{min-height:430px;display:grid;place-items:center;text-align:center}.startBox .bigStart{font-size:26px;padding:20px 54px;border-radius:8px}.startBox p{color:var(--muted);font-weight:800;margin:12px 0 22px}.quiz{min-height:430px}.count{color:var(--muted);font-weight:950}.prompt{font-size:clamp(38px,6vw,78px);line-height:1.08;font-weight:950;margin:26px 0 14px;word-break:break-word}.hint{display:inline-flex;background:#e8f2ff;color:#174a7c;border-radius:8px;padding:10px 13px;font-size:18px;font-weight:950;margin-bottom:16px}.answerRow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;margin-top:12px}.answerRow input{width:100%;border:2px solid #b7c7d6;border-radius:8px;padding:16px 15px;font-size:24px;font-weight:850;background:#fff}.answerRow input:focus{outline:3px solid rgba(190,18,60,.18);border-color:var(--accent)}.feedback{margin-top:14px;padding:13px;border-radius:8px;background:#f0f4f8;color:var(--muted);font-weight:900}.feedback.good{background:#e2f5ef;color:#075e56}.feedback.bad{background:#fee2de;color:#9b2c25}.nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#f6f8fb;border:1px solid var(--line);border-radius:8px;padding:12px;text-align:center}.stat b{display:block;font-size:28px}.stat span{color:var(--muted);font-weight:850}.dots{display:flex;gap:6px;flex-wrap:wrap;max-height:255px;overflow:auto}.dot{width:18px;height:18px;border-radius:5px;background:#dfe7ef;padding:0}.dot.on{outline:3px solid rgba(190,18,60,.24)}.dot.ok{background:#28a76f}.dot.bad{background:#df5b51}.dot.skip{background:#d7a12c}.result{display:none;margin-top:16px}.result.show{display:block}.score{font-size:58px;font-weight:950;color:var(--accent);line-height:1}.chips{margin-top:12px;min-height:80px;border:1px dashed #b7c7d6;background:#fbfcfe;border-radius:8px;padding:12px}.chip{display:inline-flex;margin:5px 5px 0 0;border-radius:999px;background:#eef3f8;border:1px solid var(--line);padding:7px 10px;font-weight:850}.brand{position:fixed;right:14px;bottom:14px;z-index:9;border:1px solid #d9e0e8;background:rgba(255,255,255,.94);border-radius:999px;padding:8px 12px;font:800 13px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;box-shadow:0 8px 24px rgba(24,32,42,.12)}@media(max-width:840px){.hero,.layout{grid-template-columns:1fr}.topStats{grid-template-columns:repeat(2,1fr)}.answerRow{grid-template-columns:1fr}.tools,.group{align-items:stretch}.group{width:100%}.field{width:100%}.field input,.field select{flex:1;min-width:0}button{flex:1}.prompt{font-size:42px}}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero"><div><span class="tag">Alex Han Studio · 5000系列 B2 · Chinese to English</span><h1>B2-5000 汉译英测试</h1><p class="sub">中文释义 + 首字母 + 准确词性，输入完整英文表达。</p></div><div class="topStats"><div class="mini"><b id="total">加载中</b><span>词库</span></div><div class="mini"><b id="timer">00:00</b><span>用时</span></div><div class="mini"><b id="progress">0 / 0</b><span>进度</span></div><div class="mini"><b>TXT</b><span>错词下载</span></div></div></section>
  <section class="toolbar"><div class="tools"><div class="group"><label class="field">姓名 <input id="student" placeholder="Student name"></label><label class="field">题量 <select id="size"><option value="50">50题</option><option value="100" selected>100题</option><option value="200">200题</option><option value="all">全部</option></select></label><label class="field">顺序 <select id="order"><option value="random" selected>随机</option><option value="original">词表顺序</option></select></label></div><div class="group"><button class="primary" id="startTop" disabled>开始</button><button class="ghost" id="restart" disabled>重来</button><button class="warn" id="finish" disabled>交卷</button></div></div><div class="track"><div class="bar" id="bar"></div></div></section>
  <main class="layout"><section class="panel" id="mainPanel"><div class="startBox" id="startBox"><div><div class="count" id="state">正在加载词库</div><p>加载完成后，点击下方按钮开始测试。</p><button class="primary bigStart" id="startBig" disabled>开始测试</button></div></div><div class="quiz" id="quizBox" style="display:none"><div class="count" id="count">第 1 题</div><div class="prompt" id="prompt">-</div><div class="hint" id="hint">-</div><div class="answerRow"><input id="answer" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="输入英文拼写"><button class="primary" id="submit">确认</button></div><div class="feedback" id="feedback">请输入答案。</div><div class="nav"><button class="ghost" id="prev">上一题</button><button class="ghost" id="next">下一题</button><button class="warn" id="skip">跳过</button></div></div></section><aside><section class="panel"><h2>统计</h2><div class="stats"><div class="stat"><span>正确</span><b id="right">0</b></div><div class="stat"><span>错误</span><b id="wrong">0</b></div><div class="stat"><span>未答</span><b id="left">0</b></div></div></section><section class="panel" style="margin-top:16px"><h2>题目地图</h2><div class="dots" id="dots"></div></section></aside></main>
  <section class="panel result" id="result"><h2>测试结果</h2><div class="score" id="score">0%</div><p id="summary"></p><div class="chips" id="wrongBox"></div><div class="nav"><button class="primary" id="download">下载错词 TXT</button><button class="ghost" id="again">再测一次</button></div></section>
</div><div class="brand">Alex Han Studio</div>
<script>
(function(){
const urls=['b2-5000-1.txt','b2-5000-2.txt','b2-5000-3.txt','b2-5000-4.txt'];
const labels={noun:'名词',verb:'动词',adj:'形容词',adv:'副词',prep:'介词',conj:'连词',det:'限定词/冠词',pron:'代词',number:'数词',exclamation:'感叹词'};
const $=id=>document.getElementById(id);let bank=[],quiz=[],rec=[],idx=0,started=0,ended=0,timer=0,submitted=false;
function posText(pos){return String(pos||'').split(/[+\/,]/).map(x=>x.trim()).filter(Boolean).map(x=>labels[x]||x).join(' / ')||'词汇'}
function normalize(s){return String(s).normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/[’‘`´]/g,"'").replace(/[^a-z0-9]/g,'')}
function shuffle(a){const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function fmt(ms){const s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function tick(){if(started&&!ended)$('timer').textContent=fmt(Date.now()-started)}
function parse(text){return text.split(/\n/).map(row=>{row=row.replace(/\r/g,'').trim();if(!row)return null;const p=row.split('|').map(x=>x.trim());if(p.length<3||!p[0]||!p[1]||!p[2])return null;return{word:p[0],meaning:p[1],pos:p.slice(2).join('|')}}).filter(Boolean)}
async function load(){try{const texts=await Promise.all(urls.map(u=>fetch(u+'?v=20260606',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(u+' '+r.status);return r.text()})));bank=parse(texts.join('\n'));$('total').textContent=bank.length+'词';$('size').querySelector('option[value="all"]').textContent='全部 '+bank.length+'题';$('state').textContent='准备开始';['startTop','startBig'].forEach(id=>$(id).disabled=false);if(bank.length!==814)$('state').textContent='词库已加载：'+bank.length+' 词'}catch(e){$('state').textContent='词库加载失败，请刷新或换备用链接';$('startBox').querySelector('p').textContent=e.message}}
function pick(){let list=$('order').value==='random'?shuffle(bank):bank.slice();const n=$('size').value;return n==='all'?list:list.slice(0,Number(n))}
function start(){if(!bank.length)return;quiz=pick();rec=quiz.map(q=>({word:q.word,meaning:q.meaning,pos:q.pos,typed:'',done:false,correct:false,skip:false}));idx=0;started=Date.now();ended=0;submitted=false;clearInterval(timer);timer=setInterval(tick,250);$('startBox').style.display='none';$('quizBox').style.display='block';$('result').classList.remove('show');$('finish').disabled=false;$('restart').disabled=false;render();setTimeout(()=>$('answer').focus(),80)}
function cur(){return quiz[idx]}function rcur(){return rec[idx]}
function stats(){return rec.reduce((a,r)=>{if(!r.done)a.left++;else if(r.correct)a.right++;else a.wrong++;return a},{right:0,wrong:0,left:0})}
function renderStats(){const s=stats();$('right').textContent=s.right;$('wrong').textContent=s.wrong;$('left').textContent=s.left;const done=rec.filter(x=>x.done).length,total=quiz.length||0;$('progress').textContent=done+' / '+total;$('bar').style.width=total?Math.round(done/total*100)+'%':'0%'}
function renderDots(){const box=$('dots');box.innerHTML='';rec.forEach((r,i)=>{const b=document.createElement('button');b.className='dot '+(i===idx?'on ':'')+(r.done?(r.correct?'ok':(r.skip?'skip':'bad')):'');b.title=(i+1)+'. '+r.word;b.onclick=()=>{save();idx=i;render();$('answer').focus()};box.appendChild(b)})}
function render(){if(!quiz.length)return;const q=cur(),r=rcur();$('count').textContent='第 '+(idx+1)+' / '+quiz.length+' 题';$('prompt').textContent=q.meaning;$('hint').textContent='首字母：'+q.word.slice(0,1).toLowerCase()+' ｜ 词性：'+posText(q.pos);$('answer').value=r.typed||'';$('feedback').className='feedback'+(r.done?(r.correct?' good':' bad'):'');$('feedback').textContent=r.done?(r.correct?'正确':'正确答案：'+q.word):'请输入完整英文单词，按 Enter 或点击确认。';renderStats();renderDots();tick()}
function save(){if(quiz.length&&!rcur().done)rcur().typed=$('answer').value.trim()}
function submit(){if(!quiz.length)return start();const r=rcur(),q=cur(),typed=$('answer').value.trim();if(!typed){$('feedback').textContent='请先输入答案，或点击“跳过”。';return}r.typed=typed;r.done=true;r.skip=false;r.correct=normalize(typed)===normalize(q.word);render()}
function move(step){if(!quiz.length)return start();save();idx=Math.max(0,Math.min(quiz.length-1,idx+step));render();$('answer').focus()}
function skip(){if(!quiz.length)return;const r=rcur();r.typed='';r.done=true;r.skip=true;r.correct=false;render();if(idx<quiz.length-1)setTimeout(()=>move(1),180)}
function finish(){if(!quiz.length)return;save();rec.forEach(r=>{if(!r.done){r.done=true;r.skip=true;r.correct=false}});submitted=true;ended=Date.now();clearInterval(timer);$('timer').textContent=fmt(ended-started);render();const s=stats(),wrong=rec.filter(r=>!r.correct),score=Math.round(s.right/quiz.length*100);$('score').textContent=score+'%';$('summary').textContent='正确 '+s.right+' 题，错误/未答 '+wrong.length+' 题，用时 '+fmt(ended-started)+'。';const box=$('wrongBox');box.innerHTML='';(wrong.length?wrong.slice(0,180):[{word:'全部正确',meaning:'没有错词'}]).forEach(r=>{const c=document.createElement('span');c.className='chip';c.textContent=r.word+(r.meaning?' = '+r.meaning:'');box.appendChild(c)});$('result').classList.add('show');$('result').scrollIntoView({behavior:'smooth',block:'start'})}
function wrongText(){if(!submitted)finish();const name=$('student').value.trim()||'No name',wrong=rec.filter(r=>!r.correct),lines=['B2-5000 汉译英测试错词','姓名：'+name,'用时：'+fmt((ended||Date.now())-started),'题量：'+quiz.length,'错词数：'+wrong.length,''];wrong.forEach((r,i)=>lines.push((i+1)+'. '+r.word+'\t中文：'+r.meaning+'\t词性：'+posText(r.pos)+'\t学生答案：'+(r.typed||'未作答')));if(!wrong.length)lines.push('全部正确');lines.push('',new Date().toLocaleString('zh-CN'));return lines.join('\n')}
function download(){const blob=new Blob([wrongText()],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='B2-5000_han_to_en_wrong_words.txt';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href)}
$('startTop').onclick=start;$('startBig').onclick=start;$('restart').onclick=start;$('again').onclick=start;$('submit').onclick=submit;$('answer').onkeydown=e=>{if(e.key==='Enter')submit()};$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('skip').onclick=skip;$('finish').onclick=finish;$('download').onclick=download;load();
})();
</script>
</body>
</html>
