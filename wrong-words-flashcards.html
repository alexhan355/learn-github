291,2306,2307,2309,2314,2318,2319,2321,2326,2331,2332,2335,2336,2340,2344,2345,2347,2348,2352,2354,2356,2360,2361,2362,2364,2365,2370,2375,2376,2378,2380,2389,2390,2395,2399,2403,2404,2407,2408,2410,2423,2425,2428,2430,2431,2433,2435,2436,2437,2443,2453,2456,2460,2465,2468,2469,2471,2479,2480,2487,2488,2490,2493,2499,2500,2502,2509,2510,2511,2513,2518,2520,2521,2525,2526,2527,2528,2532,2535,2536,2537,2544,2545,2546,2547,2553,2563,2564,2566,2567,2569,2571,2573,2586,2588],STORE='alexhanWrongWordsFlashcards:v3';let CARDS=[],state={mode:'flash',queue:[],i:0,shown:false,right:0,wrong:0},progress=loadProgress();const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function loadProgress(){try{return JSON.parse(localStorage.getItem(STORE))||{seen:{},known:{},wrong:{}}}catch{return{seen:{},known:{},wrong:{}}}}function save(){localStorage.setItem(STORE,JSON.stringify(progress))}function clean(s){return String(s||'').replace(/\s*;\s*/g,'；').replace(/\s+/g,' ').trim()}function meta(c){return [c.book,c.unit?'Unit '+c.unit:''].filter(Boolean).join(' · ')||'词条'}function norm(s){return String(s||'').toLowerCase().replace(/[’']/g,"'").replace(/\.\.\./g,' ').replace(/\bsth\.?\b/g,'something').replace(/\bsb\.?\b/g,'somebody').replace(/[^a-z0-9]+/g,' ').trim()}function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
async function loadCards(){try{const html=await fetch('renjiao-high-school-vocab-en-cn.html',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.text()}),m=html.match(/const VOCAB\s*=\s*(\[[\s\S]*?\]);/);if(!m)throw Error('VOCAB');const byId=new Map(JSON.parse(m[1]).map(x=>[x.id,x]));CARDS=IDS.map((id,i)=>{const x=byId.get(id);return x&&{id:i+1,word:x.word,answer:clean(x.answer),phonetic:x.phonetic||'',book:x.bookLabel||x.book||'',unit:x.unit||''}}).filter(Boolean);if(CARDS.length!==IDS.length)throw Error('missing');start()}catch(e){$('#main').innerHTML='<div class="note"><strong>词库载入失败。</strong><br>请刷新页面，或稍后再打开。</div>'}}

function render(){if(state.i>=state.queue.length)return result();$$('.tab').forEach(b=>b.classList.toggle('on',b.dataset.mode===state.mode));const c=current();$('#main').innerHTML=stats()+(state.mode==='typing'?typing(c):flash(c));$('#main').querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));const input=$('#typed');if(input){input.focus();input.onkeydown=e=>{if(e.key==='Enter')act('check')}}renderSide();renderGrid()}function flash(c){return '<div class="card"><div class="tagrow"><span class="tag">'+esc(meta(c))+'</span><span class="tag">#'+c.id+'</span></div><div class="term">'+esc(c.word)+'</div><div class="phon">'+esc(c.phonetic)+'</div>'+(state.shown?'<div class="meaning">'+esc(c.answer)+'</div>':'<div class="note">先回忆中文释义，再点“看答案”。</div>')+'</div><div class="note">'+(state.shown?'这张卡片你掌握了吗？':'点击“看答案”后记录掌握情况。')+'</div><div class="row">'+(state.shown?'<button class="btn good" data-act="known">认识</button><button class="btn bad" data-act="miss">不认识</button><button class="btn" data-act="next">下一张</button>':'<button class="btn primary" data-act="show">看答案</button>')+'</div>'}function typing(c){return '<div class="card"><div class="tagrow"><span class="tag">'+esc(meta(c))+'</span><span class="tag">#'+c.id+'</span></div><div class="meaning">'+esc(c.answer)+'</div><input class="answer" id="typed" autocomplete="off" placeholder="输入英文单词或短语"></div><div class="note" id="feed">根据中文释义拼写英文。</div><div class="row"><button class="btn primary" data-act="check">检查</button><button class="btn warn" data-act="showType">看答案</button><button class="btn" data-act="next">跳过</button></div>'}
function mark(ok){const c=current();progress.seen[c.id]=Date.now();if(ok){state.right++;progress.known[c.id]=(progress.known[c.id]||0)+1;delete progress.wrong[c.id]}else{state.wrong++;progress.wrong[c.id]=Date.now()}save();state.i++;state.shown=false;render()}function act(a){if(a==='show'){state.shown=true;render();return}if(a==='known')return mark(true);if(a==='miss')return mark(false);if(a==='next'){state.i++;state.shown=false;render();return}if(a==='showType'){$('#feed').innerHTML='答案：<strong>'+esc(current().word)+'</strong>';progress.wrong[current().id]=Date.now();progress.seen[current().id]=Date.now();save();renderSide();return}if(a==='check'){const ok=norm($('#typed').value)===norm(current().word);$('#feed').innerHTML=ok?'正确。':'还差一点，答案：<strong>'+esc(current().word)+'</strong>';setTimeout(()=>mark(ok),ok?500:1200)}}function result(){const total=state.right+state.wrong,score=total?Math.round(state.right/total*100):0;$('#main').innerHTML='<div class="card"><div class="meaning">'+score+'%</div><div class="note">'+state.right+' 对 / '+state.wrong+' 错</div><div class="row"><button class="btn primary" id="again">再练一组</button><button class="btn bad" id="wrongOnly">只练错题</button></div></div>';$('#again').onclick=start;$('#wrongOnly').onclick=()=>{$('#range').value='wrong';start()};renderSide();renderGrid()}
