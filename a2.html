<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A2 Vocabulary Level Test</title>
<style>
:root{--ink:#172230;--muted:#637184;--line:#d9e3ec;--paper:#fff;--bg:#edf4f7;--blue:#1f5f8b;--teal:#227c68;--gold:#b7791f;--red:#b54708;--soft:#f6f9fc}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}button,input,select{font:inherit}button{border:0;border-radius:8px;padding:9px 12px;font-weight:850;cursor:pointer;background:#e7eff6;color:#244a67}button:hover{filter:brightness(.98);transform:translateY(-1px)}button:disabled{opacity:.55;cursor:not-allowed;transform:none}.primary{background:linear-gradient(135deg,var(--blue),var(--teal));color:white}.danger{background:#fff4ed;color:var(--red);border:1px solid #fed7aa}.ghost{background:white;border:1px solid var(--line)}.wrap{width:min(1120px,calc(100% - 28px));margin:18px auto 38px}.hero{border-radius:8px;padding:24px;color:white;background:linear-gradient(135deg,#174c72,#227c68 70%,#9a6a22);box-shadow:0 16px 34px rgba(23,34,48,.14)}.tag{display:inline-flex;padding:4px 10px;border:1px solid rgba(255,255,255,.3);border-radius:999px;background:rgba(255,255,255,.13);font-size:12px}h1{margin:12px 0 8px;font-size:clamp(28px,4vw,42px);line-height:1.1}.sub{max-width:820px;margin:0;color:rgba(255,255,255,.92)}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.meta div{padding:10px 12px;border:1px solid rgba(255,255,255,.22);border-radius:8px;background:rgba(255,255,255,.12)}.meta b{display:block;font-size:12px;color:rgba(255,255,255,.82)}.bar{position:sticky;top:8px;z-index:8;margin:14px 0;padding:12px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);box-shadow:0 8px 24px rgba(23,34,48,.08)}.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.left,.right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill,.field{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:8px 10px;color:#344456}.field input,.field select{border:0;outline:0;background:transparent;color:var(--ink)}.field input{width:140px}.track{height:9px;margin-top:10px;border-radius:999px;background:#dce8f0;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--teal),var(--gold));transition:.2s}.panel,.quiz,.result{background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 20px rgba(23,34,48,.05)}.panel{padding:16px}.panel h2,.result h2{margin:0 0 8px;font-size:18px}.panel p{margin:0;color:var(--muted)}.settings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}.setting{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fbfdff}.setting span{display:block;color:var(--muted);font-size:12px}.setting select{width:100%;border:0;outline:0;background:transparent;color:var(--ink);font-weight:850}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;margin-top:14px}.quiz{padding:22px;min-height:420px;display:grid;align-content:start}.quiz-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.counter{color:var(--muted);font-weight:850}.word{margin:28px 0 10px;font-size:clamp(42px,8vw,84px);line-height:1.05;font-weight:950;color:#132235;overflow-wrap:anywhere}.hint{min-height:26px;color:var(--muted)}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}.option{display:flex;gap:10px;align-items:center;min-height:60px;text-align:left;background:#fbfdff;border:1px solid var(--line);color:var(--ink)}.option span{width:28px;height:28px;display:grid;place-items:center;flex:0 0 28px;border-radius:999px;background:#e5edf3;color:#244a67;font-size:13px;font-weight:900}.option b{font-weight:850;line-height:1.35}.option.correct{background:#eaf8ef;color:#23633e;border-color:#92d1a8}.option.correct span{background:#2f8a57;color:white}.option.wrong{background:#fff0ec;color:#9d3f31;border-color:#efb4a9}.option.wrong span{background:#c85b4b;color:white}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}.side{display:grid;gap:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--soft)}.stat span{display:block;color:var(--muted);font-size:12px}.stat b{font-size:24px;color:var(--blue)}.map{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;max-height:300px;overflow:auto;padding-right:2px}.dot{height:10px;padding:0;border-radius:999px;background:#cbd7e4}.dot.correct{background:#4fa871}.dot.wrong{background:#d16b5b}.result{display:none;margin-top:14px;padding:16px}.result.show{display:block}.score{font-size:34px;font-weight:950;color:var(--blue)}.badge{display:inline-block;margin:8px 0;padding:7px 10px;border-radius:999px;background:#edf6fb;border:1px solid #cfe2ef;color:#20597f;font-weight:850}.review{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;padding:10px;border:1px dashed #e8b09f;border-radius:8px;background:#fff8f5;cursor:pointer}.chip{padding:6px 9px;border:1px solid #efc3ba;border-radius:999px;background:#fff0ec;color:#98382d;font-size:13px}.code{width:100%;min-height:88px;margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:10px;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,20px);opacity:0;background:#132235;color:white;border-radius:999px;padding:10px 14px;box-shadow:0 12px 30px rgba(0,0,0,.18);transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){.meta,.settings,.layout,.choices{grid-template-columns:1fr}.side{order:-1}.tools,.left,.right{align-items:stretch;width:100%}.right button{flex:1}.field,.field input,.field select{width:100%}.map{grid-template-columns:repeat(16,1fr);max-height:120px}}
@media(max-width:520px){.wrap{width:min(100% - 18px,1120px);margin-top:10px}.hero,.panel,.quiz,.result{padding:14px}.word{font-size:42px}.map{grid-template-columns:repeat(10,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <span class="tag">CEFR A2 · Multiple Choice</span>
    <h1>A2 词汇水平测试</h1>
    <p class="sub">每题显示一个英文单词和四个中文意思，只有一个正确答案。学生作答后自动跳到下一题，全程计时，完成后可下载错词 TXT。</p>
    <div class="meta"><div><b>词库</b><span id="wordTotal">加载中</span></div><div><b>题型</b>四选一</div><div><b>反馈</b>答后跳题</div><div><b>结果</b>分数 + 用时 + 错词</div></div>
  </section>
  <div class="bar">
    <div class="tools">
      <div class="left">
        <label class="field">姓名 <input id="studentName" placeholder="Student name"></label>
        <span class="pill" id="progress">0 / 100</span>
        <span class="pill" id="timer">00:00</span>
        <span class="pill" id="status">加载词库中</span>
      </div>
      <div class="right">
        <button class="ghost" onclick="speakWord()">朗读</button>
        <button onclick="prevCard()">上一题</button>
        <button onclick="nextCard()">下一题</button>
        <button class="primary" onclick="finishQuiz()">交卷</button>
        <button class="danger" onclick="resetQuiz()">重来</button>
      </div>
    </div>
    <div class="track"><div class="fill" id="fill"></div></div>
  </div>
  <section class="panel">
    <h2>测试设置</h2>
    <p id="settingText">课堂快测建议 100 题；摸底或分层可以选择全部题。错词汇总区域点击即可下载 TXT。</p>
    <div class="settings">
      <label class="setting"><span>题量</span><select id="quizSize"><option value="100">100 题</option><option value="50">50 题</option><option value="200">200 题</option><option value="all">全部题</option></select></label>
      <label class="setting"><span>顺序</span><select id="quizOrder"><option value="random">随机抽题</option><option value="original">按词表顺序</option></select></label>
      <label class="setting"><span>跳题速度</span><select id="jumpDelay"><option value="360">快速</option><option value="700">看清反馈</option><option value="0">手动下一题</option></select></label>
    </div>
    <p style="margin-top:12px"><button class="primary" id="startBtn" onclick="startQuiz()" disabled>开始 / 重新抽题</button></p>
  </section>
  <main class="layout">
    <section class="quiz">
      <div class="quiz-head"><div class="counter" id="counter">词库加载中</div><button class="ghost" onclick="toggleFlag()" id="flagBtn">标记复习</button></div>
      <div class="word" id="word">loading</div>
      <div class="hint" id="hint">正在读取 A2 词库</div>
      <div class="choices" id="choices"></div>
      <div class="nav"><button onclick="prevCard()">上一题</button><button class="primary" onclick="nextCard()">下一题</button></div>
    </section>
    <aside class="side">
      <section class="panel"><h2>进度</h2><div class="stats"><div class="stat"><span>正确</span><b id="correctCount">0</b></div><div class="stat"><span>错误</span><b id="wrongCount">0</b></div><div class="stat"><span>未答</span><b id="unansweredCount">0</b></div></div></section>
      <section class="panel"><h2>题目地图</h2><div class="map" id="map"></div></section>
    </aside>
  </main>
  <section class="result" id="result">
    <h2>测试结果</h2><div class="score" id="score">0%</div><div class="badge" id="badge">Ready</div><p id="summary"></p>
    <div class="review" id="review" onclick="downloadWrongTxt()"></div>
    <textarea class="code" id="code" readonly></textarea>
    <p><button onclick="downloadWrongTxt()">下载错词 TXT</button> <button onclick="copyCode()">复制结果代码</button></p>
  </section>
</div>
<div class="toast" id="toast">Saved</div>
<script>
const DATA_URL="./a2-meanings.txt",LETTERS=["A","B","C","D"],$=id=>document.getElementById(id);
let DATA=[],questions=[],records=[],current=0,startedAt=0,finishedAt=0,timerId=0,submitted=false,toastTimer;
function shuffle(list){const arr=[...list];for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function formatTime(ms){const total=Math.max(0,Math.floor(ms/1000));return `${String(Math.floor(total/60)).padStart(2,"0")}:${String(total%60).padStart(2,"0")}`}
function tick(){if(startedAt&&!finishedAt)$("timer").textContent=formatTime(Date.now()-startedAt)}
function parseData(text){return text.trim().split(/\n/).map(line=>{const [word,...rest]=line.split("|");return{word:word.trim(),meaning:rest.join("|").trim()}}).filter(x=>x.word&&x.meaning)}
async function loadData(){try{const res=await fetch(DATA_URL,{cache:"no-store"});if(!res.ok)throw new Error("load failed");DATA=parseData(await res.text());$("wordTotal").textContent=DATA.length+" words";$("quizSize").querySelector('option[value="all"]').textContent="全部 "+DATA.length+" 题";$("settingText").textContent=`课堂快测建议 100 题；摸底或分层可以选择全部 ${DATA.length} 题。错词汇总区域点击即可下载 TXT。`;$("startBtn").disabled=false;$("status").textContent="未开始";$("counter").textContent="点击“开始 / 重新抽题”";$("word").textContent="ready";$("hint").textContent="选择题量后开始测试";updateProgress();pop("词库已加载")}catch(e){$("status").textContent="词库加载失败";$("word").textContent="reload";$("hint").textContent="请刷新页面重试"}}
function makeOptions(item){const seen=new Set([item.meaning]),d=[];for(const entry of shuffle(DATA)){if(entry.word===item.word||seen.has(entry.meaning))continue;seen.add(entry.meaning);d.push(entry.meaning);if(d.length===3)break}const pos=Math.floor(Math.random()*4),options=[...d];options.splice(pos,0,item.meaning);return{options,answer:LETTERS[pos]}}
function pickQuestions(){const size=$("quizSize").value;let list=$("quizOrder").value==="random"?shuffle(DATA):[...DATA];if(size!=="all")list=list.slice(0,Number(size));return list.map(item=>({...item,...makeOptions(item)}))}
function startQuiz(){if(!DATA.length)return pop("词库还没加载好");questions=pickQuestions();records=questions.map(q=>({word:q.word,meaning:q.meaning,selected:"",selectedMeaning:"",correct:false,flag:false}));current=0;submitted=false;finishedAt=0;startedAt=Date.now();clearInterval(timerId);timerId=setInterval(tick,250);$("result").classList.remove("show");renderMap();renderCard();updateStats();tick();pop("已开始，共 "+questions.length+" 题")}
function renderCard(){if(!questions.length){$("choices").innerHTML="";return}const q=questions[current],r=records[current];$("counter").textContent=`第 ${current+1} / ${questions.length} 题`;$("word").textContent=q.word;$("hint").textContent=r.selected?(r.correct?`正确：${q.meaning}`:`错误，正确答案：${q.meaning}`):"请选择正确的中文意思";$("flagBtn").textContent=r.flag?"取消标记":"标记复习";$("choices").innerHTML=q.options.map((opt,i)=>choiceButton(q,r,opt,LETTERS[i])).join("");updateProgress()}
function choiceButton(q,r,opt,letter){let cls="option";if(r.selected){if(letter===q.answer)cls+=" correct";else if(letter===r.selected)cls+=" wrong"}return`<button class="${cls}" onclick="choose('${letter}')"><span>${letter}</span><b>${opt}</b></button>`}
function choose(letter){if(!questions.length)return startQuiz();const q=questions[current],r=records[current],idx=LETTERS.indexOf(letter);r.selected=letter;r.selectedMeaning=q.options[idx];r.correct=letter===q.answer;updateStats();renderMap();renderCard();pop(r.correct?"回答正确":"回答错误");const delay=Number($("jumpDelay").value);if(delay&&current<questions.length-1)setTimeout(nextCard,delay);else if(delay&&current===questions.length-1)setTimeout(finishQuiz,delay)}
function nextCard(){if(!questions.length)return;if(current<questions.length-1){current++;renderCard()}else finishQuiz()}
function prevCard(){if(!questions.length)return;if(current>0){current--;renderCard()}else pop("已经是第一题")}
function toggleFlag(){if(!questions.length)return;records[current].flag=!records[current].flag;renderMap();renderCard();pop(records[current].flag?"已标记复习":"已取消标记")}
function jump(i){current=i;renderCard();document.querySelector(".quiz").scrollIntoView({behavior:"smooth",block:"start"})}
function renderMap(){let html="";records.forEach((r,i)=>{const cls=r.selected?(r.correct?"correct":"wrong"):"";const flag=r.flag?" ★":"";html+=`<button class="dot ${cls}" title="${i+1}. ${r.word}${flag}" onclick="jump(${i})"></button>`});$("map").innerHTML=html}
function counts(){return records.reduce((a,r)=>{if(!r.selected)a.unanswered++;else if(r.correct)a.correct++;else a.wrong++;if(r.flag)a.flag++;return a},{correct:0,wrong:0,unanswered:0,flag:0})}
function updateStats(){const c=counts();$("correctCount").textContent=c.correct;$("wrongCount").textContent=c.wrong;$("unansweredCount").textContent=c.unanswered;updateProgress()}
function updateProgress(){const answered=records.filter(r=>r.selected).length,total=questions.length||Number($("quizSize").value)||100,pct=total?Math.round(answered/total*100):0;$("progress").textContent=`${answered} / ${total}`;$("fill").style.width=pct+"%";if(questions.length)$("status").textContent=`正确 ${counts().correct}`}
function label(pct){if(pct>=90)return"A2 词汇很稳";if(pct>=75)return"A2 基础扎实";if(pct>=60)return"接近 A2，需复习错词";return"建议先补核心词义"}
function finishQuiz(){if(!questions.length)return startQuiz();submitted=true;if(!finishedAt){finishedAt=Date.now();clearInterval(timerId);$("timer").textContent=formatTime(finishedAt-startedAt)}renderCard();renderMap();const c=counts(),pct=Math.round(c.correct/questions.length*100),wrong=wrongItems();$("result").classList.add("show");$("score").textContent=pct+"%";$("badge").textContent=label(pct);$("summary").textContent=`正确 ${c.correct} 题，错误 ${c.wrong} 题，未答 ${c.unanswered} 题，用时 ${formatTime(finishedAt-startedAt)}。点击下方错词区可下载 TXT。`;$("review").innerHTML=wrong.length?wrong.slice(0,140).map(r=>`<span class="chip">${r.word} = ${r.meaning}</span>`).join("")+(wrong.length>140?`<span class="pill">+ ${wrong.length-140} more</span>`:""):'<span class="pill">全部正确，没有错词</span>';$("code").value=resultCode(pct,c,wrong);$("result").scrollIntoView({behavior:"smooth",block:"start"});pop("结果已生成")}
function wrongItems(){return records.filter(r=>!r.correct||r.flag)}
function resultCode(pct,c,wrong){const name=$("studentName").value.trim()||"No name";return[`A2-VOCAB-MCQ-TIMER`,`Name: ${name}`,`Score: ${c.correct}/${questions.length} (${pct}%)`,`Time: ${formatTime((finishedAt||Date.now())-startedAt)}`,`Wrong: ${c.wrong}`,`Unanswered: ${c.unanswered}`,`Review: ${wrong.map(r=>`${r.word}=${r.meaning}`).join(", ")}`,`Finished: ${new Date().toLocaleString()}`].join("\n")}
function wrongTxt(){const name=$("studentName").value.trim()||"No name",wrong=wrongItems(),time=formatTime((finishedAt||Date.now())-startedAt);const lines=[`A2 Vocabulary Wrong Words`,`Name: ${name}`,`Time: ${time}`,`Total questions: ${questions.length}`,`Wrong / review words: ${wrong.length}`,``];wrong.forEach((r,i)=>lines.push(`${i+1}. ${r.word}\t正确：${r.meaning}\t你的选择：${r.selectedMeaning||"未作答"}`));return lines.join("\n")}
function downloadWrongTxt(){if(!questions.length)return pop("还没有开始测试");if(!submitted)finishQuiz();const blob=new Blob([wrongTxt()],{type:"text/plain;charset=utf-8"}),a=document.createElement("a"),name=($("studentName").value.trim()||"student").replace(/[^\w\u4e00-\u9fa5-]+/g,"_");a.href=URL.createObjectURL(blob);a.download=`${name}_A2_wrong_words.txt`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href);pop("错词 TXT 已下载")}
async function copyCode(){const c=$("code");c.select();try{await navigator.clipboard.writeText(c.value);pop("结果代码已复制")}catch(e){document.execCommand("copy");pop("已选中结果代码")}}
function speakWord(){if(!questions.length)return;const u=new SpeechSynthesisUtterance(records[current].word);u.lang="en-US";u.rate=.82;speechSynthesis.cancel();speechSynthesis.speak(u)}
function resetQuiz(){questions=[];records=[];current=0;startedAt=0;finishedAt=0;submitted=false;clearInterval(timerId);$("timer").textContent="00:00";$("map").innerHTML="";$("correctCount").textContent=0;$("wrongCount").textContent=0;$("unansweredCount").textContent=0;$("result").classList.remove("show");$("status").textContent=DATA.length?"未开始":"加载词库中";$("fill").style.width="0";$("progress").textContent="0 / 100";$("counter").textContent=DATA.length?"点击“开始 / 重新抽题”":"词库加载中";$("word").textContent=DATA.length?"ready":"loading";$("hint").textContent=DATA.length?"选择题量后开始测试":"正在读取 A2 词库";$("choices").innerHTML="";scrollTo({top:0,behavior:"smooth"})}
function pop(text){const el=$("toast");el.textContent=text;el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),1300)}
loadData();
</script>
</body>
</html>
