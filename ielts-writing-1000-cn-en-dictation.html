.logo{display:flex;align-items:center;gap:12px;min-width:0}

      function patch(html) {

        );

        html = html.replace(
          '<input id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="输入英文表达">',
          '<input id="answer" autocomplete="off" autocorrect="off" autocapitalize="off" enterkeyhint="done" spellcheck="false" placeholder="输入英文表达">'

          "function init(){unit.innerHTML='<option value=\"all\">全部单元</option>'+UNITS.map(u=>`<option value=\"${u.unit}\">Unit ${pad(u.unit)}  ${esc(u.title)}</option>`).join('');unit.value='1';render();bind();counter.textContent='未开始';qprompt.textContent='Ready';feedback.textContent='选择范围后开始。'}",

        );

        html = html.replace(
          "function bind(){start.onclick=()=>newQuiz();wrongBank.onclick=wrongQuiz;check.onclick=checkAns;next.onclick=nextQ;prev.onclick=prevQ;skip.onclick=skipQ;flag.onclick=flagQ;finish.onclick=finishQuiz;download.onclick=downloadWrong;copy.onclick=copyResult;redo.onclick=redoWrong;answer.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();currentR()?.done?nextQ():checkAns()}};document.onclick=e=>{const j=e.target.closest('[data-j]');if(j)jump(+j.dataset.j)}}",
          "function bind(){start.onclick=()=>newQuiz();qprompt.onclick=e=>{if(e.target.closest('#heroStart'))newQuiz()};wrongBank.onclick=wrongQuiz;check.onclick=checkAns;next.onclick=nextQ;prev.onclick=prevQ;skip.onclick=skipQ;flag.onclick=flagQ;finish.onclick=finishQuiz;download.onclick=downloadWrong;copy.onclick=copyResult;redo.onclick=redoWrong;answer.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();currentR()?.done?nextQ():checkAns()}};document.onclick=e=>{const j=e.target.closest('[data-j]');if(j)jump(+j.dataset.j)}}"
        );

        html = html.replace(
          "function newQuiz(src){qs=pick(src);if(!qs.length)return pop('没有可练习的题目');rs=qs.map(q=>({id:q.id,answer:'',done:false,correct:false,flag:false,skipped:false}));cur=0;submitted=false;endAt=0;startAt=Date.now();clearInterval(timerId);timerId=setInterval(tick,250);result.classList.remove('show');render();setTimeout(()=>answer.focus(),60);pop('已开始，共 '+qs.length+' 题')}",
          "function newQuiz(src){qs=pick(src);if(!qs.length)return pop('没有可练习的题目');document.querySelector('.layout').classList.remove('prestart');document.querySelector('.quiz').classList.remove('prestart');qprompt.onclick=null;rs=qs.map(q=>({id:q.id,answer:'',done:false,correct:false,flag:false,skipped:false}));cur=0;submitted=false;endAt=0;startAt=Date.now();clearInterval(timerId);timerId=setInterval(tick,250);result.classList.remove('show');render();setTimeout(()=>{const qel=document.querySelector('.quiz');window.scrollTo({top:qel.getBoundingClientRect().top+window.scrollY-8,behavior:'smooth'});setTimeout(()=>{try{answer.focus({preventScroll:true})}catch(e){answer.focus()}},180)},60);pop('已开始，共 '+qs.length+' 题')}"
        );

        html = html.replace(

          "ptag.textContent=q.pos;const hint=(String(q.en||'').trim().match(/[A-Za-z]/)||['?'])[0].toLowerCase();qprompt.innerHTML='<span class=\"promptText\">'+esc(q.zh)+'</span><span class=\"answerHint\" aria-label=\"英文首字母提示\">'+esc(hint)+'</span>';answer.value=r.answer;"
        );

        const resultText = "function exampleSentence(q){const term=String(q.en||'').trim();const topics=['education policy','environmental protection','public health','urban planning','technology use','social equality','economic growth','family life'];let n=0;for(const ch of String((q.id||'')+term))n=(n*31+ch.charCodeAt(0))%997;const topic=topics[n%topics.length];const qmark=String.fromCharCode(34);if(!term)return 'A clear IELTS sentence should use the target expression accurately.';const frames=['Candidates can use '+qmark+term+qmark+' to discuss '+topic+' in IELTS Task 2.','A clear IELTS paragraph may include '+qmark+term+qmark+' when explaining '+topic+'.','In IELTS writing, '+qmark+term+qmark+' helps students express ideas about '+topic+' more precisely.'];return frames[n%frames.length]}function resultText(p,c,rw){return ['IELTS Writing 1000 Chinese-to-English Dictation','Name: '+(student.value.trim()||'No name'),'Score: '+c.c+'/'+qs.length+' ('+p+'%)','Wrong: '+c.w,'Flagged: '+c.f,'Time: '+fmt((endAt||Date.now())-startAt),'Finished: '+new Date().toLocaleString(),'Review:',...rw.flatMap(function(x){return [x.q.id+' | '+x.q.zh+' | '+x.q.en+' | answer: '+(x.r.answer||'未作答'),'IELTS sentence: '+exampleSentence(x.q)]})].join('\\n')}";
        html = html.replace(/function resultText\(p,c,rw\)\{return \['IELTS Writing 1000 Chinese-to-English Dictation'[\s\S]*?\]\.join\('\\n'\)\}/, resultText);

        return html;
      }

      try {
        const base = 'https://raw.githubusercontent.com/alexhan355/learn-github/5ac5545e6df3668cbfabe7fcf2201c6f85bb10d7/';
        const names = [1, 2, 3, 4].map(i => base + 'ielts-writing-1000-cn-en-dictation.part' + i + '.txt');
        const packed = (await Promise.all(names.map(name => fetch(name, { cache: 'force-cache' }).then(response => {
          if (!response.ok) throw new Error(name);
          return response.text();
        })))).join('').replace(/\s+/g, '');
        const bytes = Uint8Array.from(atob(packed), char => char.charCodeAt(0));
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        const html = patch(await new Response(stream).text());

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.body.innerHTML = '<div class="box">题库载入失败，请刷新页面。</div>';
      }
