<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雅思写作1000表达汉译英检测</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;background:#eef3f6;color:#172033;display:grid;place-items:center;min-height:100vh}.box{background:white;border:1px solid #d8e1e8;border-radius:8px;padding:22px;box-shadow:0 10px 24px #18223212;font-weight:800}</style></head><body><div class="box">题库载入中...</div><script>(async()=>{try{const names=['ielts-writing-1000-cn-en-dictation.part1.txt','ielts-writing-1000-cn-en-dictation.part2.txt','ielts-writing-1000-cn-en-dictation.part3.txt','ielts-writing-1000-cn-en-dictation.part4.txt'];const packed=(await Promise.all(names.map(n=>fetch(n,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(n);return r.text()})))).join('');const b=Uint8Array.from(atob(packed),c=>c.charCodeAt(0));const s=new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'));const h=await new Response(s).text();document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<div class="box">题库载入失败，请刷新页面。</div>'}})();</script></body></html>
